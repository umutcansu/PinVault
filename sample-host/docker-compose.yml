# sample-host — PinVault demo-server, Docker'da.
#
#   ./scripts/setup.sh              # .env + API anahtarı + LAN IP + signing key
#   docker compose up -d --build
#   ./scripts/smoke-test.sh         # sağlık + imza + yetki kontrolleri
#   ./scripts/client-config.sh      # Android client'a girilecek değerler
#
# Bu dosya DEMO profilidir. Üretim profili (./scripts/setup.sh --production)
# .env'e COMPOSE_FILE=docker-compose.yml:docker-compose.production.yml yazar;
# ikinci dosya bu dosyanın üstüne biner: yönetim portları yalnızca bu makineye
# açılır, mock host portları yayımlanmaz, test anahtarları sabit kapalıdır ve
# container sıkılaştırılır (docker-compose.production.yml).
services:
  pinvault-host:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        # demo-server kaynağı. Varsayılan: upstream git (PINVAULT_REPO @ PINVAULT_REF).
        # Yerel checkout (yayınlanmamış değişiklikler dahil) için .env'de:
        #   PINVAULT_SERVER_SRC=../demo-server
        pinvault-server: "${PINVAULT_SERVER_SRC:-${PINVAULT_REPO:-https://github.com/umutcansu/PinVault.git}#${PINVAULT_REF:-main}:demo-server}"
    container_name: pinvault-host
    restart: unless-stopped
    # PID 1 olarak küçük bir init (tini): komut imzalayıcının (CONFIG_SIGNERS=command)
    # alt süreçleri ve zaman aşımında öldürülenler zombi kalmasın.
    init: true
    ports:
      # Yönetim API + dashboard (düz HTTP): varsayılan olarak yalnızca bu makineden
      # (HOST_HTTP_BIND=127.0.0.1). Telefonların raporları ve uzaktan yönetim şifreli
      # porttan (HOST_MANAGEMENT_TLS_PORT) gider.
      - "${HOST_HTTP_BIND:-127.0.0.1}:${HOST_HTTP_PORT:-6650}:8080"
      # Yönetim API (TLS). Varsayılan olarak o da yalnızca bu makineden
      # (HOST_MANAGEMENT_TLS_BIND=127.0.0.1): telefonlar ve uçtan uca testler bu
      # porta ağdan bağlanmaz. Başka makineden dashboard için .env'de
      # HOST_MANAGEMENT_TLS_BIND=0.0.0.0 (ya da SSH tüneli). Üretim profili her
      # durumda 127.0.0.1'e bağlar.
      - "${HOST_MANAGEMENT_TLS_BIND:-127.0.0.1}:${HOST_MANAGEMENT_TLS_PORT:-6655}:8082"
      - "${HOST_HTTPS_PORT:-6651}:8081"  # Config API (TLS, self-signed; client'lar pin'ler)
      - "${HOST_MTLS_PORT:-6652}:8092"   # mTLS Config API (scripts/provision.sh oluşturur)
      - "${HOST_MOCK_TLS_PORT:-6653}:8443"   # Mock TLS hedef host (mock-tls.sample)
      - "${HOST_MOCK_MTLS_PORT:-6654}:8444"  # Mock mTLS hedef host (mock-mtls.sample)
      # Kurtarma kapısı: istemci sertifikası istemeyen TLS dinleyici, yalnızca
      # sertifika yenileme. Süresi dolmuş sertifikalı telefon buradan yeniler;
      # sertifikası sunucu CA'sının imzasını taşır, uygulama CA'ya pinler.
      - "${HOST_RECOVERY_PORT:-6656}:8083"
    environment:
      PORT: "8080"
      HTTPS_PORT: "8081"
      MANAGEMENT_HTTPS_PORT: "8082"
      RECOVERY_PORT: "8083"
      DB_PATH: /data/db/pinvault.db
      CERTS_DIR: /data/certs
      SIGNING_KEY_PATH: /data/signing-key.pem
      # demo | production. Sunucu okumaz; entrypoint.sh üretim profilinde açılış
      # kontrollerini buna göre yapar.
      SAMPLE_PROFILE: ${SAMPLE_PROFILE:-demo}
      # Sunucunun çalıştığı kullanıcı (entrypoint.sh root olarak başlar, data/'nın
      # sahipliğini buna verir ve yetkileri bırakır). Varsayılan imajdaki pinvault
      # kullanıcısı (10001). Linux'ta data/ dosyalarını kendi kullanıcınla okumak
      # istersen: PINVAULT_UID=$(id -u) PINVAULT_GID=$(id -g) (root olamaz).
      PINVAULT_UID: ${PINVAULT_UID:-}
      PINVAULT_GID: ${PINVAULT_GID:-}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-token}
      # Zorunlu. Yönetim uçları ve dashboard bu anahtarı ister; anonim admin kapalı.
      API_KEY: ${API_KEY:?API_KEY bos. Once ./scripts/setup.sh calistir.}
      CONFIG_TTL_SECONDS: ${CONFIG_TTL_SECONDS:-86400}
      # Telefonların bu makineye bağlandığı LAN IP. Container kendi içinden bu
      # adresi göremez; sunucu TLS sertifikası (yeniden) üretilirken SAN'a eklenir.
      EXTRA_CERT_SANS: ${HOST_LAN_IP:-}
      # İsteğe bağlı sunucu ayarları; boş bırakılınca sunucu varsayılanı geçerli.
      # Geçici değişiklik için: ./scripts/env-override.sh set KEY=VALUE ...
      # Parolalar: sunucu KEYSTORE_PASSWORD, VAULT_AT_REST_PASSWORD ve (yerel imzalayıcı
      # için) SIGNING_KEY_PASSWORD olmadan açılmaz; setup.sh üçünü de üretir.
      SIGNING_KEY_PASSWORD: ${SIGNING_KEY_PASSWORD:-}
      # true: parolalar boşken kaynak koddaki demo değerleriyle açıl (yalnızca
      # kullan-at denemeler). Üretim profilinde sabit "false".
      ALLOW_DEMO_SECRETS: ${ALLOW_DEMO_SECRETS:-}
      # "URL'den sertifika al" bu makineye ve yerel ağa yalnızca true iken bağlanır.
      # Demo: true (setup.sh yazar). Üretim: boş.
      FETCH_ALLOW_PRIVATE_TARGETS: ${FETCH_ALLOW_PRIVATE_TARGETS:-}
      ENROLLMENT_TOKEN_TTL_SECONDS: ${ENROLLMENT_TOKEN_TTL_SECONDS:-}
      # Onay bekleyen başvurular: cevapsız başvurunun ömrü (saat, varsayılan 24);
      # kodsuz başvurularda bir IP'den 10 dakikada en fazla yeni başvuru (20)
      # ve aynı anda bekleyebilecek en fazla başvuru (50).
      ENROLLMENT_REQUEST_TTL_HOURS: ${ENROLLMENT_REQUEST_TTL_HOURS:-}
      OPEN_ENROLLMENT_RATE_LIMIT: ${OPEN_ENROLLMENT_RATE_LIMIT:-}
      OPEN_ENROLLMENT_MAX_PENDING: ${OPEN_ENROLLMENT_MAX_PENDING:-}
      # Cihaz sertifikalarının ömrü (gün, varsayılan 90).
      CLIENT_CERT_TTL_DAYS: ${CLIENT_CERT_TTL_DAYS:-}
      # Yalnızca testler: kısa ömürlü sertifika kancası (/api/v1/test-hooks/client-cert-ttl).
      # Üretim profilinde sabit "false" (docker-compose.production.yml).
      ALLOW_TEST_HOOKS: ${ALLOW_TEST_HOOKS:-}
      VAULT_AT_REST_PASSWORD: ${VAULT_AT_REST_PASSWORD:-}
      VAULT_AT_REST_PASSWORD_PREVIOUS: ${VAULT_AT_REST_PASSWORD_PREVIOUS:-}
      CERT_EXPIRY_WARN_DAYS: ${CERT_EXPIRY_WARN_DAYS:-}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-}
      KEYSTORE_PASSWORD_PREVIOUS: ${KEYSTORE_PASSWORD_PREVIOUS:-}
      CLIENT_P12_PASSWORD: ${CLIENT_P12_PASSWORD:-}
      # Yalnızca testler (E02). Üretim profilinde sabit "false".
      ALLOW_ANONYMOUS_ADMIN: ${ALLOW_ANONYMOUS_ADMIN:-}
      # Yönetim dinleyicisi container içinde her arayüzü dinler; dışarıya hangi
      # adresten açıldığını yukarıdaki port eşlemesi (HOST_HTTP_BIND) belirler.
      # Sunucu anahtarsız modda (ALLOW_ANONYMOUS_ADMIN) kendiliğinden 127.0.0.1'e
      # bağlanırdı; o zaman yayımlanan porttan erişilemezdi.
      MANAGEMENT_BIND: ${MANAGEMENT_BIND:-0.0.0.0}
      # Anahtarsız modda yönetim isteği yalnızca bu adreslerle gelirse cevaplanır
      # (DNS rebinding'e karşı); dışarıdaki port container'ınkinden farklı.
      MANAGEMENT_ALLOWED_HOSTS: ${MANAGEMENT_ALLOWED_HOSTS:-localhost:${HOST_HTTP_PORT:-6650},127.0.0.1:${HOST_HTTP_PORT:-6650}}
      # Dashboard, Host başlığını değiştiren bir ters vekilin arkasındaysa onun adresi.
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
      # Vault dışındaki yönetici yüklemelerinin (anahtar deposu, sertifika, JSON) en büyük boyutu.
      ADMIN_UPLOAD_MAX_BYTES: ${ADMIN_UPLOAD_MAX_BYTES:-}
      # İsteğe bağlı güvenlik katmanları (README: "İsteğe bağlı güvenlik
      # katmanları"). Hepsi boşken sunucu önceki gibi davranır.
      # İmzalayıcılar: local (varsayılan) | pkcs11 | command; virgülle birden çok.
      CONFIG_SIGNERS: ${CONFIG_SIGNERS:-}
      CONFIG_SIGNATURE_CACHE: ${CONFIG_SIGNATURE_CACHE:-}
      PKCS11_LIBRARY: ${PKCS11_LIBRARY:-}
      PKCS11_SLOT_INDEX: ${PKCS11_SLOT_INDEX:-}
      PKCS11_PIN: ${PKCS11_PIN:-}
      PKCS11_KEY_LABEL: ${PKCS11_KEY_LABEL:-}
      PKCS11_GENERATE_KEY: ${PKCS11_GENERATE_KEY:-}
      SIGNER_COMMAND: ${SIGNER_COMMAND:-}
      SIGNER_PUBLIC_KEY: ${SIGNER_PUBLIC_KEY:-}
      SIGNER_PUBLIC_KEY_FILE: ${SIGNER_PUBLIC_KEY_FILE:-}
      SIGNER_INPUT: ${SIGNER_INPUT:-}
      SIGNER_TIMEOUT_MS: ${SIGNER_TIMEOUT_MS:-}
      # Komut imzalayıcısına geçen ek ortam değişkenleri (ör. AWS_PROFILE,AWS_REGION).
      SIGNER_PASS_ENV: ${SIGNER_PASS_ENV:-}
      # İmzalama anahtarı setleri: uygulamaya gömülü kurtarma anahtar(lar)ı.
      RECOVERY_PUBLIC_KEYS: ${RECOVERY_PUBLIC_KEYS:-}
      RECOVERY_REQUIRED_SIGNATURES: ${RECOVERY_REQUIRED_SIGNATURES:-}
      # Kişisel yönetici anahtarları (ad:sha256), iki kişi onayı, bildirim.
      ADMIN_KEYS: ${ADMIN_KEYS:-}
      ADMIN_KEYS_FILE: ${ADMIN_KEYS_FILE:-}
      PIN_CHANGE_APPROVALS: ${PIN_CHANGE_APPROVALS:-}
      APPROVAL_TTL_HOURS: ${APPROVAL_TTL_HOURS:-}
      APPROVAL_EXEMPT_OPERATIONS: ${APPROVAL_EXEMPT_OPERATIONS:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_EVENTS: ${NOTIFY_EVENTS:-}
      # Canlı sertifika kontrolü: off | warn | enforce.
      PIN_LIVE_CHECK: ${PIN_LIVE_CHECK:-}
      PIN_LIVE_CHECK_ALLOW_OVERRIDE: ${PIN_LIVE_CHECK_ALLOW_OVERRIDE:-}
      LIVE_CHECK_HOST_MAP: ${LIVE_CHECK_HOST_MAP:-}
      LIVE_CHECK_TIMEOUT_MS: ${LIVE_CHECK_TIMEOUT_MS:-}
      # Ekran kilidiyle açılan dosyaların anahtarı için donanım belgesi
      # (Android Key Attestation): off | warn | enforce (boş = warn).
      USER_AUTH_ATTESTATION: ${USER_AUTH_ATTESTATION:-}
      ATTESTATION_PACKAGE_NAMES: ${ATTESTATION_PACKAGE_NAMES:-}
      ATTESTATION_SIGNER_SHA256: ${ATTESTATION_SIGNER_SHA256:-}
      ATTESTATION_REQUIRE_VERIFIED_BOOT: ${ATTESTATION_REQUIRE_VERIFIED_BOOT:-}
      # Google'ın iptal listesi (scripts/fetch-attestation-status.sh indirir), bu
      # listenin en fazla kaç saatlik olabileceği (eskiyse hiçbir belge geçmez) ve
      # telefonun en eski kabul edilen güvenlik yaması (YYYYAA, ör. 202401).
      ATTESTATION_REVOKED_SERIALS_FILE: ${ATTESTATION_REVOKED_SERIALS_FILE:-}
      ATTESTATION_STATUS_MAX_AGE_HOURS: ${ATTESTATION_STATUS_MAX_AGE_HOURS:-}
      ATTESTATION_MIN_PATCH_LEVEL: ${ATTESTATION_MIN_PATCH_LEVEL:-}
      # Kayıtta donanım belgesi (off | warn | enforce), P12 ile kaydı kapatma (off)
      # ve ekran kilitli dosyalarda her kullanımda onay. Üretim profili en sıkı
      # değerleri yazar (.env.production.example). Bu adları tanımayan bir sunucu
      # sürümü onları yok sayar.
      ENROLLMENT_ATTESTATION: ${ENROLLMENT_ATTESTATION:-}
      ENROLLMENT_P12: ${ENROLLMENT_P12:-}
      USER_AUTH_REQUIRE_PER_USE: ${USER_AUTH_REQUIRE_PER_USE:-}
      # Host istemci sertifikası yalnızca cihaz host ACL'inin adını yazdığı
      # cihazlara (true); boş = sunucu varsayılanı (false: ACL'siz kapsam her
      # kayıtlı cihaza verir). Üretim profili true sabitler.
      HOST_CLIENT_CERT_REQUIRE_GRANT: ${HOST_CLIENT_CERT_REQUIRE_GRANT:-}
      # Config API portlarında yönetim uçları (on | off). Boş = on (demo:
      # panel betikleri ve uçtan uca testler cihaz portundan da yönetir).
      # Üretim profili off sabitler.
      CONFIG_API_ADMIN_ROUTES: ${CONFIG_API_ADMIN_ROUTES:-}
      # Attestation (ATTESTATION.md): /api/v1/attest* uçları, cihaz anahtarının ilk
      # kaydında donanım belgesi (off | warn | enforce), varsayılan politika
      # (strict | lenient), süreler, sınırlar ve mock host'ların token istemesi.
      # Boş = sunucu varsayılanı; üretim profili ATTESTATION_KEY_POLICY=enforce sabitler.
      ATTESTATION_ENABLED: ${ATTESTATION_ENABLED:-}
      ATTESTATION_KEY_POLICY: ${ATTESTATION_KEY_POLICY:-}
      ATTESTATION_POLICY_DEFAULT: ${ATTESTATION_POLICY_DEFAULT:-}
      ATTESTATION_TOKEN_TTL_SECONDS: ${ATTESTATION_TOKEN_TTL_SECONDS:-}
      ATTESTATION_INTERVAL_SECONDS: ${ATTESTATION_INTERVAL_SECONDS:-}
      ATTESTATION_NONCE_TTL_SECONDS: ${ATTESTATION_NONCE_TTL_SECONDS:-}
      ATTESTATION_REVEAL_REASONS: ${ATTESTATION_REVEAL_REASONS:-}
      ATTESTATION_RATE_LIMIT: ${ATTESTATION_RATE_LIMIT:-}
      ATTESTATION_DEVICE_RATE_LIMIT: ${ATTESTATION_DEVICE_RATE_LIMIT:-}
      MOCK_HOST_REQUIRE_TOKEN: ${MOCK_HOST_REQUIRE_TOKEN:-}
      # Kayıtta cihaz bütünlüğü (Play Integrity ya da bir RASP ürününün kararı):
      # off | warn | enforce (boş = off). Doğrulayıcı imajda:
      # /opt/pinvault/scripts/play-integrity-verify.sh. Servis hesabı dosyasını
      # data/ altına koyup yolunu INTEGRITY_PLAY_SERVICE_ACCOUNT_FILE'a yaz.
      INTEGRITY_VERIFICATION: ${INTEGRITY_VERIFICATION:-}
      INTEGRITY_VERIFIER_COMMAND: ${INTEGRITY_VERIFIER_COMMAND:-}
      INTEGRITY_VERIFIER_TIMEOUT_MS: ${INTEGRITY_VERIFIER_TIMEOUT_MS:-}
      INTEGRITY_PASS_ENV: ${INTEGRITY_PASS_ENV:-}
      INTEGRITY_PLAY_PACKAGE: ${INTEGRITY_PLAY_PACKAGE:-}
      INTEGRITY_PLAY_SERVICE_ACCOUNT_FILE: ${INTEGRITY_PLAY_SERVICE_ACCOUNT_FILE:-}
      INTEGRITY_PLAY_DEVICE_VERDICT: ${INTEGRITY_PLAY_DEVICE_VERDICT:-}
      INTEGRITY_PLAY_REQUIRE_LICENSED: ${INTEGRITY_PLAY_REQUIRE_LICENSED:-}
      INTEGRITY_PLAY_MAX_AGE_SECONDS: ${INTEGRITY_PLAY_MAX_AGE_SECONDS:-}
      # Kötüye kullanım sınırları (boş = sunucu varsayılanı).
      # Bir adresin 10 dakikada toplayabileceği ret sayısı (varsayılan 300). DEMO: 0
      # (sınır yok): Docker Desktop arkasında bütün cihazlar tek adresten görünür ve
      # uçtan uca testler bilerek çok sayıda reddedilen istek yapar. Üretim profili
      # sunucu varsayılanını kullanır.
      DEVICE_REFUSAL_RATE_LIMIT: ${DEVICE_REFUSAL_RATE_LIMIT:-0}
      REPORT_RATE_LIMIT: ${REPORT_RATE_LIMIT:-}
      REPORT_DEVICE_RATE_LIMIT: ${REPORT_DEVICE_RATE_LIMIT:-}
      DEVICE_KEY_RATE_LIMIT: ${DEVICE_KEY_RATE_LIMIT:-}
      DEVICE_KEY_LIMIT: ${DEVICE_KEY_LIMIT:-}
      VAULT_MAX_FILE_BYTES: ${VAULT_MAX_FILE_BYTES:-}
      # Aynı anda sunulan vault indirmesi: adres başına (varsayılan 4) ve toplam
      # (varsayılan 16; her indirme dosyayı bütün olarak bellekte tutar).
      VAULT_DOWNLOAD_CONCURRENCY: ${VAULT_DOWNLOAD_CONCURRENCY:-}
      VAULT_DOWNLOAD_CONCURRENCY_TOTAL: ${VAULT_DOWNLOAD_CONCURRENCY_TOTAL:-}
      MTLS_RESTART_MIN_INTERVAL_SECONDS: ${MTLS_RESTART_MIN_INTERVAL_SECONDS:-}
    volumes:
      # Bütün kalıcı durum tek dizin: veritabanı, sertifikalar ve imzalama
      # anahtarı. Anahtar dosyası tek tek (ve salt okunur) bağlanınca sunucu
      # onu yerinde güncelleyemiyordu: SIGNING_KEY_PASSWORD ile açılan at-rest
      # şifreleme göçü (ConfigSigningService) ve dashboard'daki "Anahtarı
      # Yenile" atomik rename yapıyor, tek dosyalık bind mount'un üzerine
      # rename ise "Device or resource busy" veriyor ve sunucu açılmıyordu.
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
