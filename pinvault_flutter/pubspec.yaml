name: pinvault_flutter
description: Dynamic certificate pinning, mTLS identity, and vault files for Flutter, bridging to the native PinVault libraries.
version: 2.4.0
homepage: https://github.com/umutcansu/PinVault

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.umutcansu.pinvault.flutter
        pluginClass: PinVaultFlutterPlugin
      ios:
        pluginClass: SwiftPinVaultFlutterPlugin
