group 'io.github.umutcansu.pinvault.flutter'
version '2.8.0'

buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Kotlin is built in (AGP 9) or applied by Flutter's Gradle plugin: the plugin
// does not apply KGP itself (docs.flutter.dev "Migrate to built-in Kotlin").
// KGP stays on the classpath for the `kotlin {}` block below.
apply plugin: 'com.android.library'

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

android {
    namespace 'io.github.umutcansu.pinvault.flutter'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // The native PinVault Android library (Maven Central).
    implementation("io.github.umutcansu:pinvault:2.8.0")
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    testImplementation "junit:junit:4.13.2"
    // The real org.json (android.jar only has stubs in JVM tests).
    testImplementation "org.json:json:20240303"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "com.squareup.okhttp3:okhttp-tls:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
}
