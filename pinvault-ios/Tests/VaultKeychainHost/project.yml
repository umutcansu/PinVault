# Runs the Keychain-backed vault tests (device RSA key, screen-lock key, the
# real Face ID sheet) hosted by an app on the simulator, where SwiftPM's own
# test runner gets errSecMissingEntitlement and skips them.
#
#   cd pinvault-ios/Tests/VaultKeychainHost && xcodegen generate     # the .xcodeproj is not committed
#   xcodebuild test -project VaultKeychainHost.xcodeproj -scheme VaultKeychainHost \
#     -destination 'platform=iOS Simulator,id=<udid>'
#
# The biometrics-only key tests (UserAuthKeychainKeysTests.testABiometricsOnlyKey…)
# need Face ID enrolled on the simulator (Features > Face ID > Enrolled), else they skip:
#   xcrun simctl spawn <udid> notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
#   xcrun simctl spawn <udid> notifyutil -p com.apple.BiometricKit.enrollmentChanged
#
# The manual Face ID check (UserAuthKeychainKeysTests.testManualFaceIDThroughTheSystemSheet):
#   xcrun simctl spawn <udid> notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
#   xcrun simctl spawn <udid> notifyutil -p com.apple.BiometricKit.enrollmentChanged
#   TEST_RUNNER_PINVAULT_MANUAL_FACEID=match xcodebuild test-without-building … \
#     -only-testing:VaultKeychainHostTests/UserAuthKeychainKeysTests/testManualFaceIDThroughTheSystemSheet
#   # once the log says "Face ID sheet is up":
#   xcrun simctl spawn <udid> notifyutil -p com.apple.BiometricKit_Sim.pearl.match      # or .nomatch
name: VaultKeychainHost
options:
  bundleIdPrefix: io.github.umutcansu.pinvault.tests
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  VaultKeychainHost:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../Sources/PinVault
        group: PinVault
    settings:
      base:
        PRODUCT_MODULE_NAME: PinVault
        PRODUCT_BUNDLE_IDENTIFIER: io.github.umutcansu.pinvault.tests.vaultkeychainhost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "PinVault vault Keychain tests"
        ENABLE_TESTABILITY: YES
  VaultKeychainHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../PinVaultTests/UserAuthKeychainKeysTests.swift
      - path: ../PinVaultTests/DeviceKeyProviderTests.swift
      - path: ../PinVaultTests/UserAuthPromptTests.swift
      - path: ../PinVaultTests/VaultFileTestSupport.swift
      - path: ../PinVaultTests/StoreTestSupport.swift
      - path: ../PinVaultTests/StoreKeyWrapKeychainTests.swift
    dependencies:
      - target: VaultKeychainHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.umutcansu.pinvault.tests.vaultkeychainhost.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VaultKeychainHost.app/VaultKeychainHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VaultKeychainHost:
    build:
      targets:
        VaultKeychainHost: all
        VaultKeychainHostTests: [test]
    test:
      targets:
        - VaultKeychainHostTests
