# sample-host değerleri. Derlemede BuildConfig alanlarına gömülür.
#
# Üretmek için: ../sample-host/scripts/client-config.sh --properties > sample-host.properties
# Başka bir dosya kullanmak için: ./gradlew installDebug -PsampleHostProps=/yol/dosya.properties
# (sample-e2e derlerken kendi dosyasını verir; bu dosyaya dokunmaz.)

# Host'un LAN IP'si ve portları (telefon aynı ağda olmalı).
host.ip=192.168.1.80
host.httpsPort=6651
host.mtlsPort=6652
# Sunucudaki Config API kimlikleri: uygulama, imzalı config'in bu kimlik için
# imzalanmış olmasını ister (serverScope). Boşsa bu kontrol yapılmaz.
host.tlsScope=default-tls
host.mtlsScope=sample-mtls
# Atestasyon (Approov benzeri): uygulama açılışta ve sonra 5 dakikada bir
# bütünlük raporunu (root, emülatör, hata ayıklayıcı, hooking, imza, klon…)
# Keystore anahtarıyla imzalayıp host'a gönderir; politika geçerse 5 dakikalık
# PinVault-Token alır ve pinli isteklere ekler, pin config'i de bu kanaldan
# tazelenir. Mock host MOCK_HOST_REQUIRE_TOKEN=true ile token'sız isteği reddeder.
# Boşsa true.
host.attestation=true

# Play Integrity, isteğe bağlı: Play Console → App integrity'de uygulamaya bağlı
# Cloud proje numarası. Doluysa rapor Google'ın nonce'a bağlı kararını da taşır;
# host bunu PLAY_INTEGRITY_DECRYPTION_KEY / PLAY_INTEGRITY_VERIFICATION_KEY ile
# doğrular (ATTESTATION.md §11). Boşsa Play Integrity hiç kullanılmaz.
host.playIntegrityProjectNumber=

# Host TLS sertifikasının SPKI SHA-256 pin'leri: birincil + yedek. "sha256/" öneki yok.
host.bootstrapPinPrimary=ojdBCq6JmAfnX3Lax1JPpBvI+N83qqg/ERgI0qkbPjo=
host.bootstrapPinBackup=NictvYYYR77/h02djf0SwZjIET/5fpbBIlq/lhoX6ow=

# Host'un config imzalama anahtarının public yarısı (X.509 SPKI, Base64).
host.signingPublicKey=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEhV/GUJAv4A77uf8C9XygQ225QOYWLF0Wck49+yXjV/9OE7uE8sVdhjxmNuXXgklz6bYA4oKIdkvQqNZaXM90WQ==

# İsteğe bağlı imza katmanları; boşsa yalnızca host.signingPublicKey kullanılır.
# Güvenilen bütün imza anahtarları, virgülle: sunucunun imzalayıcıları + çevrimdışı
# yedek anahtar(lar). Sunucunun anahtarı kaybolur/çalınırsa yedeğe geçilir, APK değişmez.
host.signingPublicKeys=
# Config başına gereken ayrı imza sayısı (m-of-n). Uygulama bunun altına inmez;
# test derlemelerinde Ayarlar ekranı yalnızca yükseltebilir. Üretim profili en az 2 yazar.
host.requiredSignatures=1
# Kurtarma anahtarları: imzalama anahtarı setini (anahtar döndürme/iptal) imzalayan
# çevrimdışı anahtarlar. Boşsa anahtar seti özelliği kapalıdır.
host.recoveryPublicKeys=

# mTLS: cihaz sertifikalarını imzalayan sunucu CA'sının SPKI pin'i (client-config.sh
# yazar). Kayıtta ve yenilemede gelen sertifika bu CA'nın imzasını taşımalı; başka
# bir CA'nın imzaladığı sertifika kurulmaz. CA değişecekse yenisini virgülle ekle.
# Boşsa ilk kayıtta gelen zincire güvenilir.
host.clientCaPin=

# Pin'leri host'tan gelen gerçek HTTPS hedefi.
target.host=www.example.com
# Hedefin sertifikası herkesin güvendiği bir CA'dan (www.example.com öyle): uygulama
# pin'le birlikte sistemin CA onayını da ister (requireCaTrust). Self-signed ya da
# kurum içi CA'lı bir hedef için false (client-config.sh --target-private-ca); release
# derlemesi false ile derlenmez. Boşsa true sayılır.
target.requireCaTrust=true
# Statik mod ve gömülü backend modu için hedefin pin'leri (yaprak,ara). Boşsa bu modlar kapalı.
target.pins=

# Host'taki mock hedef host'lar. Adlar uygulama içinde host.ip'ye çözümlenir (MockDns).
mock.tlsHost=mock-tls.sample
mock.tlsPort=6653
mock.mtlsHost=mock-mtls.sample
mock.mtlsPort=6654

# Özel backend modu (sample-e2e/lib/custom-backend.js). Boşsa mod kapalı.
custom.baseUrl=
custom.bootstrapPins=
custom.signingPublicKey=
