<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinVault - SSL Pin Manager</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">&#x1F512;</div>
      <div>
        <div class="app-title">PinVault</div>
        <div class="app-sub">SSL Pin Manager</div>
      </div>
    </div>

    <!-- Admin identity (GET /api/v1/admin/me) + governance badges; filled by app.js -->
    <div class="admin-chip" id="admin-chip"></div>

    <div class="sidebar-section" id="sidebar-hosts-label">Config API'ler</div>
    <div id="host-list" class="host-list">
      <div class="loading">Yükleniyor...</div>
    </div>
    <button class="btn-new" id="btn-add-api" data-action="showAddConfigApi">+ Config API</button>

    <div class="sidebar-divider"></div>

<!-- V2: Vault Files are scoped per Config API.
         Access them via each Config API's detail page → "Vault" tab. -->

    <div class="nav">
      <div class="nav-item" id="nav-health" data-action="showSection" data-arg0="health"></div>
      <div class="nav-item nav-item-badged" id="nav-approvals" data-action="showSection" data-arg0="approvals">
        <span id="nav-approvals-label"></span>
        <span class="nav-badge" id="approvals-badge" style="display:none"></span>
      </div>
      <div class="nav-item" id="nav-audit" data-action="showSection" data-arg0="audit"></div>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-footer">
      <div class="version-badge" id="version-badge" style="display:none"></div>
      <div class="force-status" id="force-status" style="display:none"></div>
      <div class="lang-toggle">
        <button class="lang-opt" id="lang-tr" data-action="setLang" data-arg0="tr">TR</button>
        <button class="lang-opt" id="lang-en" data-action="setLang" data-arg0="en">EN</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="content">
      <div class="empty-state">
        <div class="empty-icon">&#x1F510;</div>
        <div class="empty-title" id="empty-title">Host seçin</div>
        <div class="empty-sub" id="empty-sub">Sol menüden bir host seçin veya yeni host ekleyin.</div>
      </div>
    </div>
  </main>

</div>
<script src="/static/js/app-core.js"></script>
<script src="/static/js/app-i18n.js"></script>
<script src="/static/js/app-hosts.js"></script>
<script src="/static/js/app-sections.js"></script>
<script src="/static/js/app-governance.js"></script>
<script src="/static/js/app-vault.js"></script>
<script src="/static/js/app-main.js"></script>
</body>
</html>
