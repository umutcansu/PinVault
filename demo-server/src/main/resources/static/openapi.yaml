                type: object
                properties:
                  revoked: { type: string, example: 'true' }
        '400':
          description: '`tokenId` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No token with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

