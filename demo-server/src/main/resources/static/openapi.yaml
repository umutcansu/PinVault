              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultPutResult' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    delete:
      tags: [vault-admin]
      operationId: deleteScopedVaultFile
      summary: Delete a file from a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultDeleteResult' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/{key}/policy:
    put:
      tags: [vault-admin]
      operationId: putScopedVaultFilePolicy
      summary: Change a file's policy / encryption in a named scope
      description: |
        Mirror of `PUT /api/v1/vault/{key}/policy`. Invalid enum values trip a
        `require(...)`, which `StatusPages` on the management server turns into a
        JSON `500`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      requestBody:
        required: true
