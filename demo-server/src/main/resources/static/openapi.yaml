        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Distribution records for this device.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultDistribution' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/stats:
    get:
      tags: [vault-admin]
      operationId: scopedVaultStats
      summary: Distribution counters for a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: Counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultDistStats' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/devices/{deviceId}/public-key:
    delete:
      tags: [vault-admin]
      operationId: scopedResetDevicePublicKey
      summary: Remove a device's E2E key in a named scope
      description: |
        Frees the slot so the device's next registration counts as the first — for a
        device that lost its key without a token to prove itself with, or a slot
        someone else registered first. Audited as `device_key_reset`.
        `?purpose=user_auth` removes its user-auth key instead (the E2E key stays).

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `device_key_reset`). Both purposes. This is the only place a device key can be reset: the device-facing listeners have no such route.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
        - name: purpose
          in: query
          required: false
          description: '`user_auth` removes the device''s user-auth key instead of its E2E key.'
          schema: { type: string, enum: [e2e, user_auth], default: e2e }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Removed.
        '404':
          description: No key registered for this device in this scope.
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/devices/user-auth-keys:
    get:
      tags: [vault-admin]
      operationId: listUserAuthKeys
      summary: The user-auth keys of a scope, with what attestation said about each
      description: |
        Every device's user-auth key in this scope and the outcome of its Android
        Key Attestation check at registration (`USER_AUTH_ATTESTATION`):
        `attestation` is null when it was not checked (`off`, or a key registered
        before the check existed), else `attested` (the chain passed), the
        `securityLevel` (`tee`, `strongbox`, `software`) and the `reason` (`ok` or why
        it failed, e.g. `chain_missing` for a key accepted on first use under `warn`).
        A key that is not attested can be reset (`DELETE …/public-key?purpose=user_auth`)
        so the device registers an attested one.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: The keys, by device id.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceId: { type: string }
                    configApiId: { type: string }
                    publicKeyPem: { type: string }
                    algorithm: { type: string }
                    registeredAt: { type: string }
                    attestation:
                      type: object
                      nullable: true
                      properties:
                        attested: { type: boolean }
                        securityLevel: { type: string, nullable: true, enum: [tee, strongbox, software] }
                        reason: { type: string, nullable: true, example: ok }
                        keyKind:
                          type: string
                          nullable: true
                          enum: [per_use, time_bound]
                          description: >
                            How the key asks for the user (read from a passing attestation; null
                            otherwise, or for a key registered before 2.2.0): on every use, or
                            for `authTimeoutSeconds` after an unlock (Android 7–10 phones without
                            a strong fingerprint).
                        authTimeoutSeconds: { type: integer, nullable: true, example: 10 }
                        biometricOnly: { type: boolean, nullable: true, description: Only a biometric unlocks it (not the screen-lock PIN / pattern / password). }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # governance
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/admin/me:
    get:
      tags: [governance]
      operationId: getAdminMe
      summary: Who the presented key belongs to, and which governance features are on
      description: |
        `name` is the admin behind `X-API-Key`: `admin` for the shared `API_KEY`, the
        name of an `ADMIN_KEYS` entry, or `anonymous` with
        `ALLOW_ANONYMOUS_ADMIN=true`. The other fields are the server's governance
        settings, for the dashboard's identity chip.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The caller and the governance settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMe' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/audit-log:
    get:
      tags: [governance]
      operationId: listAuditLog
      summary: Page through the hash-chained audit log
      description: |
        Newest first. Every successful admin write is recorded and attributed to the
        admin who made it: pin diffs (`pins_changed`, whichever route wrote them),
        the approval workflow, live-check decisions, signing-key changes, invalid
        API keys (`auth_failed`, at most one per source address per minute),
        certificate expiry warnings (`cert_expiring`, once a day per host) and, for
        writes without a more specific entry, a generic `http` entry whose `target`
        is `METHOD /path?query`.

        The log is append-only (database triggers refuse UPDATE and DELETE) and
        chained: `hash` = SHA-256 over `prevHash` and every field, so an edit made
        behind the triggers' back breaks `GET /api/v1/audit-log/verify`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1–500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: action
          in: query
          required: false
          description: Only entries with this action. Any other value matches nothing.
          schema:
            type: string
            enum: [pins_changed, change_requested, change_approved, change_applied, change_failed,
                   change_rejected, change_expired, change_stale, live_check_warning,
                   live_check_blocked, live_check_overridden, signing_key_regenerated,
                   signing_keyset_uploaded, auth_failed, cert_expiring, notification_test, http]
        - name: configApiId
          in: query
          required: false
          description: Only entries recorded for this Config API scope.
          schema: { type: string }
      responses:
        '200':
          description: One page and the number of entries matching the filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/audit-log/verify:
    get:
      tags: [governance]
      operationId: verifyAuditLog
      summary: Recompute the audit chain
      description: |
        Walks the whole log from the first entry and recomputes every link and hash.
        `ok: false` names the first entry whose `prevHash` or `hash` does not hold —
        that entry (or the one before it) was altered or removed.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The result of the check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditChainCheck' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests:
    get:
      tags: [governance]
      operationId: listChangeRequests
      summary: Pin and key changes waiting for (or decided by) a second admin
      description: |
        Newest first, at most 100. Requests past their expiry are marked `expired`
        (and audited) before the list is read. Only produced while
        `PIN_CHANGE_APPROVALS>=2`; see the `202` answer of the pin-affecting routes.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Filter by status; `all` or omitted = every request. `open` = still to be
            decided or run (`pending` and `approved`).
          schema:
            type: string
            enum: [pending, approved, open, applied, failed, rejected, expired, stale, all]
      responses:
        '200':
          description: Matching change requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests/{id}:
    get:
      tags: [governance]
      operationId: getChangeRequest
      summary: One change request
      description: |
        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ChangeRequestIdPath'
      responses:
        '200':
          description: The change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: '`id` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests/{id}/approve:
    post:
      tags: [governance]
      operationId: approveChangeRequest
      summary: Approve a pending change (and apply it once enough admins did)
      description: |
        Records the caller's approval. Once `PIN_CHANGE_APPROVALS - 1` distinct admins
        other than the requester approved, the server replays the stored request —
        method, path, query and body — through its own management port, as the
        requester, and stores the outcome: `applied` (2xx) or `failed` (with
        `resultStatus` / `resultBody`, e.g. `422` from an enforced live check). The
        answer is the updated request in every case.

        Refused with `409` (never `403`, so a dashboard does not mistake it for a bad
        key): the requester approving their own change, the shared `API_KEY`
        (it does not say who approves), an admin approving twice, a request that is
        no longer pending, and a full-config write whose scope changed after it was
        requested — that request is marked `stale` instead of undoing the newer
        change.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ChangeRequestIdPath'
      responses:
        '200':
          description: >
            The updated request: `pending` (more approvals needed), `applied` or
            `failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: '`id` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Self-approval, shared key, already approved, not pending, or stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'The admin who requested a change cannot approve it — another admin must.' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests/{id}/reject:
    post:
      tags: [governance]
      operationId: rejectChangeRequest
      summary: Reject a pending change (or withdraw your own)
      description: |
        Any admin may reject a pending request; its requester withdraws it the same
        way. The optional `reason` (first 500 characters) is stored and audited.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ChangeRequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: wrong host }
      responses:
        '200':
          description: The request, now `rejected`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: '`id` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The request is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/notifications:
    get:
      tags: [governance]
      operationId: getNotificationStatus
      summary: Webhook configuration and the latest deliveries
      description: |
        `target` is the webhook's scheme, host and port only — the path of a
        Slack/Teams webhook URL is itself a secret. `recent` holds the last 50
        deliveries, newest first, after their final attempt (up to 3, with backoff).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: 'Notification status (`configured: false` without `NOTIFY_WEBHOOK_URL`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/notifications/test:
    post:
      tags: [governance]
      operationId: sendTestNotification
      summary: Record and send a test notification
      description: |
        Writes a `notification_test` audit entry and queues its webhook delivery
        (asynchronous — check `GET /api/v1/notifications` for the outcome).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTestResult' }
        '409':
          description: No webhook is configured (`NOTIFY_WEBHOOK_URL` unset).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/pins/live-check:
    post:
      tags: [governance]
      operationId: checkPinsLive
      summary: Dry-run the live certificate check
      description: |
        Contacts each host (or its `LIVE_CHECK_HOST_MAP` target, on its `:port` or
        443) and reports whether the **leaf** certificate it serves right now is in
        the given set. Saves nothing, and works whatever `PIN_LIVE_CHECK` is set to
        (`mode` reports the setting). The pin editor calls this before saving.

        A self-signed host, or an mTLS host that then demands a client certificate,
        still yields its chain. Unmapped wildcard entries cannot be probed.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pins]
              properties:
                pins:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [hostname, sha256]
                    properties:
                      hostname: { type: string, example: api.example.com }
                      sha256:
                        type: array
                        items: { type: string }
      responses:
        '200':
          description: One check per host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveCheckResult' }
        '400':
          description: Malformed body, or more than 50 hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # attestation — device side (ATTESTATION.md §2)
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/attest/challenge:
    get:
      tags: [attestation]
      operationId: getAttestationChallenge
      summary: A single-use attestation nonce
      description: |
        The nonce is stateless: `base64url( ts(8 bytes) ‖ rand(16) ‖
        HMAC-SHA256(nonceKey, ts‖rand)[0..16) )`. The server verifies the MAC and
        the age (≤ `ATTESTATION_NONCE_TTL_SECONDS`, default 120 s) and keeps a
        bounded replay cache of the nonces it accepted. `serverTime` lets the
        library notice a wildly wrong device clock; it is informational only.

        Public (`isPublicEndpoint`), rate-limited per source address
        (`ATTESTATION_RATE_LIMIT`), counted by the device refusal limiter. Served
        only while `ATTESTATION_ENABLED=true` (`404` otherwise).

        Registered on: **config-api** listeners only.
      security: []
      x-registered-on: config-api
      responses:
        '200':
          description: A fresh nonce.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationChallenge' }
        '429':
          description: Too many challenges from this source address (`Retry-After` set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/attest:
    post:
      tags: [attestation]
      operationId: attest
      summary: Attest an app instance and receive a PinVault-Token
      description: |
        The library measures the app and the device (`DeviceIntegrityProbe`), signs
        `pinvault-attest:v1:<nonce>:<deviceId>:<sha256-hex(report)>` with its device
        key (`SHA256withECDSA`, DER) and posts the report **as a string**. The
        server checks, in order: JSON / version / report size (`400 invalid_json`,
        `400 unsupported_version`, `400 report_too_large`), the nonce (`400
        nonce_invalid`, `400 nonce_expired`, `400 nonce_replayed`), the signature
        (`401 signature_invalid`), revocation (`403 device_revoked`), the device key
        (`403 key_mismatch` for a known device with another key; first registration
        under `ATTESTATION_KEY_POLICY=enforce` needs a valid Android key attestation
        chain: `403 attestation_required` / `403 attestation_invalid`), then the
        rejection policy of this Config API (ATTESTATION.md §4).

        On `pass` the answer carries a `PinVault-Token` (HS256 JWT, `tokenTtlSeconds`,
        `aud` = this Config API id) and, when `currentConfigVersion` /
        `currentIssuedAt` differ from what the server would serve, the same signed
        config envelope `GET /api/v1/certificate-config` serves (scoped by the
        device's host ACL). On `reject` there is **no token and no config**; the
        ARC is always present and resolves in the dashboard to the reasons, which
        the device itself sees only when the policy's `revealReasons` is on.

        Audited: `attestation_device_registered` (first registration),
        `attestation_key_mismatch`, `attestation_rejected` (routine; not in `*`
        webhooks). Public, rate-limited per source address and per device id
        (`ATTESTATION_DEVICE_RATE_LIMIT`), body capped at 64 KB.

        Registered on: **config-api** listeners only.
      security: []
      x-registered-on: config-api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestationRequest' }
      responses:
        '200':
          description: The verdict — a token only on `pass`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationResponse' }
        '400':
          description: '`invalid_json`, `unsupported_version`, `report_too_large`, `nonce_invalid`, `nonce_expired`, `nonce_replayed`, or a malformed field.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: '`signature_invalid` — the signature does not verify with `publicKey`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`device_revoked`, `key_mismatch`, `attestation_required` or `attestation_invalid` (with the verifier''s reason).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Body larger than the 64 KB device limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit of the source address or the device id (`Retry-After` set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────────────────────────────────────────────────
  # attestation — admin (ATTESTATION.md §6)
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/config-apis/{id}/attestation/policy:
    get:
      tags: [attestation]
      operationId: getAttestationPolicy
      summary: The rejection policy of a Config API
      description: |
        Stored per Config API (`attestation_policies`). When none is stored the
        answer is the `ATTESTATION_POLICY_DEFAULT` preset (`strict` or `lenient`)
        with `version: 0`, `tokenTtlSeconds` = `ATTESTATION_TOKEN_TTL_SECONDS`,
        `attestIntervalSeconds` = `ATTESTATION_INTERVAL_SECONDS` and
        `revealReasons` = `ATTESTATION_REVEAL_REASONS`.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
      responses:
        '200':
          description: The policy in force.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationPolicy' }
        '404':
          description: No Config API with this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [attestation]
      operationId: putAttestationPolicy
      summary: Replace the rejection policy of a Config API
      description: |
        The whole object (ATTESTATION.md §4), every field optional: a flag or
        field left out keeps its current value. Every one of the twelve flags
        takes `reject`, `warn` or `ignore`; `tokenTtlSeconds` is 30..86400 and
        `attestIntervalSeconds` 60..86400. The server bumps `version` on every
        change (the `version` sent is ignored; a PUT that changes nothing keeps
        the version and is not audited); tokens carry it in their `pol` claim.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `attestation_policy`). Audited as `attestation_policy_updated`.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestationPolicy' }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The stored policy, with its new `version`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationPolicy' }
        '400':
          description: '`invalid_policy` — not a JSON object, an unknown flag or action, or a duration out of range (`message` says which).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{id}/attestation/devices:
    get:
      tags: [attestation]
      operationId: listAttestedDevices
      summary: Attested devices of a Config API
      description: |
        Every device that registered a key with this Config API, with its last
        verdict (`result`, `arc`, `rejectionReasons`, `warnings`), key security level
        and attestation state, first / last seen and its annotations and overrides.
        The ARC of a verdict resolves here: the dashboard shows the reasons behind
        the code the device was given.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
        - name: result
          in: query
          required: false
          description: Only devices whose last verdict is this.
          schema: { type: string, enum: [pass, reject] }
        - name: q
          in: query
          required: false
          description: Substring of the device id, an annotation, a reason or a warning, or an exact ARC.
          schema: { type: string, maxLength: 128 }
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: One page of devices, most recently seen first (an unknown Config API has none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestedDevicePage' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{id}/attestation/devices/{deviceId}:
    get:
      tags: [attestation]
      operationId: getAttestedDevice
      summary: One attested device with its last report
      description: |
        The device row of the listing plus `lastReport`: the last report the
        device sent, **trimmed** to its `app` and `device` blocks and the `signals`
        with their evidence (ATTESTATION.md §3). The `verdictProvider` token, when
        the app forwards one, is stored and reported by name; the reference server
        does not verify it.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: The device and its last report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestedDeviceDetail' }
        '404':
          description: '`device_not_found` — no row for this device in this Config API.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [attestation]
      operationId: annotateAttestedDevice
      summary: Overrides and annotations of a device
      description: |
        `forceFail` makes every attestation of the device a `reject` with reason
        `force_fail`; `forcePass` makes it a `pass` with every raised flag demoted
        to a warning (both are evaluated before the policy; they cannot both be
        set). `annotations` replace the device's list and travel in the token's
        `anno` claim (support cases, canary groups, "staff device"). A device that
        never attested gets an unregistered row, so it can be annotated ahead of
        its first attestation.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `attestation_device`). Audited as `attestation_device_annotated`
        when something changed.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestedDeviceUpdate' }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The updated device (with `lastReport`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestedDeviceDetail' }
        '400':
          description: '`invalid_device_id`, `invalid_annotation` (not strings, a bad character, over 64 characters or more than 16) or `conflicting_overrides` (`forcePass` and `forceFail` both set).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    delete:
      tags: [attestation]
      operationId: forgetAttestedDevice
      summary: Forget a device's key so it can register again
      description: |
        A reinstall on the same phone generates a new device key, which the server
        refuses with `403 key_mismatch` until an operator forgets the registered one.
        Deleting the record lets the next attestation register the device afresh
        (`ATTESTATION_KEY_POLICY` applies as for a first registration). Annotations
        and overrides of the device are deleted with it.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `attestation_device`, like the annotation PUT). Audited as
        `attestation_device_forgotten`.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The device was forgotten.
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten: { type: boolean, example: true }
                  deviceId: { type: string }
        '404':
          description: '`device_not_found` — no row for this device in this Config API.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{id}/attestation/stats:
    get:
      tags: [attestation]
      operationId: getAttestationStats
      summary: Attestation counts of the last 24 hours and 7 days
      description: |
        Passes, rejects, rejects by reason and warnings by flag for the two
        windows (hourly counters, kept 30 days), plus how many devices are in
        each state now and the policy version in force. What the dashboard's
        stats strip shows; a fleet measurement to look at before tightening the
        policy.

        Registered on: **management** (and the Config API ports when
        `CONFIG_API_ADMIN_ROUTES=on`).
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/AttestationConfigApiIdPath'
      responses:
        '200':
          description: Counts per window (all zero for an unknown Config API).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationStats' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/attestation/token-secrets:
    get:
      tags: [attestation]
      operationId: listTokenSecrets
      summary: The PinVault-Token signing secrets
      description: |
        The active secret and the previous ones still kept for verification,
        **with their values**: backends load every listed secret keyed by `kid` and
        verify a token's HS256 signature with the one its header names. Secrets
        are 32 random bytes each, encrypted at rest with `VAULT_AT_REST_PASSWORD`.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): a secret read, so it
        answers `202` with `runAfterApproval: true` (operation
        `attestation_token_secrets`); once approved, the requester sends the
        same `GET` again and receives the secrets alone. Answered with
        `Cache-Control: no-store`. The first secret is made on first use, so the
        listing is never empty.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Every secret a backend needs, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenSecretList' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/attestation/token-secrets/rotate:
    post:
      tags: [attestation]
      operationId: rotateTokenSecret
      summary: Make a new active PinVault-Token secret
      description: |
        Generates a new secret, makes it the active one and keeps the previous
        ones for verification until they are deleted. New tokens are signed with
        the new `kid` at once, so backends must load it (`GET
        /api/v1/attestation/token-secrets`) before they see such a token.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `attestation_token_secret_rotate`). Audited as
        `attestation_token_secret_rotated` (never the secret itself).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The new active secret's id (the value is read from the listing).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenSecretRotated' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/attestation/token-secrets/{kid}:
    delete:
      tags: [attestation]
      operationId: deleteTokenSecret
      summary: Drop a previous PinVault-Token secret
      description: |
        Removes a secret that is no longer active. Tokens signed with it stop
        verifying, which matters for at most one token lifetime after a rotation.
        The active secret cannot be deleted (`409 secret_active`); rotate first.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `attestation_token_secret_delete`). Audited as
        `attestation_token_secret_deleted`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: kid
          in: path
          required: true
          description: 'The key id as the listing and the token header (`kid`) show it.'
          schema: { type: string }
          example: 2026-10-05-01
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The secret was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string, description: 'The deleted `kid`.', example: 2026-10-05-01 }
        '404':
          description: '`secret_not_found` — no secret with this `kid`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`secret_active` — the active secret is not deleted; rotate first.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        The shared `API_KEY` or a personal `ADMIN_KEYS` key (configured as its
        SHA-256), compared in constant time. Enforced on the
        management server and on every Config API listener by the `ApiKeyAuth`
        plugin, except for the paths allowlisted in `isPublicEndpoint`. When
        `API_KEY` is unset the server refuses to start unless
        `ALLOW_ANONYMOUS_ADMIN=true`, which disables authentication entirely.

  parameters:

    ConfigApiIdPath:
      name: configApiId
      in: path
      required: true
      description: Config API scope id, e.g. `default-tls`.
      schema: { type: string }
      example: default-tls

    AttestationConfigApiIdPath:
      name: id
      in: path
      required: true
      description: Config API scope id, e.g. `default-tls`.
      schema: { type: string }
      example: default-tls

    ConfigApiIdQuery:
      name: configApiId
      in: query
      required: false
      description: >
        Scope selector, honoured on the management server. On a Config API listener
        the parameter is read but the listener's own id is the fallback, so the
        effective scope is whatever is passed — omit it there. Defaults to the
        listener's mount id (`default-tls` on the management server).
      schema: { type: string }

    HostnamePath:
      name: hostname
      in: path
      required: true
      schema: { type: string }
      example: api.example.com

    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: The value the device sends as `X-Device-Id` (its ANDROID_ID).
      schema: { type: string }

    VaultKeyPath:
      name: key
      in: path
      required: true
      description: >
        Vault file key. The client-facing routes require `^[A-Za-z0-9._-]{1,64}$` and
        forbid the reserved segments `distributions`, `stats`, `devices`, `report`,
        `tokens`.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      example: ml-model

    TokenIdPath:
      name: tokenId
      in: path
      required: true
      description: Numeric vault-token id from a token listing or issue response.
      schema: { type: integer, format: int64 }

    VaultPolicyQuery:
      name: policy
      in: query
      required: false
      description: >
        Access policy to store. Omitted keeps the existing value, or defaults to
        `token` on first upload. Not validated on upload — only
        `PUT .../policy` enforces the enum.
      schema: { type: string, enum: [public, api_key, token, token_mtls] }

    VaultEncryptionQuery:
      name: encryption
      in: query
      required: false
      description: >
        Encryption mode to store. Omitted keeps the existing value, or defaults to
        `plain` on first upload.
      schema: { type: string, enum: [plain, at_rest, end_to_end, user_auth] }

    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: false
      description: >
        Stable device identifier (ANDROID_ID). Used for host-ACL scoping on config
        fetches and for `token` / `token_mtls` / `end_to_end` vault access. On an
        mTLS listener the config endpoint falls back to the client certificate CN
        (`PinVault Client: <clientId>`) when this header is absent.
      schema: { type: string }

    VaultTokenHeader:
      name: X-Vault-Token
      in: header
      required: false
      description: >
        Per-device, per-file token plaintext from
        `POST /api/v1/vault/{key}/tokens`. Required for `token` and `token_mtls`
        files.
      schema: { type: string }

    LiveCheckOverrideQuery:
      name: liveCheckOverride
      in: query
      required: false
      description: >
        Reason for storing a pin set that `PIN_LIVE_CHECK=enforce` refused (`422`).
        Accepted unless `PIN_LIVE_CHECK_ALLOW_OVERRIDE=false`; the override and its
        reason are audited (`live_check_overridden`) and notified. Keep the other
        query parameters (e.g. `configApiId`) when resending. Has no effect when the
        check passes, is off, or only warns.
      schema: { type: string }
      example: host switches to the new certificate at 18:00

    ChangeRequestIdPath:
      name: id
      in: path
      required: true
      description: Change request id — `changeRequestId` of the `202` answer.
      schema: { type: integer, format: int64 }
      example: 12

    PinVaultFeaturesHeader:
      name: X-PinVault-Features
      in: header
      required: false
      description: >
        Comma-separated client capabilities. `redelivery` (PinVault library 2.1+)
        means the client accepts the same signed envelope twice, so it may be served
        a cached one when `CONFIG_SIGNATURE_CACHE=true`. Without it every request is
        signed fresh, as before.
      schema: { type: string }
      example: redelivery

  headers:

    LiveCheckWarning:
      description: >
        `warn` when `PIN_LIVE_CHECK=warn` stored a pin set that failed the live
        certificate check (audited as `live_check_warning`, details there). Absent
        otherwise.
      schema: { type: string, enum: [warn] }

  responses:

    MissingApiKey:
      description: '`X-API-Key` header absent (only when `API_KEY` is configured).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'X-API-Key header required' }

    InvalidApiKey:
      description: >
        `X-API-Key` does not match the configured key. Without admin keys
        (`ALLOW_ANONYMOUS_ADMIN=true`): `admin_key_required` on a Config API
        listener (no admin route is served there), `peer_not_allowed` when the
        connection is not from loopback or `ANONYMOUS_ADMIN_PEERS`. After
        `ADMIN_AUTH_FAILURE_LIMIT` (30) invalid keys in 10 minutes the source
        address gets `429` (`Retry-After: 600`) on every admin route.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Invalid API key' }

    PendingApproval:
      description: >
        `PIN_CHANGE_APPROVALS>=2`: the request was **not executed**. It is stored as
        a change request and replayed, as the requester, once enough other admins
        approve it (`POST /api/v1/change-requests/{id}/approve`) — or, when
        `runAfterApproval` is true, run by the requester sending the same request
        again after the approval. Management listener only. A body larger than the
        admin cap is `413`; a request that cannot be described is `400`, and a
        certificate change the live check refuses is `422`, both before anything
        is stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PendingApproval' }

    AdminBodyTooLarge:
      description: >
        The body is larger than `ADMIN_UPLOAD_MAX_BYTES` (default 1 MB; keystores,
        certificates and JSON bodies of admin routes). Refused while it is read.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: body_too_large, message: 'At most 1048576 bytes.' }

    LiveCheckRejected:
      description: >
        `PIN_LIVE_CHECK=enforce` refused the pin set: for at least one new or changed
        host, the leaf certificate it serves now is not in the new pins, or the host
        could not be reached. Nothing was stored. When `overridable` is true, resend
        the same request with `liveCheckOverride=<reason>` added to the query string.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LiveCheckRejection' }

    ApprovalViaManagementOnly:
      description: >
        Config API listener while `PIN_CHANGE_APPROVALS>=2`: pin- and key-affecting
        writes are accepted only through the management API, where they can wait
        for a second admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Pin changes need approval (PIN_CHANGE_APPROVALS) and are accepted only through the management API.' }

  schemas:

    # ── Errors ──────────────────────────────────────────────────────────

    Error:
      type: object
      description: >
        Standard error envelope. Some handlers emit Turkish messages
        (e.g. `hostname gerekli`, `Host bulunamadi`).
      properties:
        error: { type: string }

    BackupRotationError:
      type: object
      description: >
        Why switching to the backup key was refused. Branch on `reason`;
        `error` is an English explanation.
      properties:
        reason:
          type: string
          enum: [no_backup_key, backup_not_published]
        error: { type: string }

    ErrorList:
      type: object
      description: Multi-error envelope used by pin-config validation.
      properties:
        errors:
          type: array
          items: { type: string }

    Saved:
      type: object
      properties:
        saved: { type: boolean, example: true }

    # ── Pin configuration ───────────────────────────────────────────────

    HostPin:
      type: object
      description: One pinned host. Mirrors `model/PinConfig.kt`.
      required: [hostname, sha256]
      properties:
        hostname:
          type: string
          description: 'Exact host, or a wildcard matching one sub-label (`*.example.com`).'
          example: api.example.com
        sha256:
          type: array
          description: >
            Base64 SHA-256 SPKI pins. At least two (primary + backup) are required by
            `PUT /api/v1/certificate-config`; each must be 44 characters decoding to
            32 bytes.
          items: { type: string }
          example: ['ziA0hyMDbayVXZ0g8AkkJz+wmKPZYjMAwb+GdNg5HYM=', 'wJGpE3i95h7E0ylT93TyLwC1BqXuK4IfoqhmtSrq5gQ=']
        version:
          type: integer
          default: 1
          description: >
            Per-host version, assigned by the server. Never moves backwards, even
            across delete + re-add. Clients reject downgrades.
        forceUpdate:
          type: boolean
          default: false
          description: Tells the client to apply this host's pins immediately.
        mtls:
          type: boolean
          default: false
          description: This host needs a client certificate.
        clientCertVersion:
          type: integer
          nullable: true
          description: >
            Bumped by `POST /api/v1/hosts/{hostname}/upload-client-cert`; a change
            triggers `syncHostClientCerts()` on the device.

    CertificateConfig:
      type: object
      description: The pin configuration (`PinConfig`).
      required: [pins]
      properties:
        version:
          type: integer
          default: 0
          description: 'Legacy global version; the effective value is `max(pins[].version)`.'
        pins:
          type: array
          items: { $ref: '#/components/schemas/HostPin' }
        forceUpdate:
          type: boolean
          default: false
          description: Global force flag. The client treats any per-host flag as equivalent.
        trustRoots:
          type: array
          items: { type: string }
          description: >
            Managed trust roots (ATTESTATION.md §10): SHA-256 SPKI pins of root CAs,
            same format as a pin, at most 64, no duplicates. A client with
            `managedTrustRoots()` accepts, for a host with NO pin entry, a chain the
            platform validates to one of these roots. Omitted from responses when
            empty. On PUT a body that carries the field replaces the list; a body
            without it keeps the scope's current list.
        issuedAt:
          type: integer
          format: int64
          default: 0
          description: >
            Unix epoch ms, stamped at response time when the config is signed. `0` on
            unsigned responses. Clients reject replays where this is not strictly
            greater than the stored value.
        expiresAt:
          type: integer
          format: int64
          default: 0
          description: >
            Unix epoch ms; `issuedAt + CONFIG_TTL_SECONDS` (default 24 h). `0` on
            unsigned responses. Clients reject the payload once the wall clock passes it.
        configApiId:
          type: string
          description: >
            Signed payloads only (2.2.0): the Config API the config was signed for. A
            library block with `serverScope(id)` refuses a payload that names another
            id or none, so an envelope of one Config API cannot be replayed on another
            that shares the signing key. Absent from unsigned responses.
          example: default-tls

    SignedConfig:
      type: object
      description: Signed envelope returned unless `?signed=false`.
      required: [payload, signature]
      properties:
        payload:
          type: string
          description: >
            JSON-encoded `CertificateConfig` with `issuedAt` / `expiresAt` stamped.
            Verify the signature over these exact bytes before parsing.
        signature:
          type: string
          description: >
            Base64 `SHA256withECDSA` signature over `payload` by the primary signer.
        keyId:
          type: string
          description: >
            Key id (Base64 SHA-256 of the SPKI) of the primary signer — an unsigned
            hint for picking the key. Optional; older clients ignore it.
        signatures:
          type: array
          description: >
            Present only with more than one signer (`CONFIG_SIGNERS`): one signature
            per signer over `payload`, primary first. Devices configured with
            `requiredSignatures(n)` need n valid ones from keys they trust.
          items: { $ref: '#/components/schemas/SignatureEntry' }
        signingKeys:
          description: >
            The latest signing-key set the operator uploaded (rotation /
            revocation), attached to every envelope once one exists. Absent before.
          allOf:
            - $ref: '#/components/schemas/SignedKeySet'

    PinConfigHistoryEntry:
      type: object
      properties:
        hostname: { type: string }
        version: { type: integer }
        timestamp: { type: string, format: date-time }
        event:
          type: string
          enum:
            - cert_generated
            - cert_regenerated
            - cert_uploaded
            - cert_fetched
            - fetched_from_url
            - host_added
            - host_removed
            - pins_updated
            - force_update
            - mtls_enabled
            - mtls_disabled
            - client_cert_uploaded
        pinPrefix:
          type: string
          description: First 12 characters of the primary pin, for display.

    # ── Hosts ───────────────────────────────────────────────────────────

    HostActionResponse:
      type: object
      description: Result of any host mutation that changes pins.
      properties:
        hostname: { type: string }
        sha256Pins:
          type: array
          items: { type: string }
        certValidUntil: { type: string, nullable: true, format: date-time }
        version:
          type: integer
          description: The host's new version in the requested scope.

    HostStatusResponse:
      type: object
      properties:
        hostname: { type: string }
        keystorePath: { type: string, nullable: true }
        certValidUntil: { type: string, nullable: true, format: date-time }
        mockServerRunning: { type: boolean }
        mockServerPort:
          type: integer
          nullable: true
          description: 'TLS port if running, else the mTLS port.'
        mockServerMode: { type: string, enum: [tls, mtls], default: tls }
        mockTlsPort: { type: integer, nullable: true }
        mockMtlsPort: { type: integer, nullable: true }
        createdAt: { type: string, nullable: true, format: date-time }

    MockServerResponse:
      type: object
      properties:
        hostname: { type: string }
        port: { type: integer, nullable: true }
        running: { type: boolean }

    CertInfoResponse:
      type: object
      description: Parsed X.509 details read from a host's keystore.
      properties:
        subject: { type: string }
        issuer: { type: string }
        serialNumber: { type: string }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        signatureAlgorithm: { type: string }
        publicKeyAlgorithm: { type: string }
        publicKeyBits: { type: integer }
        subjectAltNames:
          type: array
          items: { type: string }
        sha256Fingerprint: { type: string }
        primaryPin:
          type: string
          description: First pin currently stored for this host in the scope, if any.
        backupPin:
          type: string
          description: Second stored pin, if any.

    HostRecord:
      type: object
      description: >
        A `hosts` row. Not returned directly by any endpoint today — `cert-info` and
        `status` project subsets of it — but it is the shape the host endpoints
        persist.
      properties:
        hostname: { type: string }
        configApiId: { type: string, default: default-tls }
        keystorePath: { type: string, nullable: true }
        certValidUntil: { type: string, nullable: true, format: date-time }
        mockServerPort: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    HostClientCertRecord:
      type: object
      properties:
        hostname: { type: string }
        version: { type: integer }
        commonName: { type: string, nullable: true }
        fingerprint: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PingRemoteResult:
      type: object
      description: >
        Union shape — `port` and `actualPin` are present only when reachable;
        `triedPorts` and `error` only when not.
      properties:
        reachable: { type: boolean }
        port: { type: integer }
        pinMatch:
          type: boolean
          description: Whether the live leaf SPKI pin is in the stored pin list.
        actualPin: { type: string }
        expectedPins:
          type: array
          items: { type: string }
        triedPorts:
          type: array
          items: { type: integer }
        error: { type: string }
        elapsedMs: { type: integer, format: int64 }

    TestConnectionResult:
      type: object
      description: 'Union shape: `httpCode` / `body` on success, `error` on failure.'
      properties:
        success: { type: boolean }
        httpCode: { type: integer }
        responseTimeMs: { type: integer, format: int64 }
        body:
          type: string
          description: First 500 characters of the mock server's response.
        error: { type: string }

    # ── Config APIs ─────────────────────────────────────────────────────

    ConfigApiInstance:
      type: object
      properties:
        id: { type: string, example: default-tls }
        port: { type: integer, example: 6651 }
        mode: { type: string, enum: [tls, mtls] }
        running: { type: boolean }

    ConfigApiWithPins:
      type: object
      description: >
        Dashboard projection: a Config API plus its pins. Hand-serialised, so
        `HostPin.mtls` and `clientCertVersion` are omitted here.
      properties:
        id: { type: string }
        port: { type: integer }
        mode: { type: string, enum: [tls, mtls] }
        pins:
          type: array
          items:
            type: object
            properties:
              hostname: { type: string }
              sha256: { type: array, items: { type: string } }
              version: { type: integer }
              forceUpdate: { type: boolean }
        trustRoots:
          type: array
          items: { type: string }
          description: The scope's managed trust roots (empty when none).
        version:
          type: integer
          description: 'Computed as `max(pins[].version)`.'
        running: { type: boolean }

    VaultEnabledState:
      type: object
      description: Note the boolean is serialised as a string.
      properties:
        id: { type: string }
        vault_enabled: { type: string, enum: ['true', 'false'] }

    # ── Server TLS / signing ────────────────────────────────────────────

    ServerTlsPins:
      type: object
      properties:
        primaryPin: { type: string }
        backupPin: { type: string, description: 'Empty string when only one pin exists.' }
        httpsPort: { type: integer }
        hostname: { type: string, example: localhost }

    ServerTlsPinsMutation:
      type: object
      properties:
        primaryPin: { type: string }
        backupPin: { type: string }
        regenerated: { type: boolean }
        rotated: { type: boolean }
        uploaded: { type: boolean }
        restartRequired:
          type: boolean
          description: Running listeners keep the previous keystore until the process restarts.

    # ── Client certificates / enrollment ────────────────────────────────

    ClientCertRecord:
      type: object
      properties:
        id:
          type: string
          description: 'Client id — the certificate CN minus the `PinVault Client: ` prefix.'
        commonName: { type: string, example: 'PinVault Client: my-device' }
        fingerprint: { type: string, description: Base64 SHA-256 of the SPKI. }
        createdAt: { type: string, format: date-time }
        revoked: { type: boolean, default: false }
        deviceAlias: { type: string, nullable: true }
        deviceUid:
          type: string
          nullable: true
          description: >
            The device's `X-Device-Id`, captured at enrollment. Lets `token_mtls`
            bind a token-enrolled certificate (whose client id is admin-chosen) to
            one device.
        notAfter:
          type: string
          format: date-time
          nullable: true
          description: CSR-enrolled identities — when the current certificate expires. Null for P12 certificates.
        renewCount:
          type: integer
          default: 0
          description: CSR-enrolled identities — how many times the certificate was renewed.
        keyType:
          type: string
          enum: [csr, p12]
          description: '`csr`: the key lives on the device; `p12`: the server generated it.'
        attestation:
          $ref: '#/components/schemas/EnrollmentKeyAttestation'

    EnrollmentKeyAttestation:
      type: object
      nullable: true
      description: >
        What Android Key Attestation said about the device key at enrollment
        (`ENROLLMENT_ATTESTATION`). Null: not checked (`off`, a server-made P12 key,
        or an enrollment from before 2.2.0).
      properties:
        attested: { type: boolean, description: 'The chain verified: a signing key made in TEE / StrongBox by the app on a locked, verified device.' }
        securityLevel: { type: string, nullable: true, enum: [tee, strongbox, software] }
        reason: { type: string, nullable: true, example: chain_missing, description: '`ok`, or why it did not pass.' }

    IssuedClientCert:
      type: object
      description: A certificate chain issued over a device-held key (CSR enrollment or renewal).
      properties:
        clientId: { type: string }
        commonName: { type: string, example: 'PinVault Client: my-device' }
        chain:
          type: array
          description: PEM certificates, the device's leaf first, then the client CA.
          items: { type: string }
        serial: { type: string, description: Hex serial of the leaf. }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        spkiSha256: { type: string, description: Base64 SHA-256 of the device key's SubjectPublicKeyInfo. }

    EnrollmentPolicy:
      type: object
      description: An enrollment code many devices share. The code itself is never part of it.
      properties:
        id: { type: string }
        name: { type: string, description: 'Prefix of the client ids it hands out (`<name>-<6 chars>`).' }
        codePrefix: { type: string, description: First group of the code, for telling policies apart. }
        maxDevices: { type: integer }
        usedCount: { type: integer, description: Devices issued a certificate plus approved ones not yet picked up. }
        pendingCount: { type: integer, description: Devices waiting for approval. }
        requireApproval: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: The administrator who created it. }
        expiresAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, stopped, expired, full] }
        openApplications: { type: boolean, description: 'The policy collecting applications without a code (named `device`); not listed with the codes.' }
        accepting: { type: boolean, description: 'New devices may ask. False while applications without a code are switched off.' }

    OpenApplicationsStatus:
      type: object
      properties:
        enabled: { type: boolean }
        policy:
          allOf: [{ $ref: '#/components/schemas/EnrollmentPolicy' }]
          nullable: true
          description: The policy collecting the requests; null until the switch was turned on once.
        maxPending: { type: integer, description: '`OPEN_ENROLLMENT_MAX_PENDING`.' }
        requestTtlHours: { type: integer, description: '`ENROLLMENT_REQUEST_TTL_HOURS`.' }
        rateLimitPer10Minutes: { type: integer, description: '`OPEN_ENROLLMENT_RATE_LIMIT`; 0 = no limit.' }

    CreatedEnrollmentPolicy:
      type: object
      properties:
        policy: { $ref: '#/components/schemas/EnrollmentPolicy' }
        code:
          type: string
          description: The code, shown this once.
          example: K7QM2-XRT9V-4NWDP-J6E8B-HC3MA

    EnrollmentRequest:
      type: object
      description: A device that asked to enroll with a code or without one, recognised by its key.
      properties:
        id: { type: string }
        policyId: { type: string }
        policyName: { type: string }
        clientId: { type: string, description: The identity the device gets. }
        spkiSha256: { type: string, description: 'SHA-256 of the device key (SubjectPublicKeyInfo), Base64.' }
        verificationCode: { type: string, description: 'The code the device shows: first 80 bits (10 bytes) of that SHA-256, Crockford base32, `XXXX-XXXX-XXXX-XXXX`.', example: 4F7K-2QXM-9D3T-H6WP }
        openApplication: { type: boolean, description: Asked without a code. }
        attestation:
          $ref: '#/components/schemas/EnrollmentKeyAttestation'
        status: { type: string, enum: [pending, approved, rejected, issued, expired] }
        configApiId: { type: string, description: The Config API listener the device asked through. }
        deviceAlias: { type: string, nullable: true }
        deviceUid: { type: string, nullable: true }
        sourceIp: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedBy: { type: string, nullable: true, description: 'The administrator, `policy` for a policy without approval, or `timeout` for a request that lapsed.' }
        issuedAt: { type: string, format: date-time, nullable: true }
        heldBy: { type: string, nullable: true, description: 'Listing only: another active identity enrolled from the same `deviceUid`.' }
        sameDevicePending: { type: integer, description: 'Listing only: other requests waiting from the same `deviceUid`. Approve none: reject them all and ask the device to apply again (one may be an impostor).' }

    EnrollmentDecision:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [approved, rejected] }
        clientId: { type: string }

    EnrollmentPending:
      type: object
      description: 'The device waits for approval (HTTP 202, with `Retry-After`).'
      properties:
        status: { type: string, enum: [pending] }
        requestId: { type: string, description: 'Send it back with a CSR from the same key to ask again.' }
        clientId: { type: string }
        policy: { type: string }
        verificationCode: { type: string, description: 'From the CSR''s key (80 bits); the device shows the same code.', example: 4F7K-2QXM-9D3T-H6WP }
        openApplication: { type: boolean, description: Asked without a code. }
        message: { type: string }

    EnrollmentToken:
      type: object
      description: Listing shape — never a usable credential.
      properties:
        token:
          type: string
          description: >
            Masked prefix (`AbC12dEf…`), or `sha256:<8 hex>…` for pre-V8 rows that the
            migration invalidated. The plaintext is unrecoverable.
          example: 'AbC12dEf…'
        clientId: { type: string }
        createdAt: { type: string, format: date-time }
        used: { type: boolean, default: false }
        masked:
          type: boolean
          default: true
          description: Always `true` — `token` is a display value, not a credential.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the token stops being accepted; null for rows predating expiry.
        expired:
          type: boolean
          default: false
          description: '`expiresAt` is already in the past (the token is refused).'
        deviceUid:
          type: string
          nullable: true
          description: >
            The device id (ANDROID_ID) the token was bound to when it was minted
            (`deviceUid` on generate): only that device can enroll with it
            (`403 device_uid_mismatch` otherwise), and its device id counts as proven.
            Absent or null for a token any device may use.
          example: 9774d56d682e549c

    MtlsStatus:
      type: object
      properties:
        mtlsApiCount: { type: integer }
        tlsApiCount: { type: integer }
        clientCerts: { type: integer }
        activeCerts: { type: integer, description: Certificates not marked revoked. }

    # ── Devices / telemetry ─────────────────────────────────────────────

    ScopedClientDevice:
      type: object
      description: A device as the Device-ACL manager sees it, keyed by `X-Device-Id`.
      properties:
        deviceId: { type: string }
        deviceAlias: { type: string, nullable: true }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        pinVersion: { type: integer, default: 0 }
        lastStatus: { type: string, default: unknown }
        lastSeen: { type: string, nullable: true, format: date-time }
        source:
          type: string
          enum: [enrollment, connection, 'enrollment+connection', unknown]
          description: Which store(s) the row was assembled from.

    ClientDevice:
      type: object
      description: >
        A `client_devices` row keyed by hostname. `deviceId` here is derived from the
        reported manufacturer/model, not from `X-Device-Id`.
      properties:
        deviceId: { type: string, example: xiaomi_mi_9t }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        pinVersion: { type: integer }
        lastStatus: { type: string }
        lastSeen: { type: string, format: date-time }

    ConnectionHistoryEntry:
      type: object
      properties:
        source:
          type: string
          enum: [web, client, config_update]
        hostname: { type: string, default: '' }
        timestamp: { type: string, format: date-time }
        status: { type: string }
        responseTimeMs: { type: integer, format: int64, default: 0 }
        errorMessage: { type: string, nullable: true }
        serverCertPin: { type: string, nullable: true }
        storedPin: { type: string, nullable: true }
        pinMatched: { type: boolean, nullable: true }
        pinVersion: { type: integer, nullable: true }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }

    ClientConnectionReport:
      type: object
      description: >
        Device connection report. `hostname`, `deviceManufacturer` and `deviceModel`
        must match `^[A-Za-z0-9._:\- ]{1,128}$` or the request is rejected with `400`.
      properties:
        hostname: { type: string, example: api.example.com }
        status: { type: string, example: success }
        responseTimeMs: { type: integer, format: int64 }
        serverCertPin: { type: string }
        storedPin: { type: string }
        pinMatched: { type: boolean }
        pinVersion: { type: integer }
        deviceManufacturer: { type: string, example: Xiaomi }
        deviceModel: { type: string, example: 'Mi 9T' }
        errorMessage: { type: string }
        timestamp:
          type: string
          format: date-time
          description: Defaults to the server's clock when omitted.

    ConfigUpdateReport:
      type: object
      description: >
        Outcome of a device-side config refresh. `deviceManufacturer` and
        `deviceModel` are subject to the same identifier check as
        `ClientConnectionReport`.
      properties:
        status: { type: string, example: success }
        pinVersion: { type: integer }
        deviceManufacturer: { type: string }
        deviceModel: { type: string }
        failureReason: { type: string }
        timestamp: { type: string, format: date-time }

    CertExpiryStatus:
      type: object
      properties:
        hostname: { type: string }
        configApiId: { type: string }
        validUntil: { type: string, format: date-time }
        daysRemaining: { type: integer }
        level: { type: string, enum: [ok, warning, expired] }

    DetailedHealth:
      type: object
      properties:
        status:
          type: string
          description: Worst certificate level across all hosts.
          enum: [ok, warning, expired]
        database: { type: string, example: connected }
        configApis:
          type: object
          properties:
            running: { type: integer }
            stopped: { type: integer }
        certs:
          type: object
          properties:
            status: { type: string }
            nearExpiry:
              type: integer
              description: Hosts whose level is not `ok`.
            total: { type: integer }

    # ── Vault ───────────────────────────────────────────────────────────

    VaultFileEntry:
      type: object
      description: >
        Vault file metadata as the listing endpoints emit it — every value except
        `key` is a string, including `version` and `size`.
      properties:
        key: { type: string, example: ml-model }
        version: { type: string, example: '3' }
        size: { type: string, description: Stored byte length., example: '10485' }
        access_policy: { type: string, enum: [public, api_key, token, token_mtls] }
        encryption: { type: string, enum: [plain, at_rest, end_to_end, user_auth] }

    VaultPutResult:
      type: object
      properties:
        key: { type: string }
        version: { type: string, description: New version, as a string. }
        access_policy: { type: string, enum: [public, api_key, token, token_mtls] }
        encryption: { type: string, enum: [plain, at_rest, end_to_end, user_auth] }

    VaultDeleteResult:
      type: object
      properties:
        deleted: { type: string, description: The key that was deleted. }
        status: { type: string, example: ok }

    VaultPolicyUpdate:
      type: object
      required: [access_policy, encryption]
      properties:
        access_policy:
          type: string
          enum: [public, api_key, token, token_mtls]
          description: >
            `public` = no check; `api_key` = `X-API-Key`; `token` = `X-Device-Id` +
            `X-Vault-Token`; `token_mtls` = token plus a client certificate bound to
            that device.
        encryption:
          type: string
          enum: [plain, at_rest, end_to_end, user_auth]
          description: >
            Switching to or from `at_rest` rewrites the stored bytes. `end_to_end`
            wraps per device at download time with the device's registered RSA key. `user_auth`
            does the same with the device's user-auth key (`"purpose":"user_auth"`).

    VaultToken:
      type: object
      description: Token listing row (`VaultFileTokenInfo`) — hash-backed, no plaintext.
      properties:
        id: { type: integer, format: int64 }
        configApiId: { type: string }
        vaultKey: { type: string }
        deviceId: { type: string }
        createdAt: { type: string, format: date-time }
        revoked: { type: boolean }

    GeneratedVaultToken:
      type: object
      description: Token issue response. `token` is shown once and never retrievable again.
      properties:
        id: { type: string, description: Token id, serialised as a string. }
        token: { type: string, description: Plaintext, shown once. }
        deviceId: { type: string }
        createdAt: { type: string, format: date-time }

    VaultReport:
      type: object
      description: Device-side download report.
      properties:
        key: { type: string }
        version: { type: integer }
        deviceId: { type: string, default: unknown }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        enrollmentLabel: { type: string, nullable: true }
        deviceAlias: { type: string, nullable: true }
        status: { type: string, default: downloaded, example: downloaded }
        failureReason: { type: string, nullable: true }
        authMethod:
          type: string
          nullable: true
          description: 'How the device authenticated, e.g. `token`, `token_mtls`, `public`.'

    VaultDistribution:
      type: object
      description: One recorded delivery of a vault file to a device.
      properties:
        configApiId: { type: string, default: '' }
        vaultKey: { type: string }
        version: { type: integer }
        deviceId: { type: string }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        enrollmentLabel: { type: string, nullable: true }
        status:
          type: string
          description: >
            Free-form; the stats endpoint counts only the exact values `downloaded`
            and `failed`.
          example: downloaded
        timestamp: { type: string, format: date-time }
        deviceAlias: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        authMethod: { type: string, nullable: true }

    VaultDistStats:
      type: object
      properties:
        totalDistributions: { type: integer }
        uniqueDevices: { type: integer }
        uniqueKeys: { type: integer }
        downloaded: { type: integer, description: 'Rows with `status = "downloaded"`.' }
        failed: { type: integer, description: 'Rows with `status = "failed"`.' }

    # ── Device ACL ──────────────────────────────────────────────────────

    DeviceHostAclUpdate:
      type: object
      description: Counters are serialised as strings.
      properties:
        configApiId: { type: string }
        deviceId: { type: string }
        granted: { type: string, description: Comma-joined hostnames after the update. }
        added: { type: string }
        removed: { type: string }

    DefaultHostAclUpdate:
      type: object
      description: Counters are serialised as strings.
      properties:
        configApiId: { type: string }
        hostnames: { type: string, description: Comma-joined hostnames after the update. }
        added: { type: string }
        removed: { type: string }

    # ── Signing keys ────────────────────────────────────────────────────

    SigningKeyInfo:
      type: object
      description: '`GET /api/v1/signing-key`.'
      required: [publicKey, keyId, signers, keySetVersion]
      properties:
        publicKey:
          type: string
          description: Base64 X.509 SPKI of the primary signer — the value apps embed.
        keyId:
          type: string
          description: Base64 SHA-256 of that SPKI.
        signers:
          type: array
          description: Every signing key, in signing order (primary first).
          items:
            type: object
            properties:
              keyId: { type: string }
              publicKey: { type: string }
        keySetVersion:
          type: integer
          description: Version of the signing-key set devices currently receive; 0 = none.

    SignatureEntry:
      type: object
      required: [signature]
      properties:
        keyId:
          type: string
          nullable: true
          description: Base64 SHA-256 of the signer's SPKI — an unsigned hint.
        signature:
          type: string
          description: Base64 DER `SHA256withECDSA` signature.

    SignedKeySet:
      type: object
      description: >
        A signing-key set as devices receive it: `payload` exactly as the recovery
        key(s) signed it (see `SigningKeySetPayload`) and those signatures.
      required: [payload, signatures]
      properties:
        payload:
          type: string
          description: JSON text of a `SigningKeySetPayload`; verify the signatures over these exact bytes.
        signatures:
          type: array
          items: { $ref: '#/components/schemas/SignatureEntry' }

    SigningKeySetPayload:
      type: object
      description: What `SignedKeySet.payload` decodes to.
      required: [type, version, keys]
      properties:
        type: { type: string, enum: [pinvault-signing-keys] }
        version:
          type: integer
          minimum: 1
          description: Must be above the current set's version.
        keys:
          type: array
          description: Base64 X.509 SPKI (or PEM) of every signing key devices accept.
          items: { type: string }
        requiredSignatures:
          type: integer
          default: 1
          description: Valid signatures, from listed keys, a device requires on each config.

    KeySetUploadResult:
      type: object
      properties:
        version: { type: integer }
        keyIds: { type: array, items: { type: string } }
        requiredSignatures: { type: integer }
        warnings:
          type: array
          description: E.g. an active signer the set does not list.
          items: { type: string }

    SignerStatus:
      type: object
      properties:
        name: { type: string, description: 'The `CONFIG_SIGNERS` entry, e.g. `local` or `command:kms`.', example: local }
        type: { type: string, enum: [local, pkcs11, command] }
        keyId: { type: string }
        publicKey: { type: string }
        description: { type: string, description: One line, never secret., example: 'Key file signing-key.pem (plaintext on disk)' }

    SignatureCacheStats:
      type: object
      properties:
        cacheEnabled: { type: boolean, description: '`CONFIG_SIGNATURE_CACHE=true`.' }
        ttlSeconds: { type: integer, format: int64, description: '`CONFIG_TTL_SECONDS` (default 86400).' }
        signaturesProduced: { type: integer, format: int64, description: Since start, across all signers. }
        cacheHits: { type: integer, format: int64 }
        cachedEnvelopes: { type: integer }

    SigningKeySetStatus:
      type: object
      properties:
        enabled: { type: boolean, description: '`RECOVERY_PUBLIC_KEYS` is set.' }
        recoveryKeyIds: { type: array, items: { type: string } }
        recoveryRequiredSignatures: { type: integer, description: '`RECOVERY_REQUIRED_SIGNATURES` (default 1).' }
        version: { type: integer, description: 0 = no set uploaded. }
        keyIds: { type: array, items: { type: string } }
        requiredSignatures: { type: integer }
        activeSignersMissing:
          type: array
          description: >
            Key ids of active signers the current set does not list — devices that
            applied the set reject configs signed only by them.
          items: { type: string }
        uploadedBy: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time, nullable: true }

    SigningStatus:
      type: object
      properties:
        signers:
          type: array
          items: { $ref: '#/components/schemas/SignerStatus' }
        canRegenerate:
          type: boolean
          description: The primary signer is a local key file.
        cache: { $ref: '#/components/schemas/SignatureCacheStats' }
        keySet: { $ref: '#/components/schemas/SigningKeySetStatus' }

    # ── Governance ──────────────────────────────────────────────────────

    AdminMe:
      type: object
      properties:
        name: { type: string, example: alice }
        admins:
          type: array
          description: Every admin name (`admin` = the shared `API_KEY`).
          items: { type: string }
          example: [admin, alice, bob]
        approvalsRequired:
          type: integer
          description: '`PIN_CHANGE_APPROVALS` (1 = off).'
          example: 2
        liveCheck: { type: string, enum: ['off', warn, enforce] }
        liveCheckOverridable:
          type: boolean
          description: '`liveCheckOverride` is accepted (`PIN_LIVE_CHECK_ALLOW_OVERRIDE` is not `false`).'
        notificationsConfigured: { type: boolean, description: '`NOTIFY_WEBHOOK_URL` is set.' }
        signatureCache: { type: boolean, description: '`CONFIG_SIGNATURE_CACHE=true`, or forced on by an external signer (`CONFIG_SIGNERS=command|pkcs11`).' }
        approvalExemptOperations:
          type: array
          items: { type: string }
          description: 'Operations taken out of two-person approval (`APPROVAL_EXEMPT_OPERATIONS`); empty by default.'

    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor:
          type: string
          description: >
            Admin name; `system` for server-side events; approved changes read
            `requester (approved by approver)`.
          example: alice (approved by bob)
        action: { type: string, example: pins_changed }
        configApiId: { type: string, description: Empty when not scope-specific. }
        target:
          type: string
          description: Hostnames, or `METHOD /path?query` for `http` entries.
        summary: { type: string, example: 'api.example.com: pins v3→v4' }
        detail:
          type: string
          description: JSON text (e.g. the pin diff or a live-check result), or "".
        sourceIp: { type: string }
        prevHash: { type: string, description: Hex SHA-256 of the previous entry (64 zeros for the first). }
        hash: { type: string, description: Hex SHA-256 over prevHash and every field. }

    AuditPage:
      type: object
      properties:
        total: { type: integer, description: Entries matching the filter. }
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }

    AuditChainCheck:
      type: object
      properties:
        ok: { type: boolean }
        entries: { type: integer, description: Entries checked (up to the first broken one). }
        firstBrokenId: { type: integer, format: int64, nullable: true }

    PendingApproval:
      type: object
      required: [pendingApproval, changeRequestId, summary, approvalsRequired, message]
      properties:
        pendingApproval: { type: boolean, example: true }
        changeRequestId: { type: integer, format: int64, example: 12 }
        summary: { type: string, example: 'default-tls: api.example.com: pins v3→v4' }
        approvalsRequired:
          type: integer
          description: '`PIN_CHANGE_APPROVALS` — the requester counts as one.'
          example: 2
        message: { type: string, example: 'Change #12 is waiting for approval by 1 other admin(s).' }
        runAfterApproval:
          type: boolean
          description: >
            True for an operation whose answer carries a secret shown once: the
            approval only unlocks it, and the requester sends the same request again
            to run it and receive the answer.

    DiffPin:
      type: object
      description: A host's pin entry inside a diff.
      properties:
        hostname: { type: string }
        version: { type: integer }
        sha256: { type: array, items: { type: string } }
        forceUpdate: { type: boolean }
        mtls: { type: boolean }
        clientCertVersion: { type: integer, description: Absent when none. }

    ChangeRequestDetail:
      type: object
      description: >
        What `ChangeRequest.detail` decodes to: the operation and, for pin updates,
        the diff against the pins at request time plus the live-check dry run.
      properties:
        operation:
          type: string
          enum: [pins_update, force_on, force_off, host_add, host_cert, config_api_delete,
                 bootstrap_pins, signing_key, signing_keyset]
        added:
          type: array
          items: { $ref: '#/components/schemas/DiffPin' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/DiffPin' }
        changed:
          type: array
          items:
            type: object
            properties:
              hostname: { type: string }
              from: { $ref: '#/components/schemas/DiffPin' }
              to: { $ref: '#/components/schemas/DiffPin' }
        forceUpdate:
          type: object
          description: Scope-level force flag change.
          properties:
            from: { type: boolean }
            to: { type: boolean }
        liveCheck:
          description: Present when `PIN_LIVE_CHECK` is on.
          allOf:
            - $ref: '#/components/schemas/LiveCheckResult'
        baseHash:
          type: string
          description: >
            Fingerprint of the scope's pins at request time. Approval re-checks it:
            a changed scope marks the request `stale` instead of overwriting.
        describeError: { type: string, description: Set when the diff could not be computed. }

    ChangeRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: '`createdAt` + `APPROVAL_TTL_HOURS` (default 24).' }
        requestedBy: { type: string }
        method: { type: string, example: PUT }
        path: { type: string, example: /api/v1/certificate-config }
        query: { type: string, example: configApiId=default-tls }
        contentType: { type: string }
        configApiId: { type: string }
        summary: { type: string }
        detail:
          type: string
          description: JSON text of a `ChangeRequestDetail`.
        status:
          type: string
          enum: [pending, approved, applied, failed, rejected, expired, stale]
          description: >
            `approved`: enough admins agreed and the requester may now run it once by
            sending the same request again (operations whose answer carries a secret:
            `client_cert_generate`, `enrollment_policy_create`, `enrollment_token`,
            `vault_token_issue`). It can still be rejected or withdrawn, and expires
            like a pending one. For such a request `resultBody` is never stored.
        approvedBy: { type: array, items: { type: string } }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        resultStatus:
          type: integer
          nullable: true
          description: HTTP status of the replay (applied / failed).
        resultBody:
          type: string
          nullable: true
          description: The replay's response body (first 2000 characters).

    LiveCheckHostCheck:
      type: object
      properties:
        hostname: { type: string, description: The pinned name. }
        probed:
          type: string
          nullable: true
          description: '`host:port` contacted; null when the name could not be probed at all (an unmapped wildcard).'
          example: api.example.com:443
        reachable: { type: boolean }
        livePins:
          type: array
          description: SPKI pins (Base64 SHA-256) of the chain the host served, **leaf first**.
          items: { type: string }
        matched:
          type: boolean
          description: >
            The chain passes the way a device checks it: the leaf's pin is in the
            set, or the pin of an issuer the leaf validly chains to (signatures,
            validity, CA constraints up to the pinned certificate).
        error: { type: string, nullable: true, description: Why the host could not be reached. }

    LiveCheckResult:
      type: object
      properties:
        mode: { type: string, enum: ['off', warn, enforce], description: '`PIN_LIVE_CHECK`.' }
        passed: { type: boolean }
        checks:
          type: array
          items: { $ref: '#/components/schemas/LiveCheckHostCheck' }

    LiveCheckRejection:
      type: object
      properties:
        error: { type: string }
        liveCheck: { $ref: '#/components/schemas/LiveCheckResult' }
        overridable:
          type: boolean
          description: '`liveCheckOverride=<reason>` would be accepted.'

    NotificationDelivery:
      type: object
      properties:
        event: { type: string, example: pins_changed }
        at: { type: string, format: date-time }
        auditId: { type: integer, format: int64, nullable: true }
        status: { type: integer, nullable: true, description: HTTP status of the last attempt; null when it never connected. }
        attempts: { type: integer }
        error: { type: string, nullable: true }

    NotificationStatus:
      type: object
      properties:
        configured: { type: boolean }
        target:
          type: string
          nullable: true
          description: Scheme, host and port of the webhook — never its path.
        signed: { type: boolean, description: '`NOTIFY_WEBHOOK_SECRET` is set (`X-PinVault-Signature`).' }
        events:
          type: array
          description: '`NOTIFY_EVENTS`; `*` = every audit action except `http` and `device_key_registered` (named, it is sent).'
          items: { type: string }
        recent:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }

    NotificationTestResult:
      type: object
      properties:
        sent: { type: boolean, example: true }
        auditId: { type: integer, format: int64 }

    # ── Attestation (ATTESTATION.md) ────────────────────────────────────

    AttestationChallenge:
      type: object
      required: [nonce, expiresIn, serverTime]
      properties:
        nonce:
          type: string
          description: 'base64url( ts ‖ rand ‖ HMAC[0..16) ) — opaque to the device, single use.'
          example: AAABkp0…Zg
        expiresIn: { type: integer, description: 'Seconds the nonce stays valid.', example: 120 }
        serverTime: { type: integer, format: int64, description: 'Server clock, epoch milliseconds (informational).', example: 1759660800000 }

    AttestationSignal:
      type: object
      required: [flag]
      properties:
        flag: { type: boolean, description: The probe raised this signal. }
        evidence:
          type: array
          description: What the probe found, e.g. `maps:frida-agent`, `settings:adb_enabled`; `error` when the probe threw.
          items: { type: string }

    AttestationReport:
      type: object
      description: >
        What the library measures (ATTESTATION.md §3). Sent inside the request **as
        a JSON string** and signed as bytes; the server stores it trimmed to the
        blocks below.
      properties:
        sdkVersion: { type: string, example: 2.2.0 }
        reportTime: { type: integer, format: int64, description: Epoch milliseconds. }
        app:
          type: object
          properties:
            packageName: { type: string, example: com.example.app }
            versionCode: { type: integer }
            versionName: { type: string }
            signerSha256: { type: array, items: { type: string } }
            installer: { type: string, nullable: true, example: com.android.vending }
            debuggable: { type: boolean }
        device:
          type: object
          properties:
            manufacturer: { type: string }
            model: { type: string }
            brand: { type: string }
            device: { type: string }
            product: { type: string }
            hardware: { type: string }
            fingerprint: { type: string }
            sdkInt: { type: integer }
            securityPatch: { type: string, example: '2026-09-05' }
            verifiedBootState: { type: string, example: green }
            keySecurityLevel: { type: string, enum: [software, tee, strongbox, unknown] }
            keyAttested: { type: boolean }
        signals:
          type: object
          description: One entry per flag of `AttestationFlag`.
          additionalProperties: { $ref: '#/components/schemas/AttestationSignal' }
        verdictProvider:
          type: object
          nullable: true
          description: An optional second opinion (Play Integrity) the app plugged in; forwarded verbatim, stored, not verified by the reference server.
          properties:
            name: { type: string, example: play-integrity }
            token: { type: string }

    AttestationFlag:
      type: string
      description: The signals a report can raise and a policy decides on.
      enum: [rooted, emulator, debugger, debuggable, hooking_framework, app_integrity,
             cloner, unknown_installer, adb_enabled, software_key, key_unattested, old_patch_level]

    AttestationRequest:
      type: object
      required: [v, nonce, deviceId, publicKey, report, signature]
      properties:
        v: { type: integer, description: 'Protocol version; anything but 1 is `400 unsupported_version`.', example: 1 }
        nonce: { type: string, description: 'From `GET /api/v1/attest/challenge`, unexpired, unused.' }
        deviceId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$', example: 9774d56d682e549c }
        publicKey: { type: string, description: Base64 DER SubjectPublicKeyInfo of the device key (EC P-256). }
        attestationChain:
          type: array
          description: >
            Base64 DER certificates, leaf first. Required on first registration under
            `ATTESTATION_KEY_POLICY=enforce`, optional otherwise, ignored for a device
            that is already registered.
          items: { type: string }
        report: { type: string, description: 'The `AttestationReport` JSON **as a string**, at most 16 KB.' }
        signature: { type: string, description: 'Base64 DER `SHA256withECDSA` over the UTF-8 bytes of `pinvault-attest:v1:<nonce>:<deviceId>:<sha256-hex(report)>`.' }
        currentConfigVersion: { type: integer, description: The pin config version the device holds. }
        currentIssuedAt: { type: integer, format: int64, description: '`issuedAt` of the config the device holds.' }
        hosts:
          type: array
          description: Optional `wantPinsFor` scoping, as on the config GET.
          items: { type: string }

    AttestationResponse:
      type: object
      required: [result, arc, nextAttestIn, policyVersion]
      properties:
        result: { type: string, enum: [pass, reject] }
        arc: { type: string, description: 'Attestation result code — 8 hex characters an operator resolves in the dashboard.', example: 7f3a9c1e }
        warnings:
          type: array
          description: Raised flags the policy only warns about.
          items: { $ref: '#/components/schemas/AttestationFlag' }
        rejectionReasons:
          type: array
          description: Present only when the policy's `revealReasons` is on. `force_fail` when the device is forced to fail.
          items: { type: string }
        token: { type: string, description: 'The `PinVault-Token` (HS256 JWT). Absent on `reject`.' }
        tokenExpiresAt: { type: integer, format: int64, description: Epoch milliseconds. }
        tokenTtlSeconds: { type: integer, example: 300 }
        nextAttestIn: { type: integer, description: 'Seconds until the next attestation (the policy''s `attestIntervalSeconds`).', example: 300 }
        configChanged: { type: boolean, description: '`config` is embedded because the device is behind.' }
        config:
          description: The same signed envelope `GET /api/v1/certificate-config` serves, scoped by the device's host ACL. Never present on `reject`.
          type: object
          additionalProperties: true
        device:
          type: object
          properties:
            registered: { type: boolean }
            firstSeen: { type: boolean, description: This call registered the device. }
            keyAttestation:
              type: object
              properties:
                attested: { type: boolean }
                securityLevel: { type: string, nullable: true, example: StrongBox }
                reason: { type: string, example: ok }
        policyVersion: { type: integer, example: 3 }

    AttestationPolicy:
      type: object
      description: The rejection policy of one Config API (ATTESTATION.md §4).
      required: [flags]
      properties:
        version: { type: integer, description: 'Bumped by the server on every change (the value sent in a PUT is ignored); `0` while the default preset is in force.', example: 3 }
        flags:
          type: object
          description: One decision per `AttestationFlag`.
          additionalProperties:
            type: string
            enum: [reject, warn, ignore]
          example:
            rooted: reject
            emulator: reject
            debugger: reject
            debuggable: reject
            hooking_framework: reject
            app_integrity: reject
            cloner: reject
            unknown_installer: warn
            adb_enabled: ignore
            software_key: warn
            key_unattested: warn
            old_patch_level: warn
        revealReasons: { type: boolean, description: 'Send `rejectionReasons` to the device.', default: false }
        tokenTtlSeconds: { type: integer, minimum: 30, maximum: 86400, default: 300 }
        attestIntervalSeconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }

    KeyAttestationResult:
      type: object
      description: What Android Key Attestation said about the device key when it registered.
      properties:
        attested: { type: boolean }
        securityLevel: { type: string, nullable: true, example: StrongBox }
        reason: { type: string, nullable: true, example: ok }

    AttestedDevice:
      type: object
      description: A device of a Config API as the listing shows it (`attested_devices`).
      required: [configApiId, deviceId, registered, firstSeen, lastSeen]
      properties:
        configApiId: { type: string, example: default-tls }
        deviceId: { type: string, example: 9774d56d682e549c }
        registered: { type: boolean, description: 'False for a row an operator annotated before the device ever attested (no key yet).' }
        spkiSha256: { type: string, nullable: true, description: 'SHA-256 hex of the registered key''s SubjectPublicKeyInfo.' }
        publicKey: { type: string, nullable: true, description: 'The registered key, Base64 DER.' }
        keyAttestation:
          nullable: true
          description: 'Null when the chain was not checked (`ATTESTATION_KEY_POLICY=off`, or no chain was sent).'
          allOf:
            - $ref: '#/components/schemas/KeyAttestationResult'
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        lastResult: { type: string, enum: [pass, reject], nullable: true, description: 'Last verdict; null before the first evaluation.' }
        lastArc: { type: string, nullable: true, example: 7f3a9c1e }
        lastReasons: { type: array, items: { type: string }, description: 'Rejection reasons behind the last verdict (what its ARC resolves to).' }
        lastWarnings: { type: array, items: { type: string } }
        lastPolicyVersion: { type: integer, nullable: true, description: 'Policy version the last verdict used.' }
        lastSdkVersion: { type: string, nullable: true, example: 2.2.0 }
        attestCount: { type: integer, description: 'Verdicts recorded for this device.' }
        forcePass: { type: boolean }
        forceFail: { type: boolean }
        annotations: { type: array, items: { type: string }, example: [staff, canary] }
        keyMismatches: { type: integer, description: 'Attestations refused with `key_mismatch` since registration.' }
        lastKeyMismatchAt: { type: string, format: date-time, nullable: true }
        verdictProvider: { type: string, nullable: true, description: 'Name of the verdict provider the app plugged in (e.g. `play-integrity`).' }

    AttestedDevicePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AttestedDevice' }
        total: { type: integer, description: 'Devices matching the filter.' }
        page: { type: integer, description: '1-based.' }
        pageSize: { type: integer }

    AttestedDeviceDetail:
      allOf:
        - $ref: '#/components/schemas/AttestedDevice'
        - type: object
          properties:
            lastReport:
              nullable: true
              description: 'The last report, trimmed to its `app`, `device` and `signals` blocks. Null when the device never attested.'
              allOf:
                - $ref: '#/components/schemas/AttestationReport'

    AttestedDeviceUpdate:
      type: object
      description: Every field optional; a missing one keeps the device's current value.
      properties:
        forcePass: { type: boolean, default: false }
        forceFail: { type: boolean, default: false }
        annotations:
          type: array
          description: 'Replaces the device''s list; each `[A-Za-z0-9._:@/ +-]{1,64}`, at most 16, duplicates dropped.'
          items: { type: string }
          example: [staff, canary]

    AttestationWindowStats:
      type: object
      properties:
        passes: { type: integer }
        rejects: { type: integer }
        byReason:
          type: object
          description: 'Rejects per reason (a device rejected for two reasons counts in both).'
          additionalProperties: { type: integer }
          example: { rooted: 12, hooking_framework: 3 }
        byWarning:
          type: object
          description: 'Warnings per flag.'
          additionalProperties: { type: integer }
          example: { software_key: 40 }

    AttestedDeviceCounts:
      type: object
      description: How many devices of the Config API are in each state right now.
      properties:
        total: { type: integer }
        registered: { type: integer, description: 'With a registered key.' }
        lastPassed: { type: integer }
        lastRejected: { type: integer }
        forcePass: { type: integer }
        forceFail: { type: integer }
        keyMismatches: { type: integer, description: 'Devices that saw at least one key mismatch.' }

    AttestationStats:
      type: object
      properties:
        last24h: { $ref: '#/components/schemas/AttestationWindowStats' }
        last7d: { $ref: '#/components/schemas/AttestationWindowStats' }
        devices: { $ref: '#/components/schemas/AttestedDeviceCounts' }
        policyVersion: { type: integer, description: 'The policy version in force.' }

    TokenSecret:
      type: object
      required: [kid, secret, active, createdAt]
      properties:
        kid: { type: string, description: 'What the token header''s `kid` names; `YYYY-MM-DD-NN`.', example: 2026-10-05-01 }
        secret: { type: string, description: 'Base64 of the 32 secret bytes.' }
        active: { type: boolean, description: 'New tokens are signed with this one.' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: 'The admin who rotated it, or `system` for the one made on first use.' }

    TokenSecretList:
      type: object
      required: [active, secrets]
      properties:
        active: { type: string, description: 'The `kid` of the active secret (made now when there was none).', example: 2026-10-05-01 }
        secrets:
          type: array
          description: 'Newest first; exactly one entry is `active`.'
          items: { $ref: '#/components/schemas/TokenSecret' }

    TokenSecretRotated:
      type: object
      properties:
        kid: { type: string, example: 2026-10-05-02 }
        active: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
