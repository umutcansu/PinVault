          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: string, example: 'true' }
        '400':
          description: '`access_policy` or `encryption` missing from the body.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No file with this key in that scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: '`access_policy` or `encryption` is not one of the allowed values.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/{key}/tokens:
    get:
      tags: [vault-admin]
      operationId: listScopedVaultTokens
      summary: List a file's access tokens in a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      responses:
        '200':
          description: Tokens (hashes only).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultToken' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    post:
      tags: [vault-admin]
      operationId: createScopedVaultToken
      summary: Issue a per-device access token in a named scope
      description: |
        Plaintext returned once. Mirror of `POST /api/v1/vault/{key}/tokens`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200':
          description: Token issued (plaintext shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedVaultToken' }
        '400':
          description: '`deviceId` missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/tokens/{tokenId}:
    delete:
      tags: [vault-admin]
      operationId: revokeScopedVaultToken
      summary: Revoke a vault access token
      description: |
        Token ids are globally unique, so `{configApiId}` is not used by the lookup.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/TokenIdPath'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: string, example: 'true' }
        '400':
          description: '`tokenId` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No token with that id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/distributions:
    get:
      tags: [vault-admin]
      operationId: listScopedVaultDistributions
      summary: Distribution history for a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: Distribution records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultDistribution' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/distributions/{key}:
    get:
      tags: [vault-admin]
      operationId: listScopedVaultDistributionsByKey
      summary: Distribution history for one file in a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      responses:
        '200':
          description: Distribution records for this key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultDistribution' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/distributions/device/{deviceId}:
    get:
      tags: [vault-admin]
      operationId: listScopedVaultDistributionsByDevice
      summary: Distribution history for one device in a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Distribution records for this device.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultDistribution' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/stats:
    get:
      tags: [vault-admin]
      operationId: scopedVaultStats
      summary: Distribution counters for a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: Counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultDistStats' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # governance
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/admin/me:
    get:
      tags: [governance]
      operationId: getAdminMe
      summary: Who the presented key belongs to, and which governance features are on
      description: |
        `name` is the admin behind `X-API-Key`: `admin` for the shared `API_KEY`, the
        name of an `ADMIN_KEYS` entry, or `anonymous` with
        `ALLOW_ANONYMOUS_ADMIN=true`. The other fields are the server's governance
        settings, for the dashboard's identity chip.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The caller and the governance settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMe' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/audit-log:
    get:
      tags: [governance]
      operationId: listAuditLog
      summary: Page through the hash-chained audit log
      description: |
        Newest first. Every successful admin write is recorded and attributed to the
        admin who made it: pin diffs (`pins_changed`, whichever route wrote them),
        the approval workflow, live-check decisions, signing-key changes, invalid
        API keys (`auth_failed`, at most one per source address per minute),
        certificate expiry warnings (`cert_expiring`, once a day per host) and, for
        writes without a more specific entry, a generic `http` entry whose `target`
        is `METHOD /path?query`.

        The log is append-only (database triggers refuse UPDATE and DELETE) and
        chained: `hash` = SHA-256 over `prevHash` and every field, so an edit made
        behind the triggers' back breaks `GET /api/v1/audit-log/verify`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1–500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: action
          in: query
          required: false
          description: Only entries with this action. Any other value matches nothing.
          schema:
            type: string
            enum: [pins_changed, change_requested, change_approved, change_applied, change_failed,
                   change_rejected, change_expired, change_stale, live_check_warning,
                   live_check_blocked, live_check_overridden, signing_key_regenerated,
                   signing_keyset_uploaded, auth_failed, cert_expiring, notification_test, http]
        - name: configApiId
          in: query
          required: false
          description: Only entries recorded for this Config API scope.
          schema: { type: string }
      responses:
        '200':
          description: One page and the number of entries matching the filter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/audit-log/verify:
    get:
      tags: [governance]
      operationId: verifyAuditLog
      summary: Recompute the audit chain
      description: |
        Walks the whole log from the first entry and recomputes every link and hash.
        `ok: false` names the first entry whose `prevHash` or `hash` does not hold —
        that entry (or the one before it) was altered or removed.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The result of the check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditChainCheck' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests:
    get:
      tags: [governance]
      operationId: listChangeRequests
      summary: Pin and key changes waiting for (or decided by) a second admin
      description: |
        Newest first, at most 100. Requests past their expiry are marked `expired`
        (and audited) before the list is read. Only produced while
        `PIN_CHANGE_APPROVALS>=2`; see the `202` answer of the pin-affecting routes.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status; `all` or omitted = every request.
          schema:
            type: string
            enum: [pending, applied, failed, rejected, expired, stale, all]
      responses:
        '200':
          description: Matching change requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChangeRequest' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests/{id}:
    get:
      tags: [governance]
      operationId: getChangeRequest
      summary: One change request
      description: |
        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ChangeRequestIdPath'
      responses:
        '200':
          description: The change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: '`id` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests/{id}/approve:
    post:
      tags: [governance]
      operationId: approveChangeRequest
      summary: Approve a pending change (and apply it once enough admins did)
      description: |
        Records the caller's approval. Once `PIN_CHANGE_APPROVALS - 1` distinct admins
        other than the requester approved, the server replays the stored request —
        method, path, query and body — through its own management port, as the
        requester, and stores the outcome: `applied` (2xx) or `failed` (with
        `resultStatus` / `resultBody`, e.g. `422` from an enforced live check). The
        answer is the updated request in every case.

        Refused with `409` (never `403`, so a dashboard does not mistake it for a bad
        key): the requester approving their own change, the shared `API_KEY`
        (it does not say who approves), an admin approving twice, a request that is
        no longer pending, and a full-config write whose scope changed after it was
        requested — that request is marked `stale` instead of undoing the newer
        change.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ChangeRequestIdPath'
      responses:
        '200':
          description: >
            The updated request: `pending` (more approvals needed), `applied` or
            `failed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: '`id` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Self-approval, shared key, already approved, not pending, or stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'The admin who requested a change cannot approve it — another admin must.' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/change-requests/{id}/reject:
    post:
      tags: [governance]
      operationId: rejectChangeRequest
      summary: Reject a pending change (or withdraw your own)
      description: |
        Any admin may reject a pending request; its requester withdraws it the same
        way. The optional `reason` (first 500 characters) is stored and audited.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ChangeRequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: wrong host }
      responses:
        '200':
          description: The request, now `rejected`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400':
          description: '`id` is not a number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such change request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The request is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/notifications:
    get:
      tags: [governance]
      operationId: getNotificationStatus
      summary: Webhook configuration and the latest deliveries
      description: |
        `target` is the webhook's scheme, host and port only — the path of a
        Slack/Teams webhook URL is itself a secret. `recent` holds the last 50
        deliveries, newest first, after their final attempt (up to 3, with backoff).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: 'Notification status (`configured: false` without `NOTIFY_WEBHOOK_URL`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/notifications/test:
    post:
      tags: [governance]
      operationId: sendTestNotification
      summary: Record and send a test notification
      description: |
        Writes a `notification_test` audit entry and queues its webhook delivery
        (asynchronous — check `GET /api/v1/notifications` for the outcome).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTestResult' }
        '409':
          description: No webhook is configured (`NOTIFY_WEBHOOK_URL` unset).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/pins/live-check:
    post:
      tags: [governance]
      operationId: checkPinsLive
      summary: Dry-run the live certificate check
      description: |
        Contacts each host (or its `LIVE_CHECK_HOST_MAP` target, on its `:port` or
        443) and reports whether the **leaf** certificate it serves right now is in
        the given set. Saves nothing, and works whatever `PIN_LIVE_CHECK` is set to
        (`mode` reports the setting). The pin editor calls this before saving.

        A self-signed host, or an mTLS host that then demands a client certificate,
        still yields its chain. Unmapped wildcard entries cannot be probed.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pins]
              properties:
                pins:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [hostname, sha256]
                    properties:
                      hostname: { type: string, example: api.example.com }
                      sha256:
                        type: array
                        items: { type: string }
      responses:
        '200':
          description: One check per host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveCheckResult' }
        '400':
          description: Malformed body, or more than 50 hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        The shared `API_KEY` or a personal `ADMIN_KEYS` key (configured as its
        SHA-256), compared in constant time. Enforced on the
        management server and on every Config API listener by the `ApiKeyAuth`
        plugin, except for the paths allowlisted in `isPublicEndpoint`. When
        `API_KEY` is unset the server refuses to start unless
        `ALLOW_ANONYMOUS_ADMIN=true`, which disables authentication entirely.

  parameters:

    ConfigApiIdPath:
      name: configApiId
      in: path
      required: true
      description: Config API scope id, e.g. `default-tls`.
      schema: { type: string }
      example: default-tls

    ConfigApiIdQuery:
      name: configApiId
      in: query
      required: false
      description: >
        Scope selector, honoured on the management server. On a Config API listener
        the parameter is read but the listener's own id is the fallback, so the
        effective scope is whatever is passed — omit it there. Defaults to the
        listener's mount id (`default-tls` on the management server).
      schema: { type: string }

    HostnamePath:
      name: hostname
      in: path
      required: true
      schema: { type: string }
      example: api.example.com

    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: The value the device sends as `X-Device-Id` (its ANDROID_ID).
      schema: { type: string }

    VaultKeyPath:
      name: key
      in: path
      required: true
      description: >
        Vault file key. The client-facing routes require `^[A-Za-z0-9._-]{1,64}$` and
        forbid the reserved segments `distributions`, `stats`, `devices`, `report`,
        `tokens`.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      example: ml-model

    TokenIdPath:
      name: tokenId
      in: path
      required: true
      description: Numeric vault-token id from a token listing or issue response.
      schema: { type: integer, format: int64 }

    VaultPolicyQuery:
      name: policy
      in: query
      required: false
      description: >
        Access policy to store. Omitted keeps the existing value, or defaults to
        `token` on first upload. Not validated on upload — only
        `PUT .../policy` enforces the enum.
      schema: { type: string, enum: [public, api_key, token, token_mtls] }

    VaultEncryptionQuery:
      name: encryption
      in: query
      required: false
      description: >
        Encryption mode to store. Omitted keeps the existing value, or defaults to
        `plain` on first upload.
      schema: { type: string, enum: [plain, at_rest, end_to_end] }

    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: false
      description: >
        Stable device identifier (ANDROID_ID). Used for host-ACL scoping on config
        fetches and for `token` / `token_mtls` / `end_to_end` vault access. On an
        mTLS listener the config endpoint falls back to the client certificate CN
        (`PinVault Client: <clientId>`) when this header is absent.
      schema: { type: string }

    VaultTokenHeader:
      name: X-Vault-Token
      in: header
      required: false
      description: >
        Per-device, per-file token plaintext from
        `POST /api/v1/vault/{key}/tokens`. Required for `token` and `token_mtls`
        files.
      schema: { type: string }

    LiveCheckOverrideQuery:
      name: liveCheckOverride
      in: query
      required: false
      description: >
        Reason for storing a pin set that `PIN_LIVE_CHECK=enforce` refused (`422`).
        Accepted unless `PIN_LIVE_CHECK_ALLOW_OVERRIDE=false`; the override and its
        reason are audited (`live_check_overridden`) and notified. Keep the other
        query parameters (e.g. `configApiId`) when resending. Has no effect when the
        check passes, is off, or only warns.
      schema: { type: string }
      example: host switches to the new certificate at 18:00

    ChangeRequestIdPath:
      name: id
      in: path
      required: true
      description: Change request id — `changeRequestId` of the `202` answer.
      schema: { type: integer, format: int64 }
      example: 12

    PinVaultFeaturesHeader:
      name: X-PinVault-Features
      in: header
      required: false
      description: >
        Comma-separated client capabilities. `redelivery` (PinVault library 2.1+)
        means the client accepts the same signed envelope twice, so it may be served
        a cached one when `CONFIG_SIGNATURE_CACHE=true`. Without it every request is
        signed fresh, as before.
      schema: { type: string }
      example: redelivery

  headers:

    LiveCheckWarning:
      description: >
        `warn` when `PIN_LIVE_CHECK=warn` stored a pin set that failed the live
        certificate check (audited as `live_check_warning`, details there). Absent
        otherwise.
      schema: { type: string, enum: [warn] }

  responses:

    MissingApiKey:
      description: '`X-API-Key` header absent (only when `API_KEY` is configured).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'X-API-Key header required' }

    InvalidApiKey:
      description: '`X-API-Key` does not match the configured key.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Invalid API key' }

    PendingApproval:
      description: >
        `PIN_CHANGE_APPROVALS>=2`: the request was **not executed**. It is stored as
        a change request and replayed, as the requester, once enough other admins
        approve it (`POST /api/v1/change-requests/{id}/approve`). Management
        listener only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PendingApproval' }

    LiveCheckRejected:
      description: >
        `PIN_LIVE_CHECK=enforce` refused the pin set: for at least one new or changed
        host, the leaf certificate it serves now is not in the new pins, or the host
        could not be reached. Nothing was stored. When `overridable` is true, resend
        the same request with `liveCheckOverride=<reason>` added to the query string.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LiveCheckRejection' }

    ApprovalViaManagementOnly:
      description: >
        Config API listener while `PIN_CHANGE_APPROVALS>=2`: pin- and key-affecting
        writes are accepted only through the management API, where they can wait
        for a second admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Pin changes need approval (PIN_CHANGE_APPROVALS) and are accepted only through the management API.' }

  schemas:

    # ── Errors ──────────────────────────────────────────────────────────

    Error:
      type: object
      description: >
        Standard error envelope. Some handlers emit Turkish messages
        (e.g. `hostname gerekli`, `Host bulunamadi`).
      properties:
        error: { type: string }

    BackupRotationError:
      type: object
      description: >
        Why switching to the backup key was refused. Branch on `reason`;
        `error` is an English explanation.
      properties:
        reason:
          type: string
          enum: [no_backup_key, backup_not_published]
        error: { type: string }

    ErrorList:
      type: object
      description: Multi-error envelope used by pin-config validation.
      properties:
        errors:
          type: array
          items: { type: string }

    Saved:
      type: object
      properties:
        saved: { type: boolean, example: true }

    # ── Pin configuration ───────────────────────────────────────────────

    HostPin:
      type: object
      description: One pinned host. Mirrors `model/PinConfig.kt`.
      required: [hostname, sha256]
      properties:
        hostname:
          type: string
          description: 'Exact host, or a wildcard matching one sub-label (`*.example.com`).'
          example: api.example.com
        sha256:
          type: array
          description: >
            Base64 SHA-256 SPKI pins. At least two (primary + backup) are required by
            `PUT /api/v1/certificate-config`; each must be 44 characters decoding to
            32 bytes.
          items: { type: string }
          example: ['ziA0hyMDbayVXZ0g8AkkJz+wmKPZYjMAwb+GdNg5HYM=', 'wJGpE3i95h7E0ylT93TyLwC1BqXuK4IfoqhmtSrq5gQ=']
        version:
          type: integer
          default: 1
          description: >
            Per-host version, assigned by the server. Never moves backwards, even
            across delete + re-add. Clients reject downgrades.
        forceUpdate:
          type: boolean
          default: false
          description: Tells the client to apply this host's pins immediately.
        mtls:
          type: boolean
          default: false
          description: This host needs a client certificate.
        clientCertVersion:
          type: integer
          nullable: true
          description: >
            Bumped by `POST /api/v1/hosts/{hostname}/upload-client-cert`; a change
            triggers `syncHostClientCerts()` on the device.

    CertificateConfig:
      type: object
      description: The pin configuration (`PinConfig`).
      required: [pins]
      properties:
        version:
          type: integer
          default: 0
          description: 'Legacy global version; the effective value is `max(pins[].version)`.'
        pins:
          type: array
          items: { $ref: '#/components/schemas/HostPin' }
        forceUpdate:
          type: boolean
          default: false
          description: Global force flag. The client treats any per-host flag as equivalent.
        issuedAt:
          type: integer
          format: int64
          default: 0
          description: >
            Unix epoch ms, stamped at response time when the config is signed. `0` on
            unsigned responses. Clients reject replays where this is not strictly
            greater than the stored value.
        expiresAt:
          type: integer
          format: int64
          default: 0
          description: >
            Unix epoch ms; `issuedAt + CONFIG_TTL_SECONDS` (default 24 h). `0` on
            unsigned responses. Clients reject the payload once the wall clock passes it.

    SignedConfig:
      type: object
      description: Signed envelope returned unless `?signed=false`.
      required: [payload, signature]
      properties:
        payload:
          type: string
          description: >
            JSON-encoded `CertificateConfig` with `issuedAt` / `expiresAt` stamped.
            Verify the signature over these exact bytes before parsing.
        signature:
          type: string
          description: >
            Base64 `SHA256withECDSA` signature over `payload` by the primary signer.
        keyId:
          type: string
          description: >
            Key id (Base64 SHA-256 of the SPKI) of the primary signer — an unsigned
            hint for picking the key. Optional; older clients ignore it.
        signatures:
          type: array
          description: >
            Present only with more than one signer (`CONFIG_SIGNERS`): one signature
            per signer over `payload`, primary first. Devices configured with
            `requiredSignatures(n)` need n valid ones from keys they trust.
          items: { $ref: '#/components/schemas/SignatureEntry' }
        signingKeys:
          description: >
            The latest signing-key set the operator uploaded (rotation /
            revocation), attached to every envelope once one exists. Absent before.
          allOf:
            - $ref: '#/components/schemas/SignedKeySet'

    PinConfigHistoryEntry:
      type: object
      properties:
        hostname: { type: string }
        version: { type: integer }
        timestamp: { type: string, format: date-time }
        event:
          type: string
          enum:
            - cert_generated
            - cert_regenerated
            - cert_uploaded
            - cert_fetched
            - fetched_from_url
            - host_added
            - host_removed
            - pins_updated
            - force_update
            - mtls_enabled
            - mtls_disabled
            - client_cert_uploaded
        pinPrefix:
          type: string
          description: First 12 characters of the primary pin, for display.

    # ── Hosts ───────────────────────────────────────────────────────────

    HostActionResponse:
      type: object
      description: Result of any host mutation that changes pins.
      properties:
        hostname: { type: string }
        sha256Pins:
          type: array
          items: { type: string }
        certValidUntil: { type: string, nullable: true, format: date-time }
        version:
          type: integer
          description: The host's new version in the requested scope.

    HostStatusResponse:
      type: object
      properties:
        hostname: { type: string }
        keystorePath: { type: string, nullable: true }
        certValidUntil: { type: string, nullable: true, format: date-time }
        mockServerRunning: { type: boolean }
        mockServerPort:
          type: integer
          nullable: true
          description: 'TLS port if running, else the mTLS port.'
        mockServerMode: { type: string, enum: [tls, mtls], default: tls }
        mockTlsPort: { type: integer, nullable: true }
        mockMtlsPort: { type: integer, nullable: true }
        createdAt: { type: string, nullable: true, format: date-time }

    MockServerResponse:
      type: object
      properties:
        hostname: { type: string }
        port: { type: integer, nullable: true }
        running: { type: boolean }

    CertInfoResponse:
      type: object
      description: Parsed X.509 details read from a host's keystore.
      properties:
        subject: { type: string }
        issuer: { type: string }
        serialNumber: { type: string }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        signatureAlgorithm: { type: string }
        publicKeyAlgorithm: { type: string }
        publicKeyBits: { type: integer }
        subjectAltNames:
          type: array
          items: { type: string }
        sha256Fingerprint: { type: string }
        primaryPin:
          type: string
          description: First pin currently stored for this host in the scope, if any.
        backupPin:
          type: string
          description: Second stored pin, if any.

    HostRecord:
      type: object
      description: >
        A `hosts` row. Not returned directly by any endpoint today — `cert-info` and
        `status` project subsets of it — but it is the shape the host endpoints
        persist.
      properties:
        hostname: { type: string }
        configApiId: { type: string, default: default-tls }
        keystorePath: { type: string, nullable: true }
        certValidUntil: { type: string, nullable: true, format: date-time }
        mockServerPort: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    HostClientCertRecord:
      type: object
      properties:
        hostname: { type: string }
        version: { type: integer }
        commonName: { type: string, nullable: true }
        fingerprint: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PingRemoteResult:
      type: object
      description: >
        Union shape — `port` and `actualPin` are present only when reachable;
        `triedPorts` and `error` only when not.
      properties:
        reachable: { type: boolean }
        port: { type: integer }
        pinMatch:
          type: boolean
          description: Whether the live leaf SPKI pin is in the stored pin list.
        actualPin: { type: string }
        expectedPins:
          type: array
          items: { type: string }
        triedPorts:
          type: array
          items: { type: integer }
        error: { type: string }
        elapsedMs: { type: integer, format: int64 }

    TestConnectionResult:
      type: object
      description: 'Union shape: `httpCode` / `body` on success, `error` on failure.'
      properties:
        success: { type: boolean }
        httpCode: { type: integer }
        responseTimeMs: { type: integer, format: int64 }
        body:
          type: string
          description: First 500 characters of the mock server's response.
        error: { type: string }

    # ── Config APIs ─────────────────────────────────────────────────────

    ConfigApiInstance:
      type: object
      properties:
        id: { type: string, example: default-tls }
        port: { type: integer, example: 6651 }
        mode: { type: string, enum: [tls, mtls] }
        running: { type: boolean }

    ConfigApiWithPins:
      type: object
      description: >
        Dashboard projection: a Config API plus its pins. Hand-serialised, so
        `HostPin.mtls` and `clientCertVersion` are omitted here.
      properties:
        id: { type: string }
        port: { type: integer }
        mode: { type: string, enum: [tls, mtls] }
        pins:
          type: array
          items:
            type: object
            properties:
              hostname: { type: string }
              sha256: { type: array, items: { type: string } }
              version: { type: integer }
              forceUpdate: { type: boolean }
        version:
          type: integer
          description: 'Computed as `max(pins[].version)`.'
        running: { type: boolean }

    VaultEnabledState:
      type: object
      description: Note the boolean is serialised as a string.
      properties:
        id: { type: string }
        vault_enabled: { type: string, enum: ['true', 'false'] }

    # ── Server TLS / signing ────────────────────────────────────────────

    ServerTlsPins:
      type: object
      properties:
        primaryPin: { type: string }
        backupPin: { type: string, description: 'Empty string when only one pin exists.' }
        httpsPort: { type: integer }
        hostname: { type: string, example: localhost }

    ServerTlsPinsMutation:
      type: object
      properties:
        primaryPin: { type: string }
        backupPin: { type: string }
        regenerated: { type: boolean }
        rotated: { type: boolean }
        uploaded: { type: boolean }
        restartRequired:
          type: boolean
          description: Running listeners keep the previous keystore until the process restarts.

    # ── Client certificates / enrollment ────────────────────────────────

    ClientCertRecord:
      type: object
      properties:
        id:
          type: string
          description: 'Client id — the certificate CN minus the `PinVault Client: ` prefix.'
        commonName: { type: string, example: 'PinVault Client: my-device' }
        fingerprint: { type: string, description: Base64 SHA-256 of the SPKI. }
        createdAt: { type: string, format: date-time }
        revoked: { type: boolean, default: false }
        deviceAlias: { type: string, nullable: true }
        deviceUid:
          type: string
          nullable: true
          description: >
            The device's `X-Device-Id`, captured at enrollment. Lets `token_mtls`
            bind a token-enrolled certificate (whose client id is admin-chosen) to
            one device.

    EnrollmentToken:
      type: object
      description: Listing shape — never a usable credential.
      properties:
        token:
          type: string
          description: >
            Masked prefix (`AbC12dEf…`), or `sha256:<8 hex>…` for pre-V8 rows that the
            migration invalidated. The plaintext is unrecoverable.
          example: 'AbC12dEf…'
        clientId: { type: string }
        createdAt: { type: string, format: date-time }
        used: { type: boolean, default: false }
        masked:
          type: boolean
          default: true
          description: Always `true` — `token` is a display value, not a credential.

    MtlsStatus:
      type: object
      properties:
        mtlsApiCount: { type: integer }
        tlsApiCount: { type: integer }
        clientCerts: { type: integer }
        activeCerts: { type: integer, description: Certificates not marked revoked. }

    # ── Devices / telemetry ─────────────────────────────────────────────

    ScopedClientDevice:
      type: object
      description: A device as the Device-ACL manager sees it, keyed by `X-Device-Id`.
      properties:
        deviceId: { type: string }
        deviceAlias: { type: string, nullable: true }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        pinVersion: { type: integer, default: 0 }
        lastStatus: { type: string, default: unknown }
        lastSeen: { type: string, nullable: true, format: date-time }
        source:
          type: string
          enum: [enrollment, connection, 'enrollment+connection', unknown]
          description: Which store(s) the row was assembled from.

    ClientDevice:
      type: object
      description: >
        A `client_devices` row keyed by hostname. `deviceId` here is derived from the
        reported manufacturer/model, not from `X-Device-Id`.
      properties:
        deviceId: { type: string, example: xiaomi_mi_9t }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        pinVersion: { type: integer }
        lastStatus: { type: string }
        lastSeen: { type: string, format: date-time }

    ConnectionHistoryEntry:
      type: object
      properties:
        source:
          type: string
          enum: [web, client, config_update]
        hostname: { type: string, default: '' }
        timestamp: { type: string, format: date-time }
        status: { type: string }
        responseTimeMs: { type: integer, format: int64, default: 0 }
        errorMessage: { type: string, nullable: true }
        serverCertPin: { type: string, nullable: true }
        storedPin: { type: string, nullable: true }
        pinMatched: { type: boolean, nullable: true }
        pinVersion: { type: integer, nullable: true }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }

    ClientConnectionReport:
      type: object
      description: >
        Device connection report. `hostname`, `deviceManufacturer` and `deviceModel`
        must match `^[A-Za-z0-9._:\- ]{1,128}$` or the request is rejected with `400`.
      properties:
        hostname: { type: string, example: api.example.com }
        status: { type: string, example: success }
        responseTimeMs: { type: integer, format: int64 }
        serverCertPin: { type: string }
        storedPin: { type: string }
        pinMatched: { type: boolean }
        pinVersion: { type: integer }
        deviceManufacturer: { type: string, example: Xiaomi }
        deviceModel: { type: string, example: 'Mi 9T' }
        errorMessage: { type: string }
        timestamp:
          type: string
          format: date-time
          description: Defaults to the server's clock when omitted.

    ConfigUpdateReport:
      type: object
      description: >
        Outcome of a device-side config refresh. `deviceManufacturer` and
        `deviceModel` are subject to the same identifier check as
        `ClientConnectionReport`.
      properties:
        status: { type: string, example: success }
        pinVersion: { type: integer }
        deviceManufacturer: { type: string }
        deviceModel: { type: string }
        failureReason: { type: string }
        timestamp: { type: string, format: date-time }

    CertExpiryStatus:
      type: object
      properties:
        hostname: { type: string }
        configApiId: { type: string }
        validUntil: { type: string, format: date-time }
        daysRemaining: { type: integer }
        level: { type: string, enum: [ok, warning, expired] }

    DetailedHealth:
      type: object
      properties:
        status:
          type: string
          description: Worst certificate level across all hosts.
          enum: [ok, warning, expired]
        database: { type: string, example: connected }
        configApis:
          type: object
          properties:
            running: { type: integer }
            stopped: { type: integer }
        certs:
          type: object
          properties:
            status: { type: string }
            nearExpiry:
              type: integer
              description: Hosts whose level is not `ok`.
            total: { type: integer }

    # ── Vault ───────────────────────────────────────────────────────────

    VaultFileEntry:
      type: object
      description: >
        Vault file metadata as the listing endpoints emit it — every value except
        `key` is a string, including `version` and `size`.
      properties:
        key: { type: string, example: ml-model }
        version: { type: string, example: '3' }
        size: { type: string, description: Stored byte length., example: '10485' }
        access_policy: { type: string, enum: [public, api_key, token, token_mtls] }
        encryption: { type: string, enum: [plain, at_rest, end_to_end] }

    VaultPutResult:
      type: object
      properties:
        key: { type: string }
        version: { type: string, description: New version, as a string. }
        access_policy: { type: string, enum: [public, api_key, token, token_mtls] }
        encryption: { type: string, enum: [plain, at_rest, end_to_end] }

    VaultDeleteResult:
      type: object
      properties:
        deleted: { type: string, description: The key that was deleted. }
        status: { type: string, example: ok }

    VaultPolicyUpdate:
      type: object
      required: [access_policy, encryption]
      properties:
        access_policy:
          type: string
          enum: [public, api_key, token, token_mtls]
          description: >
            `public` = no check; `api_key` = `X-API-Key`; `token` = `X-Device-Id` +
            `X-Vault-Token`; `token_mtls` = token plus a client certificate bound to
            that device.
        encryption:
          type: string
          enum: [plain, at_rest, end_to_end]
          description: >
            Switching to or from `at_rest` rewrites the stored bytes. `end_to_end`
            wraps per device at download time with the device's registered RSA key.

    VaultToken:
      type: object
      description: Token listing row (`VaultFileTokenInfo`) — hash-backed, no plaintext.
      properties:
        id: { type: integer, format: int64 }
        configApiId: { type: string }
        vaultKey: { type: string }
        deviceId: { type: string }
        createdAt: { type: string, format: date-time }
        revoked: { type: boolean }

    GeneratedVaultToken:
      type: object
      description: Token issue response. `token` is shown once and never retrievable again.
      properties:
        id: { type: string, description: Token id, serialised as a string. }
        token: { type: string, description: Plaintext, shown once. }
        deviceId: { type: string }
        createdAt: { type: string, format: date-time }

    VaultReport:
      type: object
      description: Device-side download report.
      properties:
        key: { type: string }
        version: { type: integer }
        deviceId: { type: string, default: unknown }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        enrollmentLabel: { type: string, nullable: true }
        deviceAlias: { type: string, nullable: true }
        status: { type: string, default: downloaded, example: downloaded }
        failureReason: { type: string, nullable: true }
        authMethod:
          type: string
          nullable: true
          description: 'How the device authenticated, e.g. `token`, `token_mtls`, `public`.'

    VaultDistribution:
      type: object
      description: One recorded delivery of a vault file to a device.
      properties:
        configApiId: { type: string, default: '' }
        vaultKey: { type: string }
        version: { type: integer }
        deviceId: { type: string }
        deviceManufacturer: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        enrollmentLabel: { type: string, nullable: true }
        status:
          type: string
          description: >
            Free-form; the stats endpoint counts only the exact values `downloaded`
            and `failed`.
          example: downloaded
        timestamp: { type: string, format: date-time }
        deviceAlias: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        authMethod: { type: string, nullable: true }

    VaultDistStats:
      type: object
      properties:
        totalDistributions: { type: integer }
        uniqueDevices: { type: integer }
        uniqueKeys: { type: integer }
        downloaded: { type: integer, description: 'Rows with `status = "downloaded"`.' }
        failed: { type: integer, description: 'Rows with `status = "failed"`.' }

    # ── Device ACL ──────────────────────────────────────────────────────

    DeviceHostAclUpdate:
      type: object
      description: Counters are serialised as strings.
      properties:
        configApiId: { type: string }
        deviceId: { type: string }
        granted: { type: string, description: Comma-joined hostnames after the update. }
        added: { type: string }
        removed: { type: string }

    DefaultHostAclUpdate:
      type: object
      description: Counters are serialised as strings.
      properties:
        configApiId: { type: string }
        hostnames: { type: string, description: Comma-joined hostnames after the update. }
        added: { type: string }
        removed: { type: string }

    # ── Signing keys ────────────────────────────────────────────────────

    SigningKeyInfo:
      type: object
      description: '`GET /api/v1/signing-key`.'
      required: [publicKey, keyId, signers, keySetVersion]
      properties:
        publicKey:
          type: string
          description: Base64 X.509 SPKI of the primary signer — the value apps embed.
        keyId:
          type: string
          description: Base64 SHA-256 of that SPKI.
        signers:
          type: array
          description: Every signing key, in signing order (primary first).
          items:
            type: object
            properties:
              keyId: { type: string }
              publicKey: { type: string }
        keySetVersion:
          type: integer
          description: Version of the signing-key set devices currently receive; 0 = none.

    SignatureEntry:
      type: object
      required: [signature]
      properties:
        keyId:
          type: string
          nullable: true
          description: Base64 SHA-256 of the signer's SPKI — an unsigned hint.
        signature:
          type: string
          description: Base64 DER `SHA256withECDSA` signature.

    SignedKeySet:
      type: object
      description: >
        A signing-key set as devices receive it: `payload` exactly as the recovery
        key(s) signed it (see `SigningKeySetPayload`) and those signatures.
      required: [payload, signatures]
      properties:
        payload:
          type: string
          description: JSON text of a `SigningKeySetPayload`; verify the signatures over these exact bytes.
        signatures:
          type: array
          items: { $ref: '#/components/schemas/SignatureEntry' }

    SigningKeySetPayload:
      type: object
      description: What `SignedKeySet.payload` decodes to.
      required: [type, version, keys]
      properties:
        type: { type: string, enum: [pinvault-signing-keys] }
        version:
          type: integer
          minimum: 1
          description: Must be above the current set's version.
        keys:
          type: array
          description: Base64 X.509 SPKI (or PEM) of every signing key devices accept.
          items: { type: string }
        requiredSignatures:
          type: integer
          default: 1
          description: Valid signatures, from listed keys, a device requires on each config.

    KeySetUploadResult:
      type: object
      properties:
        version: { type: integer }
        keyIds: { type: array, items: { type: string } }
        requiredSignatures: { type: integer }
        warnings:
          type: array
          description: E.g. an active signer the set does not list.
          items: { type: string }

    SignerStatus:
      type: object
      properties:
        name: { type: string, description: 'The `CONFIG_SIGNERS` entry, e.g. `local` or `command:kms`.', example: local }
        type: { type: string, enum: [local, pkcs11, command] }
        keyId: { type: string }
        publicKey: { type: string }
        description: { type: string, description: One line, never secret., example: 'Key file signing-key.pem (plaintext on disk)' }

    SignatureCacheStats:
      type: object
      properties:
        cacheEnabled: { type: boolean, description: '`CONFIG_SIGNATURE_CACHE=true`.' }
        ttlSeconds: { type: integer, format: int64, description: '`CONFIG_TTL_SECONDS` (default 86400).' }
        signaturesProduced: { type: integer, format: int64, description: Since start, across all signers. }
        cacheHits: { type: integer, format: int64 }
        cachedEnvelopes: { type: integer }

    SigningKeySetStatus:
      type: object
      properties:
        enabled: { type: boolean, description: '`RECOVERY_PUBLIC_KEYS` is set.' }
        recoveryKeyIds: { type: array, items: { type: string } }
        recoveryRequiredSignatures: { type: integer, description: '`RECOVERY_REQUIRED_SIGNATURES` (default 1).' }
        version: { type: integer, description: 0 = no set uploaded. }
        keyIds: { type: array, items: { type: string } }
        requiredSignatures: { type: integer }
        activeSignersMissing:
          type: array
          description: >
            Key ids of active signers the current set does not list — devices that
            applied the set reject configs signed only by them.
          items: { type: string }
        uploadedBy: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time, nullable: true }

    SigningStatus:
      type: object
      properties:
        signers:
          type: array
          items: { $ref: '#/components/schemas/SignerStatus' }
        canRegenerate:
          type: boolean
          description: The primary signer is a local key file.
        cache: { $ref: '#/components/schemas/SignatureCacheStats' }
        keySet: { $ref: '#/components/schemas/SigningKeySetStatus' }

    # ── Governance ──────────────────────────────────────────────────────

    AdminMe:
      type: object
      properties:
        name: { type: string, example: alice }
        admins:
          type: array
          description: Every admin name (`admin` = the shared `API_KEY`).
          items: { type: string }
          example: [admin, alice, bob]
        approvalsRequired:
          type: integer
          description: '`PIN_CHANGE_APPROVALS` (1 = off).'
          example: 2
        liveCheck: { type: string, enum: ['off', warn, enforce] }
        liveCheckOverridable:
          type: boolean
          description: '`liveCheckOverride` is accepted (`PIN_LIVE_CHECK_ALLOW_OVERRIDE` is not `false`).'
        notificationsConfigured: { type: boolean, description: '`NOTIFY_WEBHOOK_URL` is set.' }
        signatureCache: { type: boolean, description: '`CONFIG_SIGNATURE_CACHE=true`.' }

    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor:
          type: string
          description: >
            Admin name; `system` for server-side events; approved changes read
            `requester (approved by approver)`.
          example: alice (approved by bob)
        action: { type: string, example: pins_changed }
        configApiId: { type: string, description: Empty when not scope-specific. }
        target:
          type: string
          description: Hostnames, or `METHOD /path?query` for `http` entries.
        summary: { type: string, example: 'api.example.com: pins v3→v4' }
        detail:
          type: string
          description: JSON text (e.g. the pin diff or a live-check result), or "".
        sourceIp: { type: string }
        prevHash: { type: string, description: Hex SHA-256 of the previous entry (64 zeros for the first). }
        hash: { type: string, description: Hex SHA-256 over prevHash and every field. }

    AuditPage:
      type: object
      properties:
        total: { type: integer, description: Entries matching the filter. }
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }

    AuditChainCheck:
      type: object
      properties:
        ok: { type: boolean }
        entries: { type: integer, description: Entries checked (up to the first broken one). }
        firstBrokenId: { type: integer, format: int64, nullable: true }

    PendingApproval:
      type: object
      required: [pendingApproval, changeRequestId, summary, approvalsRequired, message]
      properties:
        pendingApproval: { type: boolean, example: true }
        changeRequestId: { type: integer, format: int64, example: 12 }
        summary: { type: string, example: 'default-tls: api.example.com: pins v3→v4' }
        approvalsRequired:
          type: integer
          description: '`PIN_CHANGE_APPROVALS` — the requester counts as one.'
          example: 2
        message: { type: string, example: 'Change #12 is waiting for approval by 1 other admin(s).' }

    DiffPin:
      type: object
      description: A host's pin entry inside a diff.
      properties:
        hostname: { type: string }
        version: { type: integer }
        sha256: { type: array, items: { type: string } }
        forceUpdate: { type: boolean }
        mtls: { type: boolean }
        clientCertVersion: { type: integer, description: Absent when none. }

    ChangeRequestDetail:
      type: object
      description: >
        What `ChangeRequest.detail` decodes to: the operation and, for pin updates,
        the diff against the pins at request time plus the live-check dry run.
      properties:
        operation:
          type: string
          enum: [pins_update, force_on, force_off, host_add, host_cert, config_api_delete,
                 bootstrap_pins, signing_key, signing_keyset]
        added:
          type: array
          items: { $ref: '#/components/schemas/DiffPin' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/DiffPin' }
        changed:
          type: array
          items:
            type: object
            properties:
              hostname: { type: string }
              from: { $ref: '#/components/schemas/DiffPin' }
              to: { $ref: '#/components/schemas/DiffPin' }
        forceUpdate:
          type: object
          description: Scope-level force flag change.
          properties:
            from: { type: boolean }
            to: { type: boolean }
        liveCheck:
          description: Present when `PIN_LIVE_CHECK` is on.
          allOf:
            - $ref: '#/components/schemas/LiveCheckResult'
        baseHash:
          type: string
          description: >
            Fingerprint of the scope's pins at request time. Approval re-checks it:
            a changed scope marks the request `stale` instead of overwriting.
        describeError: { type: string, description: Set when the diff could not be computed. }

    ChangeRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: '`createdAt` + `APPROVAL_TTL_HOURS` (default 24).' }
        requestedBy: { type: string }
        method: { type: string, example: PUT }
        path: { type: string, example: /api/v1/certificate-config }
        query: { type: string, example: configApiId=default-tls }
        contentType: { type: string }
        configApiId: { type: string }
        summary: { type: string }
        detail:
          type: string
          description: JSON text of a `ChangeRequestDetail`.
        status: { type: string, enum: [pending, applied, failed, rejected, expired, stale] }
        approvedBy: { type: array, items: { type: string } }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        resultStatus:
          type: integer
          nullable: true
          description: HTTP status of the replay (applied / failed).
        resultBody:
          type: string
          nullable: true
          description: The replay's response body (first 2000 characters).

    LiveCheckHostCheck:
      type: object
      properties:
        hostname: { type: string, description: The pinned name. }
        probed:
          type: string
          nullable: true
          description: '`host:port` contacted; null when the name could not be probed at all (an unmapped wildcard).'
          example: api.example.com:443
        reachable: { type: boolean }
        livePins:
          type: array
          description: SPKI pins (Base64 SHA-256) of the chain the host served, **leaf first**.
          items: { type: string }
        matched:
          type: boolean
          description: >
            The chain passes the way a device checks it: the leaf's pin is in the
            set, or the pin of an issuer the leaf validly chains to (signatures,
            validity, CA constraints up to the pinned certificate).
        error: { type: string, nullable: true, description: Why the host could not be reached. }

    LiveCheckResult:
      type: object
      properties:
        mode: { type: string, enum: ['off', warn, enforce], description: '`PIN_LIVE_CHECK`.' }
        passed: { type: boolean }
        checks:
          type: array
          items: { $ref: '#/components/schemas/LiveCheckHostCheck' }

    LiveCheckRejection:
      type: object
      properties:
        error: { type: string }
        liveCheck: { $ref: '#/components/schemas/LiveCheckResult' }
        overridable:
          type: boolean
          description: '`liveCheckOverride=<reason>` would be accepted.'

    NotificationDelivery:
      type: object
      properties:
        event: { type: string, example: pins_changed }
        at: { type: string, format: date-time }
        auditId: { type: integer, format: int64, nullable: true }
        status: { type: integer, nullable: true, description: HTTP status of the last attempt; null when it never connected. }
        attempts: { type: integer }
        error: { type: string, nullable: true }

    NotificationStatus:
      type: object
      properties:
        configured: { type: boolean }
        target:
          type: string
          nullable: true
          description: Scheme, host and port of the webhook — never its path.
        signed: { type: boolean, description: '`NOTIFY_WEBHOOK_SECRET` is set (`X-PinVault-Signature`).' }
        events:
          type: array
          description: '`NOTIFY_EVENTS`; `*` = every audit action except `http`.'
          items: { type: string }
        recent:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }

    NotificationTestResult:
      type: object
      properties:
        sent: { type: boolean, example: true }
        auditId: { type: integer, format: int64 }
