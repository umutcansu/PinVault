openapi: 3.0.3

info:
  title: PinVault Demo Server API
  version: 2.0.0
  description: |
    Reference backend for the PinVault Android SSL-pinning library.

    ## Listeners

    The process starts **two kinds of HTTP listener**, and they do **not** expose
    the same routes:

    | Listener | Source | Purpose |
    |---|---|---|
    | **Management server** | `Main.kt` → `embeddedServer(Netty, port = PORT)` | Web dashboard + admin API |
    | **Config API listeners** | `Main.kt` → `configApiModuleFor()`, started by `ConfigApiManager` | TLS / mTLS endpoints the Android devices talk to |

    Every operation below carries an **`x-registered-on`** extension and a
    `Registered on:` line in its description:

    * `management` — only on the management HTTP port.
    * `config-api` — only on the TLS/mTLS Config API ports.
    * `management+config-api` — on both.

    Routes shared by both come from `certificateConfigRoutes()` and
    `hostRoutes()`, which `Main.kt` mounts twice. `vaultRoutes()` (`/api/v1/vault/…`)
    is mounted **only inside `configApiModuleFor()`** and carries the **device**
    endpoints only: download, download report and device-key registration.
    **Vault administration is not served on the device-facing ports at all**
    (upload, delete, policy, tokens, distributions, key resets used to be): it
    lives on the management port under
    `/api/v1/config-apis/{configApiId}/vault/…` (`scopedVaultAdminRoutes`), where
    every write can wait for a second admin.

    Beyond the documented paths, the management server also serves the dashboard's
    static assets at `GET /static/{...}` (`staticResources`), which is unauthenticated.

    ## Authentication

    `X-API-Key` is enforced by the `ApiKeyAuth` plugin, installed on **both** the
    management server and every Config API listener. The plugin consults
    `isPublicEndpoint(path, method)` in `plugin/ApiKeyAuth.kt`; anything not
    allowlisted there needs the key. Operations reflect this exactly:
    `security: []` = public, `security: [{ApiKeyAuth: []}]` = key required.

    * `401` `{"error":"X-API-Key header required"}` when the header is absent.
    * `403` `{"error":"Invalid API key"}` when it does not match (constant-time compare).
    * The key is either the shared `API_KEY` (its holder is named `admin`) or a
      personal key from `ADMIN_KEYS` / `ADMIN_KEYS_FILE` (`name:sha256hex` — only
      the key's SHA-256 is configured). Named keys are what make the audit log say
      *who* did something, and what two-person approval needs.
    * When `API_KEY` is unset the server **refuses to start** unless
      `ALLOW_ANONYMOUS_ADMIN=true`, in which case the plugin short-circuits and
      *no* endpoint is authenticated. The management listener then binds
      `127.0.0.1` only (unless `MANAGEMENT_BIND` says otherwise) and every admin
      request must be addressed to this machine (see *Browser protections*). The
      `security` blocks below describe the normal (`API_KEY` set) deployment.
    * The server also refuses to start while `KEYSTORE_PASSWORD`,
      `VAULT_AT_REST_PASSWORD` or `SIGNING_KEY_PASSWORD` (with a local signer)
      is unset, unless `ALLOW_DEMO_SECRETS=true` (local development).

    ## Browser protections (admin API)

    The admin API is reachable from the browser the dashboard runs in. Every
    **state-changing** admin request (anything but `GET`/`HEAD`/`OPTIONS` on a
    non-public path) is therefore checked before the key is:

    * `403 cross_origin_request` — `Origin` is present and is not the origin the
      request was addressed to (its `Host`; add a proxy's origin with
      `ADMIN_ALLOWED_ORIGINS`).
    * `403 cross_site_request` — `Sec-Fetch-Site` is `cross-site` or `same-site`.
    * `415 admin_write_needs_json` — the request is neither `application/json`
      nor marked with a header a cross-site form cannot add: `X-API-Key` or
      `X-PinVault-Admin` (the dashboard sends the latter with every request).
      With an admin key every write passes this by construction; without one
      (`ALLOW_ANONYMOUS_ADMIN=true`) a script must send JSON or the marker.
    * `403 host_not_allowed` — only with `ALLOW_ANONYMOUS_ADMIN=true`, and on
      **every** admin request, reads included: `Host` must be `localhost`,
      `127.0.0.1` or `[::1]` with the listener's port, or an entry of
      `MANAGEMENT_ALLOWED_HOSTS` (`host:port`). This is what stops DNS rebinding
      where no key does.

    Device endpoints are not touched. Refusals are audited (summarised) as
    `admin_request_refused`. An unhandled error on the management listener is
    answered `500 {"error":"Internal server error","errorId":"…"}`; the detail is
    in the server log under that id.

    Note the allowlist is path-exact: `GET /health` is public but
    `GET /api/v1/health` is **not**, and `GET /api/v1/certificate-config` is public
    while `PUT` on the same path and every `/api/v1/certificate-config/...` sub-path
    are admin-only.

    ## Device-facing guards

    * **Body cap.** `POST`/`PUT` bodies on the public endpoints (and everything on
      the recovery door) are capped at 64 KB: a larger declared length gets `413
      body_too_large` before the body is read, a chunked body without a declared
      length `411 length_required`. The cap also holds while reading: a body that
      declares nothing (HTTP/2 needs neither header) is read up to the cap and
      answered `413`. Vault uploads (admin) are capped at `VAULT_MAX_FILE_BYTES`
      (default 50 MB, `413`), every other admin upload or JSON body that is read
      into memory — keystores, certificates, and any body held for approval — at
      `ADMIN_UPLOAD_MAX_BYTES` (default 1 MB, `413`).
    * **Refusal limit.** Every refusal (`400`, `401`, `403`, `404`, `409`, `411`,
      `413`) on enrollment, E2E key registration, vault downloads and host client
      certificate downloads is counted per source address (an IPv6 address by its
      /64). After `DEVICE_REFUSAL_RATE_LIMIT` refusals in 10 minutes (default 300,
      `0` = off) the address gets `429 rate_limited` on those endpoints, before
      anything is read or parsed. Requests that are served are not counted.
      Renewal counts for itself (see the endpoint).
    * **CSR keys.** A CSR is at most 8 KB and its key RSA 2048–4096 with exponent
      65537, or EC on the named curve P-256 or P-384 — checked before any
      signature is verified; anything else is `400 invalid_csr`.
    * **Reports** (`/api/v1/vault/report`, `/api/v1/connection-history/client-report`,
      `…/config-update-report`) take no credential on a TLS listener: every field
      is checked or cut to size, the time is the server's, a source address files
      at most `REPORT_RATE_LIMIT` reports per 10 minutes (default 600) and a device
      `REPORT_DEVICE_RATE_LIMIT` (default 120; `0` = off, `429 rate_limited`), and
      history is trimmed per Config API with failures kept apart.
    * **TLS only.** On the management server's plain-HTTP port, enrollment (and
      any other device endpoint that takes a token or returns a key) is answered
      `403 tls_required` unless the connection comes from the server's own machine.
    * **Revocation.** Every request on an **mTLS** Config API listener whose client
      certificate belongs to a revoked identity is answered `403
      {"error":"reenroll_required"}` — the handshake trusts the client CA, the
      revocation check happens per request.
    * **Device id.** On an **mTLS** listener `X-Device-Id` may only name the device
      the client certificate belongs to (its client id, or the `deviceUid` recorded
      when it enrolled); any other value is answered `403
      {"error":"device_identity_mismatch"}` on every endpoint. On a TLS listener the
      header is the device's own claim.
    * **E2E key registration** stores only RSA keys of 2048–4096 bits (re-encoded),
      for device ids of the identifier shape. Without a client certificate a source
      address writes at most `DEVICE_KEY_RATE_LIMIT` keys per 10 minutes (default
      30, `0` = off; `429 rate_limited`), and a Config API holds at most
      `DEVICE_KEY_LIMIT` keys (default 100 000; a new device beyond it gets `503
      device_key_limit_reached`).

    ## Client-integrity contracts

    * **`X-P12-SHA256`** — `POST /api/v1/client-certs/enroll` returns the Base64
      SHA-256 of the P12 body in this header. The library **refuses to install** a
      P12 that arrives without it. (`POST /api/v1/client-certs/generate` does *not*
      send the header — it is a dashboard download, not an enrollment path.)
    * **Signed configs** carry `issuedAt` / `expiresAt` (Unix epoch ms) stamped at
      response time; TTL comes from `CONFIG_TTL_SECONDS` (default 24 h). Clients
      reject expired windows, replays (`issuedAt <= stored`) and per-host downgrades.
      The envelope may also carry `keyId`, one `signatures[]` entry per signer
      (`CONFIG_SIGNERS`, m-of-n) and the latest signing-key set (`signingKeys`);
      older clients ignore all three.
    * **Enrollment tokens** are returned in plaintext exactly once, by
      `POST /api/v1/enrollment-tokens/generate`. The listing endpoint returns a
      masked prefix (`AbC12dEf…`) with `masked: true`; the plaintext is
      unrecoverable (only its SHA-256 is stored).
    * **Vault files** are served with `X-Vault-Signature` (ECDSA over
      `pinvault-vault-file:v1:<key>:<version>:<sha256HexLower(plaintext)>`), signed
      over the *plaintext* so one signature covers plain / at_rest / end_to_end.
      With several signers every signature is also sent in `X-Vault-Signatures`.
      Since 2.2.0 also `X-Vault-Signature-V2` / `X-Vault-Signatures-V2` (same
      encoding) over `pinvault-vault-file:v2:<configApiId>:<key>:<version>:<sha256HexLower(plaintext)>`:
      they name the Config API, and a library block with `serverScope` accepts only them.
    * **Signed config payloads** name the Config API they were signed for
      (`"configApiId": "<scope id>"`, since 2.2.0); a block with `serverScope(id)`
      refuses a payload naming another id or none.
    * **mTLS identities** are read from the client certificate's CN, and believed
      only for the certificate on record for that id (2.2.0): a certificate over
      the identity's registered key (CSR enrollments), or exactly the stored
      certificate (P12s, uploaded certificates). Anything else — a leaf some other
      trusted key signed with that id in it — gets `403 reenroll_required` on every
      mTLS listener, like a revoked identity.

    ## Governance (optional — each part is off or inert until configured)

    * **Audit log** — always on. Every successful admin write, attributed to the
      admin who made it, in an append-only, hash-chained log
      (`GET /api/v1/audit-log`, `GET /api/v1/audit-log/verify`).
    * **Two-person approval** — `PIN_CHANGE_APPROVALS=2` (or more; needs personal
      `ADMIN_KEYS`). Every gated write listed below then answers
      `202 {"pendingApproval":true,"changeRequestId":…}` **without executing**; the
      server replays the stored request, as the requester, once enough *other*
      admins approve it (`/api/v1/change-requests`). The shared `API_KEY` cannot
      approve, nobody approves their own request, and requests expire after
      `APPROVAL_TTL_HOURS` (default 24). On Config API listeners these writes answer
      `409` — they are accepted only through the management API. Affected routes:
      `PUT /api/v1/certificate-config`, the four `force-update` / `clear-force`
      routes, `POST /api/v1/config/{configApiId}/update`, host creation
      (`/api/v1/hosts/generate-cert|fetch-from-url|upload-cert`,
      `/api/v1/management/hosts/{configApiId}/generate-cert`), host certificate
      changes (`/api/v1/hosts/{hostname}/regenerate-cert|upload-cert|fetch-cert-url|toggle-mtls|upload-client-cert`),
      `POST /api/v1/config-apis/delete`,
      `/api/v1/server-tls-pins/regenerate|upload|fetch-from-url`,
      `POST /api/v1/signing-key/regenerate`, `PUT /api/v1/signing-keyset` and the
      host ACL writes (`PUT /api/v1/config-apis/{configApiId}/default-host-acl`,
      `PUT /api/v1/config-apis/{configApiId}/devices/{deviceId}/host-acl`).
      Also gated, each under its own operation name: **trust material and
      identities** — `POST /api/v1/client-certs/upload` (`client_cert_upload`),
      `POST /api/v1/client-certs/generate` (`client_cert_generate`),
      `POST /api/v1/enrollment-policies` (`enrollment_policy_create`),
      `PUT /api/v1/enrollment-open` (`enrollment_open`),
      `POST /api/v1/enrollment-tokens/generate` (`enrollment_token`) — and the
      **vault**, under `/api/v1/config-apis/{configApiId}/…`: `PUT vault/{key}`
      (`vault_upload`), `DELETE vault/{key}` (`vault_delete`),
      `PUT vault/{key}/policy` (`vault_policy`), `POST vault/{key}/tokens`
      (`vault_token_issue`), `DELETE vault/tokens/{tokenId}`
      (`vault_token_revoke`), `DELETE vault/devices/{deviceId}/public-key`
      (`device_key_reset`) and `PUT vault-enabled` (`vault_enabled`).
      **Not gated, on purpose:** revocation and forgetting
      (`DELETE /api/v1/client-certs/{id}`, `…/forget`), stopping an enrollment
      code, `DELETE /api/v1/enrollment-open` (closing code-less applications) —
      emergencies take effect at once — and deciding on a device that asked to
      enroll (`/api/v1/enrollment-requests/{id}/approve|reject`), which is itself
      a second person's act.
      `APPROVAL_EXEMPT_OPERATIONS` (comma-separated operation names, empty by
      default) takes operations out of the rule; an unknown name is a startup
      error. **Certificate changes are planned when requested**: the approver is
      shown the pins, the certificate and the Config APIs that change, and
      exactly that plan is applied (nothing is fetched or generated at approval
      time). **Answers that carry a secret** (a P12, an enrollment token or code,
      a vault token) are not produced by the approval: the request becomes
      `approved` and its requester sends it again to run it once.
    * **Live certificate check** — `PIN_LIVE_CHECK=warn|enforce` compares every new
      or changed pin set with the leaf certificate the host serves right now.
      `warn` stores it and answers with `X-PinVault-Live-Check: warn`; `enforce`
      refuses it with `422` unless the request carries `liveCheckOverride=<reason>`
      (allowed unless `PIN_LIVE_CHECK_ALLOW_OVERRIDE=false`). `LIVE_CHECK_HOST_MAP`
      says where to probe names this server cannot reach directly;
      `POST /api/v1/pins/live-check` is a dry run in every mode.
    * **Webhook notifications** — `NOTIFY_WEBHOOK_URL` pushes audit events
      (Slack-compatible `text` field); `NOTIFY_WEBHOOK_SECRET` adds
      `X-PinVault-Timestamp: <Unix seconds>` and `X-PinVault-Signature:
      sha256=<hex HMAC-SHA256 of "<timestamp>.<body>">` — a receiver recomputes
      it, refuses timestamps more than a few minutes old and an `auditId` it has
      already seen, and so cannot be replayed to. `NOTIFY_EVENTS` filters
      (`*` leaves out `device_key_registered`, which any device's first start
      records; name it to receive it).
    * **Signing** — `CONFIG_SIGNERS` (local key file, PKCS#11 HSM, external
      command; several = one signature each), `CONFIG_SIGNATURE_CACHE=true` (sign
      each content once — always on with a `command` or `pkcs11` signer, where
      every client is served the cached envelope and at most
      `SIGNER_MAX_CONCURRENT` signings run at once, `SIGNER_MAX_QUEUE` more
      waiting, the rest `503`), and signing-key sets checked against
      `RECOVERY_PUBLIC_KEYS`. See `GET /api/v1/signing/status`.

servers:
  - url: http://localhost:6650
    description: Management HTTP API + web dashboard (project default)
  - url: https://localhost:6651
    description: TLS Config API (project default)
  - url: https://localhost:6652
    description: mTLS Config API (project default; requires a client certificate)
  - url: http://localhost:8090
    description: Management HTTP API — alternate local-development port
  - url: https://localhost:8091
    description: TLS Config API — alternate local-development port
  - url: https://localhost:8092
    description: mTLS Config API — alternate local-development port

security:
  - ApiKeyAuth: []

tags:
  - name: certificate-config
    description: Pin config download / edit, per-host history and force-update flags.
  - name: hosts
    description: Per-host certificate lifecycle and mock TLS/mTLS servers.
  - name: config-apis
    description: Lifecycle of the dynamic TLS/mTLS Config API listeners.
  - name: client-certs
    description: mTLS client certificate inventory (generate, import, revoke, download).
  - name: enrollment
    description: Enrollment mode, single-use enrollment tokens, device enrollment.
  - name: vault
    description: Client-facing VaultFile download and reporting (Config API ports).
  - name: vault-admin
    description: Vault file CRUD, access tokens, distribution history and stats.
  - name: device-acl
    description: Per-device and default host ACLs used to scope pin config responses.
  - name: connection-history
    description: Connection and config-update telemetry from devices and the dashboard.
  - name: server-tls
    description: The demo server's own TLS keypair and the pins clients bootstrap with.
  - name: signing-key
    description: >
      ECDSA P-256 config/vault signing keys — signers, signature cache and the
      signing-key set devices accept.
  - name: governance
    description: >
      Admin identity, the hash-chained audit log, two-person approval of pin and
      key changes, webhook notifications and the live certificate check.
  - name: monitoring
    description: Health probes, certificate expiry monitoring, API docs, dashboard.
  - name: attestation
    description: >
      App and device attestation (ATTESTATION.md): the device-side challenge /
      attest round trip on the Config API ports, the per-Config-API rejection
      policy, attested devices with their verdicts and annotations, verdict
      statistics, and the `PinVault-Token` HS256 secrets backends verify with.

paths:

  # ─────────────────────────────────────────────────────────────────────
  # monitoring
  # ─────────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [monitoring]
      operationId: health
      summary: Liveness probe
      description: |
        Docker/Compose health probe. Always `{"status":"ok"}` while the process is up.

        Registered on: **management + config-api** (`Main.kt` registers it in the
        management `routing {}` block and again inside `configApiModuleFor()`).
      security: []
      x-registered-on: management+config-api
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/v1/health:
    get:
      tags: [monitoring]
      operationId: detailedHealth
      summary: Detailed health (certs, config APIs, database)
      description: |
        Aggregated status. Unlike `/health` this path is **not** in the
        `isPublicEndpoint` allowlist, so it requires `X-API-Key`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Aggregated status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailedHealth' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/cert-expiry:
    get:
      tags: [monitoring]
      operationId: certExpiry
      summary: Certificate expiry report
      description: |
        Runs `CertExpiryMonitor.checkAll()` over every host keystore recorded in the
        `hosts` table. A background thread logs the same data every 6 hours.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: One entry per host with a recorded `cert_valid_until`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CertExpiryStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /docs:
    get:
      tags: [monitoring]
      operationId: docs
      summary: Swagger UI
      description: |
        `302` redirect to `/static/docs.html`, which loads this document through the
        bundled Swagger UI.

        Registered on: **management** only.
      security: []
      x-registered-on: management
      responses:
        '302':
          description: Redirect to `/static/docs.html`.
          headers:
            Location:
              schema: { type: string, example: /static/docs.html }

  /:
    get:
      tags: [monitoring]
      operationId: dashboard
      summary: Web dashboard
      description: |
        Serves `static/index.html` (TR/EN admin dashboard) as `text/html`.

        Registered on: **management** only.
      security: []
      x-registered-on: management
      responses:
        '200':
          description: Dashboard HTML.
          content:
            text/html:
              schema: { type: string }

  # ─────────────────────────────────────────────────────────────────────
  # certificate-config
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/certificate-config:
    get:
      tags: [certificate-config]
      operationId: getCertificateConfig
      summary: Download the pin configuration (client endpoint)
      description: |
        The endpoint the Android library polls. Public — this exact path + method is
        the only `/api/v1/certificate-config*` entry in the `isPublicEndpoint`
        allowlist.

        **Scoping.** When `hosts` is supplied and/or the caller is identified (by the
        `X-Device-Id` header, or on an mTLS listener by the client certificate CN —
        `PinVault Client: <clientId>`), `DeviceHostAclStore.resolve()` intersects the
        request with the device ACL and the response contains only the granted pins.
        Denied hosts are dropped silently (logged server-side as
        `Unauthorized host request`). With no `hosts`, no `X-Device-Id` and no
        client certificate, the full config is returned unchanged.
        On an mTLS listener `X-Device-Id` must belong to the client certificate
        (`403 device_identity_mismatch` otherwise), so a device cannot read the pins
        another device's ACL grants. On a TLS listener the header is self-reported:
        there the ACL shapes what an honest device receives, nothing more.

        **Signing.** Unless `signed=false`, the response is a
        [SignedConfig](#/components/schemas/SignedConfig) envelope whose `payload` is
        the JSON-encoded config stamped with `issuedAt = now` and
        `expiresAt = now + CONFIG_TTL_SECONDS` (default 24 h). With `signed=false` the
        bare config object is returned and `issuedAt` / `expiresAt` stay `0`.

        **Signature cache.** With `CONFIG_SIGNATURE_CACHE=true` the same content is
        signed once and the identical envelope served until half its lifetime has
        passed — but only to clients that send `X-PinVault-Features: redelivery`
        (library 2.1+). Every other client still gets a fresh signature per request,
        since it would reject a repeated `issuedAt` as a replay. The latest
        signing-key set, if any, rides along in `signingKeys`.

        Registered on: **management + config-api**.
      security: []
      x-registered-on: management+config-api
      parameters:
        - name: hosts
          in: query
          required: false
          description: >
            Comma-separated hostnames the device wants pins for, e.g.
            `api.example.com,cdn.example.com`. Blank entries are dropped. The result
            is the intersection with the device's ACL.
          schema: { type: string }
          example: api.example.com,cdn.example.com
        - name: signed
          in: query
          required: false
          description: >
            Only the literal value `false` has an effect: it returns the plain config
            instead of the signed envelope. Any other value (including omitting the
            parameter) yields the signed envelope.
          schema: { type: string, enum: ['false'] }
        - name: currentVersion
          in: query
          required: false
          deprecated: true
          description: >
            **Ignored by the server.** The Android library still appends it on every
            fetch (`DynamicConfigService.getConfig` / `getSignedConfig` /
            `getScopedConfig` in `DefaultCertificateConfigApi.kt`), but the handler
            never reads the value — there is no conditional-GET or `304` behaviour on
            this endpoint, and the response is always the full current config for the
            granted hosts. Kept here only so the parameter the client sends is
            accounted for; do not build anything on it.
          schema: { type: integer, minimum: 0 }
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/PinVaultFeaturesHeader'
      responses:
        '200':
          description: >
            Signed envelope by default; the bare config when `signed=false`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SignedConfig'
                  - $ref: '#/components/schemas/CertificateConfig'
        '403':
          description: >
            mTLS listener only: `reenroll_required` (the certificate's identity was
            revoked) or `device_identity_mismatch` (`X-Device-Id` names a device the
            certificate does not belong to).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [certificate-config]
      operationId: putCertificateConfig
      summary: Replace the pin configuration
      description: |
        Replaces the whole pin set for this scope.

        **Per-host versioning** is applied server-side before validation: a host
        absent from the current config is stored at `version: 1`, a host whose
        `sha256` list changed gets `oldVersion + 1`, an unchanged host keeps its
        version. Client-supplied `version` values are overwritten. Re-added hosts
        continue their previous sequence (see `PinConfigStore.save`), so versions
        never move backwards.

        **Validation** (`validatePinConfig`): every host needs a non-blank hostname
        and **at least 2 pins** (primary + backup); every pin must be 44 characters
        of Base64 decoding to exactly 32 bytes.

        Writes `host_added` / `host_removed` / `pins_updated` history entries.

        The body replaces the scope **including every flag**: a client that edits one
        host must send the other hosts' `forceUpdate` / `mtls` /
        `clientCertVersion` (and the top-level `forceUpdate`) back unchanged.

        **Live certificate check** (`PIN_LIVE_CHECK`): new or changed hosts must pin
        the leaf certificate they serve now — see `422`, `liveCheckOverride` and
        `X-PinVault-Live-Check`. **Approval** (`PIN_CHANGE_APPROVALS>=2`): see `202`.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdQuery'
        - $ref: '#/components/parameters/LiveCheckOverrideQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateConfig' }
      responses:
        '200':
          description: The configuration as stored, with server-assigned versions.
          headers:
            X-PinVault-Live-Check: { $ref: '#/components/headers/LiveCheckWarning' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '400':
          description: >
            Pin validation failed — the library's rules: a valid host pattern, at most
            2000 hosts, 2–32 distinct pins per host, each the Base64 of a SHA-256
            (43 characters and `=`). A config with no host at all is accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorList' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409':
          description: >
            The same hostname appears more than once in the request body, compared
            ignoring case as the library does (`ErrorList`) — or, on a Config API listener while
            `PIN_CHANGE_APPROVALS>=2`, pin changes are accepted only through the
            management API (`Error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorList'
                  - $ref: '#/components/schemas/Error'
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/certificate-config/history/{hostname}:
    get:
      tags: [certificate-config]
      operationId: getCertificateConfigHistory
      summary: Pin history for one host
      description: |
        Events recorded for this hostname: `cert_generated`, `cert_regenerated`,
        `cert_uploaded`, `cert_fetched`, `fetched_from_url`, `host_added`,
        `host_removed`, `pins_updated`, `force_update`, `mtls_enabled`,
        `mtls_disabled`, `client_cert_uploaded`.

        The lookup is by hostname across all scopes (`getByHostname`), not scoped to
        the listener's Config API.

        Registered on: **management + config-api**. Admin-only on both — the
        allowlist covers only the exact `/api/v1/certificate-config` path.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
      responses:
        '200':
          description: History entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PinConfigHistoryEntry' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/certificate-config/force-update/{hostname}:
    post:
      tags: [certificate-config]
      operationId: forceUpdateHost
      summary: Set forceUpdate on one host
      description: |
        Sets `forceUpdate: true` on the matching pin and records a `force_update`
        history entry. An unknown hostname is a silent no-op (still `200`).

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
      responses:
        '200':
          description: The updated configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/certificate-config/clear-force/{hostname}:
    post:
      tags: [certificate-config]
      operationId: clearForceUpdateHost
      summary: Clear forceUpdate on one host
      description: |
        Sets `forceUpdate: false` on the matching pin. No history entry is written.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
      responses:
        '200':
          description: The updated configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/certificate-config/force-update:
    post:
      tags: [certificate-config]
      operationId: forceUpdateAll
      summary: Set forceUpdate on every host
      description: |
        Backward-compatible global switch: sets `forceUpdate: true` on every pin and
        writes one `force_update` history entry per host. Note the top-level
        `forceUpdate` flag is left untouched.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      responses:
        '200':
          description: The updated configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/certificate-config/clear-force:
    post:
      tags: [certificate-config]
      operationId: clearForceUpdateAll
      summary: Clear forceUpdate everywhere
      description: |
        Clears the top-level `forceUpdate` flag **and** the per-host flags.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      responses:
        '200':
          description: The updated configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config/{configApiId}:
    get:
      tags: [certificate-config]
      operationId: getConfigForApi
      summary: Read one Config API's pin configuration (dashboard)
      description: |
        Dashboard helper that reads any scope by id, rather than the scope the
        listener is bound to. Unknown ids return an empty config rather than `404`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: The stored configuration for this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config/{configApiId}/update:
    post:
      tags: [certificate-config]
      operationId: updateConfigForApi
      summary: Overwrite one Config API's pin configuration (dashboard)
      description: |
        The same write as `PUT /api/v1/certificate-config?configApiId=…`, with the
        scope taken from the path: duplicate and format validation, per-host
        versioning, the live certificate check and the history entries. (It used to
        store the body verbatim, without any of those checks.)

        Returns the configuration as stored, with server-assigned versions.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/LiveCheckOverrideQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateConfig' }
      responses:
        '200':
          description: The configuration as stored, with server-assigned versions.
          headers:
            X-PinVault-Live-Check: { $ref: '#/components/headers/LiveCheckWarning' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateConfig' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '400':
          description: Pin validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorList' }
        '409':
          description: The same hostname appears more than once in the request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorList' }
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/all-configs:
    get:
      tags: [certificate-config]
      operationId: getAllConfigs
      summary: All Config APIs with their pins (dashboard sidebar)
      description: |
        Running and stopped Config APIs, each with its pin list and computed version.
        The response is hand-serialised JSON: `HostPin.mtls` and `clientCertVersion`
        are omitted here even though the stored pins carry them.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Running instances first, then stopped ones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigApiWithPins' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # signing-key
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/signing-key:
    get:
      tags: [signing-key]
      operationId: getSigningKey
      summary: ECDSA public key (client endpoint)
      description: |
        Base64 X.509 SubjectPublicKeyInfo of the P-256 key used for
        `SHA256withECDSA` config and vault-file signatures. This is the value that
        goes into `ConfigApiBlock.Builder.signaturePublicKey(...)` in the APK.

        With several signers (`CONFIG_SIGNERS`) `publicKey` stays the primary
        signer's key and `signers` lists every key, in signing order.
        `keySetVersion` is the signing-key set devices currently receive (0 = none).

        Public: the allowlist matches this path for **any** method.

        Registered on: **management + config-api**.
      security: []
      x-registered-on: management+config-api
      responses:
        '200':
          description: The public half of the signing key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKeyInfo' }

  /api/v1/signing-key/regenerate:
    post:
      tags: [signing-key]
      operationId: regenerateSigningKey
      summary: Destroy and regenerate the signing keypair
      description: |
        Replaces the primary key file (`SIGNING_KEY_PATH`, default
        `signing-key.pem`) with a fresh key, effective immediately on every
        listener. **Every already-shipped client that pinned the old public key will
        reject configs until it is rebuilt with the new one.** Takes no request body.

        Refused (`409`) when the primary signer is not a local key file (rotate an
        HSM/KMS key where it lives) and while a signing-key set is active (a fresh
        key would be in no set — rotate through a set instead). Audited as
        `signing_key_regenerated`.

        If `SIGNING_KEY_PASSWORD` is set, the new key is written AES-GCM encrypted at
        rest.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The new public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: string, description: Base64 X.509 SPKI of the new key. }
                  keyId: { type: string, description: Base64 SHA-256 of that SPKI. }
                  regenerated: { type: boolean, example: true }
                  clientUpdateRequired: { type: boolean, example: true }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409':
          description: >
            The primary signer is not a local key file, or a signing-key set is
            active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/signing/status:
    get:
      tags: [signing-key]
      operationId: getSigningStatus
      summary: Signers, signature cache and signing-key set
      description: |
        Everything the dashboard shows about signing:

        * `signers` — every key configured with `CONFIG_SIGNERS`, primary first
          (`local` key file, `pkcs11` HSM key, or an external `command`). Several
          signers give every config and vault file one signature each.
        * `canRegenerate` — true only when the primary signer is a local key file.
        * `cache` — `CONFIG_SIGNATURE_CACHE` state and counters.
        * `keySet` — the signing-key set feature: off without `RECOVERY_PUBLIC_KEYS`;
          otherwise the current set (version 0 = none uploaded) and
          `activeSignersMissing`, the active signers the set does NOT list (devices
          that applied the set reject configs signed only by them).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Current signing configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/signing-keyset:
    get:
      tags: [signing-key]
      operationId: getSigningKeySet
      summary: The latest signing-key set, as devices receive it
      description: |
        The payload exactly as the recovery key(s) signed it, with those signatures —
        the same object every signed config carries as `signingKeys`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The latest set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedKeySet' }
        '404':
          description: No set has been uploaded, or key sets are off (no `RECOVERY_PUBLIC_KEYS`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [signing-key]
      operationId: putSigningKeySet
      summary: Publish a signing-key set (signed offline by the recovery key)
      description: |
        A signing-key set lists the signing keys devices accept from now on — how
        signing keys are rotated or revoked without shipping a new APK. The server
        holds no recovery key: the set is signed **offline**, and the server only
        checks it the way a device will before relaying it with every config:

        * at least `RECOVERY_REQUIRED_SIGNATURES` valid signatures from
          `RECOVERY_PUBLIC_KEYS` over the exact `payload` string;
        * `payload` is `{"type":"pinvault-signing-keys","version":N,"keys":[…],"requiredSignatures":n}`
          with `version` above the current set's, parseable EC keys, no recovery key
          doubling as a signing key, and `requiredSignatures` ≤ number of keys;
        * enough of this server's active signers are listed to satisfy
          `requiredSignatures` — otherwise every device that applied the set would
          refuse every config (`409`).

        Accepted with warnings when an active signer is not listed. Audited as
        `signing_keyset_uploaded`; cached signatures are dropped.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedKeySet' }
      responses:
        '200':
          description: Stored; devices receive it with their next config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeySetUploadResult' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '400':
          description: The body is not `{"payload":"…","signatures":[…]}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            Key sets are off (no `RECOVERY_PUBLIC_KEYS`), or the set is valid but
            unsafe for this server: too few of its active signers are listed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            The set fails a check a device would make (recovery signatures, type,
            version, keys, `requiredSignatures`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # server-tls
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/server-tls-pins:
    get:
      tags: [server-tls]
      operationId: getServerTlsPins
      summary: The demo server's own TLS pins
      description: |
        SPKI SHA-256 pins of the certificate the Config API listeners present, read
        from `certs/demo-server.pins`. These are the bootstrap pins an APK hardcodes
        to make its first Config API call. `backupPin` is `""` when only one pin exists.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Current server pins and the default HTTPS port.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerTlsPins' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/setup:
    get:
      tags: [server-tls]
      operationId: getSetup
      summary: Setup wizard — production checklist and the app's public values
      description: |
        What the dashboard's setup wizard shows. `checks` is the production checklist
        read from the environment: each item has an `id`, a `level` (`ok`, `warn`,
        `fail`), what the server runs with now (`current`, words only — never a
        secret) and, when it is not `ok`, the `.env` line(s) that fix it (`fix`). The
        server never changes its environment through this endpoint.

        The rest are the public values an app's PinVault configuration is made of:
        Config APIs (`id`, `port`, `publicPort`, `mode`, `running`), the bootstrap pins and the host
        their certificate is issued for, the config signing keys and how many a
        config carries, `RECOVERY_PUBLIC_KEYS`, the client CA's SPKI pin, the recovery
        door's port and CA pins, and the enrollment, attestation and integrity modes.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Checklist and public setup values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: integrity }
                        level: { type: string, enum: [ok, warn, fail] }
                        current: { type: string, example: "warn, no verifier" }
                        fix: { type: string, example: "INTEGRITY_VERIFICATION=enforce" }
                  configApis:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        port: { type: integer }
                        publicPort: { type: integer, description: "The port phones reach it at (SETUP_PUBLIC_PORTS); = port without a mapping." }
                        mode: { type: string, enum: [tls, mtls] }
                        running: { type: boolean }
                  bootstrapHost: { type: string }
                  publicHost: { type: string, description: "SETUP_PUBLIC_HOST, the address phones reach the server at; absent when not set." }
                  recoveryPublicPort: { type: integer, description: "The recovery door's port as phones see it (SETUP_PUBLIC_PORTS)." }
                  bootstrapPins: { type: array, items: { type: string } }
                  signingKeys: { type: array, items: { type: string } }
                  requiredSignatures: { type: integer }
                  recoveryKeys: { type: array, items: { type: string } }
                  clientCaPin: { type: string }
                  recoveryPort: { type: integer }
                  recoveryPins: { type: array, items: { type: string } }
                  enrollmentMode: { type: string, enum: [token, open] }
                  attestationMode: { type: string, enum: [off, warn, enforce] }
                  integrityMode: { type: string, enum: [off, warn, enforce] }
                  configTtlSeconds: { type: integer }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/server-tls-pins/regenerate:
    post:
      tags: [server-tls]
      operationId: regenerateServerTlsPins
      summary: Regenerate the server TLS certificate
      description: |
        Deletes `certs/demo-server.jks` + `.pins` and issues a fresh self-signed
        certificate for `localhost`. Running listeners keep the old keystore, hence
        `restartRequired: true`. Takes no request body.

        Planned, then applied, like a host certificate change: with two-person approval the approver is shown the new bootstrap pins and the certificate (`detail.certificate`), and exactly that plan is installed. Audited as `bootstrap_pins_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: New pins; restart the process to serve the new certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerTlsPinsMutation' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/server-tls-pins/rotate-to-backup:
    post:
      tags: [server-tls]
      operationId: rotateServerTlsToBackup
      summary: Switch the server TLS certificate to its stored backup key
      description: |
        Apps carry both pins of the config server's certificate as bootstrap pins.
        This reissues the certificate with the stored backup key
        (`certs/demo-server.backup.jks`) and prepares a new backup, so installed
        apps keep connecting with no update. Put the new backup pin into the next
        app release. Running listeners keep the old keystore until the process
        restarts (`restartRequired: true`).

        Planned, then applied, like a host certificate change: with two-person approval the approver is shown the new bootstrap pins and the certificate (`detail.certificate`), and exactly that plan is installed. Audited as `bootstrap_pins_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: New pins (the old backup is now the primary); restart the process to serve it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerTlsPinsMutation' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409':
          description: No stored backup key, or its pin is not among the current bootstrap pins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRotationError' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/server-tls-pins/upload:
    post:
      tags: [server-tls]
      operationId: uploadServerTlsCert
      summary: Import a server TLS keystore
      description: |
        Multipart upload of a JKS/PKCS12 keystore that replaces the server's own
        certificate. The first file part found is used, regardless of its field name.

        Planned, then applied, like a host certificate change: with two-person approval the approver is shown the new bootstrap pins and the certificate (`detail.certificate`), and exactly that plan is installed. Audited as `bootstrap_pins_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The keystore bytes (any file part is accepted).
                password:
                  type: string
                  default: changeit
                  description: Keystore password.
                format:
                  type: string
                  enum: [jks, pkcs12, p12]
                  default: jks
      responses:
        '413': { $ref: '#/components/responses/AdminBodyTooLarge' }
        '200':
          description: Imported; restart to serve the new certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerTlsPinsMutation' }
        '400':
          description: No file part, or the keystore could not be imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/server-tls-pins/fetch-from-url:
    post:
      tags: [server-tls]
      operationId: fetchServerTlsPinsFromUrl
      summary: Adopt pins from a remote TLS endpoint
      description: |
        Connects to `url`, extracts the leaf certificate's SPKI pins and stores them
        as the server's advertised pins. No keystore is created, so the listeners
        keep presenting their existing certificate — use this when TLS is terminated
        upstream (reverse proxy / load balancer) and the client must pin that
        certificate instead.

        **Where it may connect.** A TLS handshake only, to the address the name
        resolves to — resolved once, checked, and connected to as checked. Link-local and
        cloud-metadata addresses (169.254.0.0/16, fe80::/10, 100.100.100.200,
        fd00:ec2::254) are always refused; loopback and private networks (10/8,
        172.16/12, 192.168/16, 100.64/10, fc00::/7) unless
        `FETCH_ALLOW_PRIVATE_TARGETS=true`. A refused target is
        `400 {"reason":"target_not_allowed"}`.

        Planned, then applied, like a host certificate change: with two-person approval the approver is shown the new bootstrap pins and the certificate (`detail.certificate`), and exactly that plan is installed. Audited as `bootstrap_pins_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://gateway.example.com' }
      responses:
        '200':
          description: Pins fetched and stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  primaryPin: { type: string }
                  backupPin: { type: string }
                  hostname: { type: string }
                  fetched: { type: boolean, example: true }
        '400':
          description: '`url` missing/unparseable, or the connection failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # config-apis
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/config-apis:
    get:
      tags: [config-apis]
      operationId: listConfigApis
      summary: List running Config API listeners
      description: |
        Only **running** instances. Stopped ones appear in `GET /api/v1/all-configs`
        with `running: false`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Running listeners.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigApiInstance' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/start:
    post:
      tags: [config-apis]
      operationId: startConfigApi
      summary: Start (or restart) a Config API listener
      description: |
        Binds a new TLS or mTLS listener and persists it with `auto_start = 1`, so it
        comes back on the next process start. An id that is already running is
        stopped first; a port already claimed by another instance stops that
        instance.

        `mode: "mtls"` requires an existing client-cert truststore — generate or
        enroll at least one client certificate first.

        `id` must be letters, digits, `.`, `_`, `:` and `-` (at most 64), `mode`
        `tls` or `mtls`, `port` 1–65535 (`400` otherwise). Under two-person
        approval the card names the mode and, when another API holds the port,
        that the start stops it.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                id:
                  type: string
                  description: 'Defaults to `api-<epochMillis>` when omitted.'
                  example: mtls-6652
                port: { type: integer, example: 6652 }
                mode: { type: string, enum: [tls, mtls], default: tls }
      responses:
        '200':
          description: Listener started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigApiInstance' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '400':
          description: '`port` missing or out of range, `id` not an identifier, `mode` not `tls`/`mtls`, or `mode: mtls` with no truststore available.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The listener failed to bind (port in use, bad keystore, …).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/stop:
    post:
      tags: [config-apis]
      operationId: stopConfigApi
      summary: Stop a Config API listener
      description: |
        Stops the listener but keeps its row and its pin data, so it can be restarted
        later. Stopping an unknown id still returns `200`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, example: mtls-6652 }
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  stopped: { type: boolean, example: true }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '400':
          description: '`id` missing from the body.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/delete:
    post:
      tags: [config-apis]
      operationId: deleteConfigApi
      summary: Stop a Config API and delete its data
      description: |
        Stops the listener, forgets it, and deletes its rows from `pin_config`,
        `pin_hashes`, `hosts` and `pin_history` in one transaction.

        Not removed: the `config_apis` row itself, vault files, vault tokens,
        distribution history and device ACLs for that scope.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, example: mtls-6652 }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deleted: { type: boolean, example: true }
        '400':
          description: '`id` missing from the body.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{id}/vault-enabled:
    get:
      tags: [config-apis]
      operationId: getVaultEnabled
      summary: Read the vault toggle for a Config API
      description: |
        Reads `config_apis.vault_enabled`. Note the boolean is returned as a
        **string** (`"true"` / `"false"`).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: default-tls
      responses:
        '200':
          description: Current toggle state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultEnabledState' }
        '404':
          description: No `config_apis` row with this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [config-apis]
      operationId: setVaultEnabled
      summary: Toggle the vault subsystem for a Config API
      description: |
        Updates `config_apis.vault_enabled`.

        While the flag is `false`, the Config API listener answers **403** to
        every `GET /api/v1/vault/{key}` in that scope — including keys that do
        not exist, so a disabled vault does not reveal which keys it holds.
        The flag is read per request, so the change takes effect immediately;
        the routes themselves stay registered.

        Vault **administration** in that scope is deliberately unaffected
        (upload, list, policy, delete, tokens, distributions): an operator who
        flips this switch usually needs to inspect and remove a file right
        after. The flag is an operator kill switch, not an authentication
        boundary — per-file `access_policy` remains what guards content.

        Every Config API the server serves has a `config_apis` row, including
        the default one the server mounts at boot, so the switch works on all
        of them.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `vault_enabled`). Audited as `vault_enabled_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: default-tls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Toggle updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultEnabledState' }
        '400':
          description: '`enabled` missing or not a boolean.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No `config_apis` row with this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # hosts
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/hosts/generate-cert:
    post:
      tags: [hosts]
      operationId: hostsGenerateCert
      summary: Create a host with a freshly generated certificate
      description: |
        Issues a self-signed certificate for `hostname`, stores the keystore, adds a
        `hosts` row and appends a pin entry at `version: 1`, then records a
        `cert_generated` history entry.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        Registered on: **management + config-api**. On the management port the scope
        comes from `?configApiId=`; on a Config API port that parameter is ignored
        and the listener's own scope is used.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, example: api.example.com }
      responses:
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: Certificate generated and pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '400':
          description: '`hostname` missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            This scope already has a pin entry for that hostname — or, on a Config API
            listener while `PIN_CHANGE_APPROVALS>=2`, pin changes are accepted only
            through the management API (see `ApprovalViaManagementOnly`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/fetch-from-url:
    post:
      tags: [hosts]
      operationId: hostsFetchFromUrl
      summary: Add a host by pinning a live TLS endpoint
      description: |
        Connects to `url`, derives the hostname and SPKI pins from the leaf
        certificate, and adds the host at `version: 1` with **no** keystore (the
        server does not own that certificate). History event: `fetched_from_url`.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        **Where it may connect.** A TLS handshake only, to the address the name
        resolves to — resolved once, checked, and connected to as checked. Link-local and
        cloud-metadata addresses (169.254.0.0/16, fe80::/10, 100.100.100.200,
        fd00:ec2::254) are always refused; loopback and private networks (10/8,
        172.16/12, 192.168/16, 100.64/10, fc00::/7) unless
        `FETCH_ALLOW_PRIVATE_TARGETS=true`. A refused target is
        `400 {"reason":"target_not_allowed"}`.

        The host is named after the URL's host; a `hostname` field in the body is not read (and is not shown to an approver).

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://api.example.com' }
      responses:
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: Pins fetched and host added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '400':
          description: '`url` missing, or the TLS connection failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            This scope already has a pin entry for that hostname — or, on a Config API
            listener while `PIN_CHANGE_APPROVALS>=2`, pin changes are accepted only
            through the management API (see `ApprovalViaManagementOnly`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/upload-cert:
    post:
      tags: [hosts]
      operationId: hostsUploadCert
      summary: Add a host from an uploaded keystore
      description: |
        Imports a JKS/PKCS12 keystore and registers the host at `version: 1`.
        History event: `cert_uploaded`.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, hostname]
              properties:
                file: { type: string, format: binary }
                hostname: { type: string, example: api.example.com }
                password: { type: string, default: changeit }
                format: { type: string, enum: [jks, pkcs12, p12], default: jks }
      responses:
        '413': { $ref: '#/components/responses/AdminBodyTooLarge' }
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: Keystore imported and host added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '400':
          description: File or `hostname` part missing, or the import failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            This scope already has a pin entry for that hostname — or, on a Config API
            listener while `PIN_CHANGE_APPROVALS>=2`, pin changes are accepted only
            through the management API (see `ApprovalViaManagementOnly`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/cert-info:
    get:
      tags: [hosts]
      operationId: hostCertInfo
      summary: Inspect a host's certificate
      description: |
        Parses the host's keystore and returns subject/issuer/validity/SAN data plus
        the pins currently stored for it in this scope.

        Keystores are physical files shared across scopes, so if the host is not
        registered in the requested scope the lookup falls back to any scope
        (`getAnyByHostname`).

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '200':
          description: Certificate details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertInfoResponse' }
        '400':
          description: The host has no keystore (e.g. it was added via fetch-from-url).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No `hosts` row for this hostname in any scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/regenerate-cert:
    post:
      tags: [hosts]
      operationId: hostRegenerateCert
      summary: Rotate a host's certificate
      description: |
        Issues a new certificate for the host and bumps the pin version **in every
        Config API scope that hosts it** (`listConfigApisFor`) — otherwise devices on
        an un-updated scope would hit a pin mismatch. A running mock server for this
        host is restarted on the same port with the new keystore.

        `version` in the response is the new version in the *requested* scope.
        History event per scope: `cert_regenerated`.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: New certificate and pins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '404':
          description: The host is not registered in the requested scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/rotate-to-backup:
    post:
      tags: [hosts]
      operationId: hostRotateToBackup
      summary: Switch a host's certificate to its stored backup key
      description: |
        A certificate the server generates comes with a backup key: its pin is
        published next to the primary, and the key itself is kept in
        `certs/<id>.backup.jks`. This reissues the certificate with that key and
        prepares a new backup. Devices already hold the backup pin, so they keep
        connecting with no app update and no config refresh. The new pins —
        the old backup (now serving) and the new backup — are published in every
        Config API scope that pins the host; the old primary drops out.

        History event per scope: `cert_rotated_to_backup`. A running mock server
        for this host is restarted with the new keystore.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: The certificate now serves the former backup key; new pins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '404':
          description: The host is not registered in the requested scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            No stored backup key (the certificate was uploaded or fetched, or
            generated before backup keys were kept), the backup pin is no longer
            in the host's pin list, or approvals are on and this is not the
            management API (that last refusal carries no `reason`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRotationError' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/upload-cert:
    post:
      tags: [hosts]
      operationId: hostUploadCert
      summary: Replace an existing host's certificate
      description: |
        Like `regenerate-cert`, but the certificate comes from an uploaded keystore.
        Bumps the pin version in every scope hosting this hostname and restarts a
        running mock server. History event per scope: `cert_uploaded`.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password: { type: string, default: changeit }
                format: { type: string, enum: [jks, pkcs12, p12], default: jks }
      responses:
        '413': { $ref: '#/components/responses/AdminBodyTooLarge' }
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: Keystore imported, pins bumped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '400':
          description: File part missing, or the import failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The host is not registered in the requested scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/fetch-cert-url:
    post:
      tags: [hosts]
      operationId: hostFetchCertUrl
      summary: Re-pin an existing host from a live endpoint
      description: |
        Re-reads the certificate at `url` and bumps the pins in every scope hosting
        this hostname. No keystore is written — only `cert_valid_until` and the pins
        change. History event per scope: `cert_fetched`.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        **Where it may connect.** A TLS handshake only, to the address the name
        resolves to — resolved once, checked, and connected to as checked. Link-local and
        cloud-metadata addresses (169.254.0.0/16, fe80::/10, 100.100.100.200,
        fd00:ec2::254) are always refused; loopback and private networks (10/8,
        172.16/12, 192.168/16, 100.64/10, fc00::/7) unless
        `FETCH_ALLOW_PRIVATE_TARGETS=true`. A refused target is
        `400 {"reason":"target_not_allowed"}`.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://api.example.com' }
      responses:
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: Pins refreshed from the live certificate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '400':
          description: '`url` missing, or the TLS connection failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The host is not registered in the requested scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/toggle-mtls:
    post:
      tags: [hosts]
      operationId: hostToggleMtls
      summary: Mark a host as requiring mTLS
      description: |
        Flips `HostPin.mtls`, which tells the library that this host needs a client
        certificate. History event: `mtls_enabled` / `mtls_disabled`.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mtls: { type: boolean, default: false }
      responses:
        '200':
          description: Flag updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: { type: string }
                  mtls: { type: boolean }
        '404':
          description: No pin entry for this hostname in the scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/upload-client-cert:
    post:
      tags: [hosts]
      operationId: hostUploadClientCert
      summary: Upload a host-specific client certificate (P12)
      description: |
        Stores a P12 that devices will present when connecting to this host. The
        upload is validated by loading it as PKCS12 with `password`; the CN and SPKI
        fingerprint are extracted for display.

        Side effects on the pin entry: `mtls` is forced to `true` and
        `clientCertVersion` is incremented, which is what triggers
        `syncHostClientCerts()` on the device. History event: `client_cert_uploaded`.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: PKCS12 bundle. }
                password: { type: string, default: changeit }
      responses:
        '413': { $ref: '#/components/responses/AdminBodyTooLarge' }
        '200':
          description: Stored, version bumped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: { type: string }
                  clientCertVersion: { type: integer }
                  commonName: { type: string }
                  fingerprint: { type: string }
        '400':
          description: File part missing, the bytes are not a valid P12, or the P12 does not hold exactly one private key (the one entry that is shown, recorded and stored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The host is not registered in the requested scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The host-client-cert store is not wired on this listener.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '409': { $ref: '#/components/responses/ApprovalViaManagementOnly' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/client-cert/download:
    get:
      tags: [hosts]
      operationId: hostClientCertDownload
      summary: Download a host-specific client certificate (admin)
      description: |
        Returns the stored P12 bytes. **This path is not in the public allowlist**, so
        it needs `X-API-Key` — devices use
        `GET /api/v1/client-certs/{hostname}/download` instead, which is public but
        only answers on mTLS listeners.

        Hands out a private key: audited as `private_key_downloaded` (who, which host) and pushed to the webhook.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '200':
          description: The P12 bundle.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: No client certificate stored for this host in this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The host-client-cert store is not wired on this listener.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/client-cert/info:
    get:
      tags: [hosts]
      operationId: hostClientCertInfo
      summary: Metadata for a host-specific client certificate
      description: |
        Version, CN, fingerprint and creation time — without the P12 bytes.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '200':
          description: Certificate metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostClientCertRecord' }
        '404':
          description: No client certificate stored for this host in this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The host-client-cert store is not wired on this listener.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/start-mock:
    post:
      tags: [hosts]
      operationId: hostStartMock
      summary: Start a mock TLS/mTLS server for a host
      description: |
        Boots a throwaway HTTPS listener using the host's keystore so the demo app has
        something to connect to. With `mtls: true` the client-cert truststore is
        attached, which requires at least one client certificate to exist.

        The port is persisted on the `hosts` row and the mock is auto-started on the
        next process start.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                port: { type: integer, default: 8443 }
                mtls: { type: boolean, default: false }
      responses:
        '200':
          description: Mock server started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockServerResponse' }
        '400':
          description: The host has no keystore, or mTLS was requested with no truststore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The host is not registered in the requested scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The mock server failed to start (port in use, bad keystore, …).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/stop-mock:
    post:
      tags: [hosts]
      operationId: hostStopMock
      summary: Stop a host's mock servers
      description: |
        Stops both the TLS and mTLS mock listeners for this host and clears the
        persisted port. Takes no request body; an unknown host still returns `200`.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '200':
          description: 'Stopped (`port: null`, `running: false`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockServerResponse' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/status:
    get:
      tags: [hosts]
      operationId: hostStatus
      summary: Keystore and mock-server status for a host
      description: |
        Never `404`: the dashboard calls this for every pinned host, including ones
        that have no `hosts` row (URL-fetched or hand-entered pins), so unknown hosts
        get a minimal response with null fields. Falls back to any scope's record when
        the requested scope has none.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '200':
          description: Host status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostStatusResponse' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/test-connection:
    post:
      tags: [hosts]
      operationId: hostTestConnection
      summary: Probe this host's local mock server
      description: |
        Issues `GET https://localhost:<mockPort>/health` with a trust-all client and
        no hostname verification — it measures reachability, **not** pin correctness.
        Use `ping-remote` for a pin comparison.

        Always answers `200`; failures are reported in the body as
        `{"success": false, "error": "…"}`. Takes no request body.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
      responses:
        '200':
          description: Probe result (success or failure, both `200`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestConnectionResult' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/hosts/{hostname}/ping-remote:
    get:
      tags: [hosts]
      operationId: hostPingRemote
      summary: Reachability + pin match against a real host
      description: |
        Shells out to `nc -z -w 2` for TCP reachability, then `openssl s_client` for
        the handshake, computes the leaf's SPKI pin and compares it with the pins
        stored for this host in this scope.

        Without `?port=` it tries, in order: the host's running mock port, then
        `443, 9443, 8443, 9444, 8444`. Failure is reported in the body with `200`,
        not an error status.

        Only a host pinned in the scope (also as `host:port`) or registered is
        probed (`404` otherwise), only on those ports, its mock ports and the ports
        of its `host:port` pin entries (another `?port=` is `400`). The name is
        resolved once through the egress filter (`FETCH_ALLOW_PRIVATE_TARGETS`;
        link-local and metadata addresses never) and `nc`/`openssl` get the
        checked address. A GET that opens connections: it needs `X-PinVault-Admin`
        or `X-API-Key`, and `Sec-Fetch-Site: cross-site|same-site` is refused (`403`).

        `{hostname}` is passed to subprocess argv, so it must match
        `^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$` — anything else is rejected with `400`
        before a process is spawned.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
        - $ref: '#/components/parameters/ConfigApiIdQuery'
        - name: port
          in: query
          required: false
          description: Try this port first instead of the built-in candidate list.
          schema: { type: integer }
      responses:
        '200':
          description: Probe result — reachable (with pin comparison) or not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PingRemoteResult' }
        '400':
          description: The hostname segment is not a plain hostname / IPv4 literal, the port is not one of the host's, or the address is not allowed (`target not allowed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PingRemoteResult' }
        '404':
          description: The host is neither pinned in the scope nor registered.
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403':
          description: >
            `admin_header_required` (neither `X-PinVault-Admin` nor `X-API-Key`),
            `cross_site_request`, or an invalid key (see InvalidApiKey).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/hosts/{hostname}/clients:
    get:
      tags: [hosts, connection-history]
      operationId: hostClients
      summary: Devices that have reported connecting to this host
      description: |
        Rows from `client_devices`, keyed by hostname. The `deviceId` here is derived
        from the reported manufacturer/model (`"<manufacturer>_<model>"`, lowercased,
        spaces → `_`) — it is **not** the `X-Device-Id` the ACL uses. For ACL work use
        `GET /api/v1/client-devices`.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
      responses:
        '200':
          description: Devices seen on this host.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClientDevice' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/management/hosts/{configApiId}/generate-cert:
    post:
      tags: [hosts]
      operationId: managementGenerateHostCert
      summary: Create a host with a generated certificate (scope in the path)
      description: |
        Same behaviour as `POST /api/v1/hosts/generate-cert`, but the scope is a path
        segment instead of the `?configApiId=` query parameter. Used by the dashboard
        when operating on a Config API other than the one it is bound to.

        **Planned, then applied.** The change is worked out in full first — the pins
        (SPKI hashes), the certificate's subject and validity, the Config APIs whose
        published pins change. With two-person approval that plan is made when the change
        is **requested**, shown to the approver (`detail.certificate`, `detail.scopes`)
        and stored; the approval installs **exactly** that plan: nothing is fetched or
        generated a second time. A request whose pins changed in its scope since it was
        made is `stale`.

        **Live check.** With `PIN_LIVE_CHECK` the new pins are checked against the
        certificate the host serves now, as on a pin update: `warn` flags
        (`X-PinVault-Live-Check: warn`), `enforce` answers `422` unless
        `liveCheckOverride=<reason>` is in the query (audited). A certificate that this
        request itself installs is not served yet, so under `enforce` generating,
        uploading or rotating one needs the override.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, example: api.example.com }
      responses:
        '422': { $ref: '#/components/responses/LiveCheckRejected' }
        '200':
          description: Certificate generated and pinned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostActionResponse' }
        '400':
          description: '`hostname` missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This scope already has a pin entry for that hostname.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # enrollment + client-certs
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/enrollment-mode:
    get:
      tags: [enrollment]
      operationId: getEnrollmentMode
      summary: Which enrollment mode the server runs in
      description: |
        Read by the client before enrolling. `mode` mirrors the `ENROLLMENT_MODE`
        env var (default `token`); `tokenRequired` is `false` only when
        `ENROLLMENT_MODE=open`. `openApplications` is `true` while devices may
        apply without a code and wait for approval (`/api/v1/enrollment-open`).

        Public — devices need it before they have any credential.

        Registered on: **management** only. A device pointed at a Config API port will
        get a `404` here.
      security: []
      x-registered-on: management
      responses:
        '200':
          description: Current enrollment mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [token, open] }
                  tokenRequired: { type: boolean }
                  openApplications: { type: boolean }

  /api/v1/enrollment-tokens/generate:
    post:
      tags: [enrollment]
      operationId: generateEnrollmentToken
      summary: Mint a single-use enrollment token
      description: |
        256 bits from a CSPRNG, URL-safe Base64. **The plaintext is returned here and
        nowhere else** — only its SHA-256 is stored, plus an 8-character display
        prefix. TTL comes from `ENROLLMENT_TOKEN_TTL_SECONDS` (default 24 h).

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): answers `202` with
        `runAfterApproval: true`. The answer carries a secret that is shown once, so the
        approval does not run the request: once it is approved, the requester sends the
        **same request again** (same body and query) and it runs once, the answer going to
        them alone. Nothing of it is stored with the change request.

        The token is audited as `enrollment_token_created` (never the token itself) and answered with `Cache-Control: no-store`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: >
                    Defaults to `device-<epochMillis>` when absent or unparseable. Letters,
                    digits, `.`, `_`, `:` and `-` only, at most 64 — it becomes the
                    certificate's CN and is shown in the dashboard.
                    The server's own names (`client-ca`, `server-ca`, `server`,
                    `backup`, any case) are refused (`400 reserved_client_id`).
                deviceUid:
                  type: string
                  description: >
                    Optional: the device (ANDROID_ID) the token is for. An
                    enrollment with it must name this device id (`403
                    device_uid_mismatch` otherwise, token not spent), and the
                    identity's device id counts as proven (see SECURE_OPERATIONS
                    "Proven device ids").
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The token plaintext — store it now, it cannot be re-read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: Plaintext, shown once. }
                  clientId: { type: string }
        '400':
          description: '`invalid_client_id` — characters outside `[A-Za-z0-9._:-]`, or longer than 64.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-tokens:
    get:
      tags: [enrollment]
      operationId: listEnrollmentTokens
      summary: List enrollment tokens (masked)
      description: |
        `token` carries a **masked prefix** (`AbC12dEf…`), not a usable credential,
        and `masked` is always `true`. Rows created before migration V8 have no
        prefix and show `sha256:<first 8 hex of the hash>…`; those tokens were
        invalidated by that migration.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrollmentToken' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-policies:
    get:
      tags: [enrollment]
      operationId: listEnrollmentPolicies
      summary: List enrollment policies (codes many devices share)
      description: |
        Newest first, with how many devices each one has taken (`usedCount`:
        issued plus approved but not yet picked up) and how many wait for
        approval. The code itself is never listed — only its first group.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Policies, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrollmentPolicy' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    post:
      tags: [enrollment]
      operationId: createEnrollmentPolicy
      summary: Create an enrollment policy and its code
      description: |
        One code that up to `maxDevices` devices enroll with for `validDays`
        days, each through `POST /api/v1/client-certs/enroll` with the code as
        `token`. Every device gets its own client id `<name>-<6 chars>` and a
        certificate over its own key (CSR enrollment only). With
        `requireApproval` a device waits (`202`) until an administrator
        approves it under `/api/v1/enrollment-requests`.

        The code — 25 characters of Crockford base32 in five groups, 125 bits —
        is in this answer and nowhere else (`Cache-Control: no-store`); only its
        SHA-256 is stored. Case, dashes and spaces do not matter when a device
        sends it, and `O`/`I`/`L` read as `0`/`1`. Audited as
        `enrollment_policy_created`.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): answers `202` with
        `runAfterApproval: true`. The answer carries a secret that is shown once, so the
        approval does not run the request: once it is approved, the requester sends the
        **same request again** (same body and query) and it runs once, the answer going to
        them alone. Nothing of it is stored with the change request.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, maxDevices, validDays]
              properties:
                name:
                  type: string
                  description: Prefix of the client ids; letters, digits, `.`, `_`, `:` and `-`, at most 40.
                  example: field-tablets
                maxDevices: { type: integer, minimum: 1, maximum: 10000 }
                validDays: { type: integer, minimum: 1, maximum: 365 }
                requireApproval:
                  type: boolean
                  default: true
                  description: Each device waits for an administrator. On unless set to `false`.
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The policy and its code — store or hand out the code now, it cannot be re-read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedEnrollmentPolicy' }
        '400':
          description: '`invalid_body`, `invalid_name`, `invalid_max_devices` or `invalid_valid_days`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-policies/{id}/stop:
    post:
      tags: [enrollment]
      operationId: stopEnrollmentPolicy
      summary: Stop an enrollment code
      description: |
        No device can start an enrollment with the code any more (it is answered
        like a used token, `401`), and requests still waiting are rejected.
        Devices approved before still pick their certificates up. Audited as
        `enrollment_policy_stopped`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The stopped policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentPolicy' }
        '404':
          description: '`policy_not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`policy_stopped` — already stopped.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-open:
    get:
      tags: [enrollment]
      operationId: getOpenApplications
      summary: Applications without a code — the switch and its limits
      description: |
        While `enabled`, a device that enrolls with only its `deviceId` (no
        token, no code) gets `202` and waits for an administrator under
        `/api/v1/enrollment-requests`, marked `openApplication`. Off by default.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: The switch and the limits the server runs with.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenApplicationsStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [enrollment]
      operationId: setOpenApplications
      summary: Turn applications without a code on or off
      description: |
        On: every device that reaches a Config API listener may ask to enroll
        without a code; none gets a certificate without an approval. It takes
        precedence over `ENROLLMENT_MODE=open`. Off: such devices get
        `403 Token required`, and the requests already waiting can still be
        approved or rejected. The first time it is turned on, a policy named
        `device` is created to collect the requests (client ids
        `device-<6 chars>`). Audited as `enrollment_open_changed`.

        Bounds: `OPEN_ENROLLMENT_RATE_LIMIT` new applications per source
        address per 10 minutes (default 20, `0` = none), at most
        `OPEN_ENROLLMENT_MAX_PENDING` waiting (default 50), and every waiting
        request lapses after `ENROLLMENT_REQUEST_TTL_HOURS` (default 24).

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `enrollment_open`). Turning it **off** without waiting: `DELETE /api/v1/enrollment-open`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The switch after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenApplicationsStatus' }
        '400':
          description: '`invalid_body` or `invalid_enabled`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

    delete:
      tags: [enrollment]
      operationId: closeOpenApplications
      summary: Turn applications without a code off, at once
      description: |
        The same as `PUT` with `{"enabled": false}`, but never held for
        approval: closing a door is an emergency action, like stopping a code or
        revoking a device. Devices already waiting can still be decided. Audited
        as `enrollment_open_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: 'The switch after the change (`enabled` is `false`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenApplicationsStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-requests:
    get:
      tags: [enrollment]
      operationId: listEnrollmentRequests
      summary: Devices that asked to enroll, with a code or without one
      description: |
        Newest first (at most 200). A `pending` request waits for an
        administrator, an `approved` one for its device to pick the certificate
        up; a `pending` one older than `ENROLLMENT_REQUEST_TTL_HOURS` (24) is
        marked `expired` (decided by `timeout`) and its device told `410`.
        `verificationCode` matches the code the device shows. `heldBy` names
        another active identity already enrolled from the same `deviceUid` (a
        reinstall, or someone claiming the device): such a request can be
        approved only after that identity is revoked. `sameDevicePending`
        counts the other requests waiting from the same `deviceUid`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected, issued, expired] }
      responses:
        '200':
          description: Requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnrollmentRequest' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-requests/{id}/approve:
    post:
      tags: [enrollment]
      operationId: approveEnrollmentRequest
      summary: Let a waiting device in
      description: |
        The request becomes `approved` and takes one of the policy's device
        slots, both or neither. The device gets its certificate the next time it
        asks (`POST /api/v1/client-certs/enroll` with its `requestId` and a CSR
        from the same key). Audited as `enrollment_request_approved`.

        With `PIN_CHANGE_APPROVALS` 2 or more this is the second person's act:
        it needs a personal key (`409 named_admin_required` for the shared
        `API_KEY`) that is not the key of the code's creator (`409
        own_enrollment_code`); code-less applications take any personal key.
        The approver is recorded (`approvedBy`).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentDecision' }
        '404':
          description: '`request_not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            `device_already_enrolled` (with `heldBy`: revoke that identity first),
            `not_pending` (already decided), `policy_stopped`, or
            `enrollment_limit_reached` (no device slot left), and with approvals
            on `named_admin_required` or `own_enrollment_code`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/enrollment-requests/{id}/reject:
    post:
      tags: [enrollment]
      operationId: rejectEnrollmentRequest
      summary: Turn a device away
      description: |
        A waiting request — or an approved one not picked up yet, which gives
        its slot back — becomes `rejected`; the device is told
        `403 enrollment_rejected` and forgets the request and its key. Audited
        as `enrollment_request_rejected`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentDecision' }
        '404':
          description: '`request_not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`not_pending` — issued or rejected already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/enroll:
    post:
      tags: [enrollment, client-certs]
      operationId: enrollClientCert
      summary: Enroll a device and download its client certificate
      description: |
        Returns a freshly issued PKCS12 as raw bytes, carrying the integrity header
        **`X-P12-SHA256`** (Base64 SHA-256 of the body). The PinVault library refuses
        to install a P12 that arrives without this header.

        A caller that sends `X-PinVault-Features: p12password` gets the bundle wrapped
        with a random password used once, returned in **`X-P12-Password`**; anyone else
        gets `CLIENT_P12_PASSWORD` (default `changeit`). It is never `KEYSTORE_PASSWORD`,
        which protects the server's own keystores.

        Public in the allowlist (devices have no admin key).

        **Two implementations with different request contracts:**

        *Config API ports* (`CertificateConfigRoute.kt`) accept
        `{token?, deviceId?, deviceAlias?, deviceUid?}`:
        * `token` present → validated and marked used; the certificate CN is
          `PinVault Client: <clientId>` for the token's client id.
        * `deviceId` present while applications without a code are on
          (`/api/v1/enrollment-open`, 2.1) → `202`: the device waits for an
          administrator like a device with a code. This comes before open mode.
        * `deviceId` present and `ENROLLMENT_MODE=open` → the device id becomes the
          client id and the `deviceUid` (any `deviceUid` in the body is ignored), demo/test
          only — no authentication. Open mode issues only over a CSR (`403 csr_required`
          otherwise) and never replaces an enrolled identity: a client id with an active
          certificate or identity over another key gets `409 identity_already_enrolled`
          (the same key asking again is served). The way back for a device that lost its
          key is an administrator revoking and forgetting the old identity.
        * `deviceId` present in `token` mode → `403` with guidance.
        * neither → `400`.
        `deviceUid` is stored on the `client_certs` row and is what binds a
        token-enrolled certificate to a device for the `token_mtls` vault policy.

        **Server-made keys (P12).** A P12 certificate is issued by the client CA
        (CA:false, client authentication only, one year) and the bundle carries the
        leaf and the CA; nothing is added to the truststore and no listener restarts.
        (Until 2.2.0 P12s were self-signed leaves, each its own trust anchor: those
        keep working until they expire or the id enrolls again, which removes the
        anchor and retires its key — the only case that restarts the mTLS listeners.)
        With `ENROLLMENT_P12=off`, or `ENROLLMENT_ATTESTATION=enforce`, an enrollment
        without a CSR gets **`403 csr_required`** before anything is spent (the token
        stays good); the library reports `CSR_REQUIRED`.

        **Key attestation (`ENROLLMENT_ATTESTATION=off|warn|enforce`, default warn).**
        Every CSR enrollment (token, enrollment code — submit and pickup —, code-less
        application, open mode) may carry `attestationChain`: the Android Key
        Attestation chain of the CSR's key, Base64 DER, leaf first. It is checked
        after the cheap refusals and before a token or a policy slot is spent: the
        leaf's key is the CSR's key, the challenge is SHA-256 of
        `pinvault-identity-key:v1:<deviceUid>` (UTF-8; the body's `deviceUid`, or its
        `deviceId` when it sends none), a SIGN key generated in TEE or StrongBox on a
        locked, verified device by the app (`ATTESTATION_PACKAGE_NAMES` +
        `ATTESTATION_SIGNER_SHA256`). `warn` enrolls either way and stores the
        verdict (`attestation` on the identity, the waiting request and the client
        certificate list); `enforce` answers `403 attestation_required` without a
        chain and `403 attestation_invalid` with a `reason` for one that fails, and
        does not start without the app binding.

        **CSR enrollment (library 2.1+, the default):** with
        `X-PinVault-Features: csr` and a `csr` field (Base64 DER PKCS#10 over the
        device's own key), the server verifies the request's self-signature,
        ignores its subject, and issues `CN=PinVault Client: <clientId>` signed by
        the client CA (`CLIENT_CERT_TTL_DAYS`, `notBefore` an hour back). The
        answer is JSON with header **`X-PinVault-Cert-Format: pem-chain`** — see
        the `200` variant below. The identity (key hash, serial, expiry) is
        recorded in `client_identities`; no truststore change, no listener restart.
        A revoked client id is refused with `403 revoked` before the token is spent,
        and so is a malformed CSR (`400`), so the device can retry with the same token.
        Re-enrolling an active client id with a new token over another key replaces the
        identity's key: the replaced key is retired (`client_keys`), so certificates over
        it are refused on every mTLS request; a P12 re-enrollment of a CSR identity
        retires its key the same way (audited as `client_cert_key_replaced`).

        **A token yields one certificate.** It is spent in a single conditional
        update right before anything is issued; of several requests racing with the
        same token, one succeeds and the others get `401`.

        **Enrollment codes (policies, 2.1):** when `token` is not a one-time token
        but the code of an enrollment policy (`/api/v1/enrollment-policies`), the
        device gets its own client id `<policy name>-<6 chars>`. A code needs CSR
        enrollment (`400 csr_required` otherwise). Without approval the certificate
        is issued at once, while the policy has a device slot left (`403
        enrollment_limit_reached`). With approval the answer is `202` with a
        `requestId` and `Retry-After`; the device asks again with `{requestId, csr}`
        — the CSR signed by the key it asked with — and gets `202` while it waits,
        the chain once approved, `403 enrollment_rejected`, or `410
        enrollment_request_expired` when nobody decided within
        `ENROLLMENT_REQUEST_TTL_HOURS`. The `202` carries a `verificationCode`
        made from the CSR's key (first 80 bits — 10 bytes — of the SHA-256 of its
        SubjectPublicKeyInfo, Crockford base32, `XXXX-XXXX-XXXX-XXXX`; it was 40
        bits until 2.2.0); the device shows the same code and the administrator
        compares the two. The same key
        sending the code again gets its request's answer, never a second slot.
        A stopped or expired code is answered like a used token (`401`).

        *Management port* (`Main.kt`) is token-only and issues P12s (`403
        csr_required` with `ENROLLMENT_P12=off` or `ENROLLMENT_ATTESTATION=enforce`): `{token}` is
        required, `deviceId` and `csr` are ignored, and the response adds a
        `Content-Disposition` attachment header. It records `deviceAlias` /
        `deviceUid` and applies the same rules before spending the token (`400
        invalid_device_uid`, `403 revoked`, `409 device_already_enrolled`):
        without the recorded `deviceUid` an mTLS listener would refuse the device's
        own `X-Device-Id`.

        Registered on: **management + config-api** (two separate handlers, as above).
      security: []
      x-registered-on: management+config-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Single-use enrollment token plaintext. Required on the management port.
                deviceId:
                  type: string
                  description: >
                    Config API ports only: an application without a code while those are
                    on, otherwise only with `ENROLLMENT_MODE=open`.
                deviceAlias:
                  type: string
                  description: 'Config API ports only. Human-readable label stored with the certificate.'
                deviceUid:
                  type: string
                  description: >
                    Config API ports only. The device's stable id (ANDROID_ID). Stored as
                    `client_certs.device_uid` and used by the `token_mtls` vault policy to
                    match a certificate to an `X-Device-Id`.
                csr:
                  type: string
                  description: >
                    Config API ports only, with `X-PinVault-Features: csr`. Base64 DER PKCS#10
                    request over the device's Keystore key. Its subject is ignored.
                requestId:
                  type: string
                  description: >
                    Config API ports only. A device that was told to wait (`202`) asks again
                    by this id, with a `csr` signed by the same key; no `token` is needed.
                attestationChain:
                  type: array
                  items: { type: string }
                  description: >
                    Config API ports only, with a `csr`. The Android Key Attestation chain of the
                    CSR's key, Base64 DER, leaf first; the key made with the challenge
                    SHA-256(UTF-8 `pinvault-identity-key:v1:` + `deviceUid`, or `deviceId` when no
                    `deviceUid` is sent). Checked per `ENROLLMENT_ATTESTATION`.
                integrityToken:
                  type: string
                  description: >
                    Config API ports only, with a `csr`. An integrity token (Google Play
                    Integrity, or a RASP product's attestation) requested with the request hash
                    base64url(SHA-256(UTF-8 `pinvault-integrity:v1:` + `deviceUid` (else
                    `deviceId`, else empty) + `:` + base64url(SHA-256(csr DER)))), unpadded.
                    Checked per `INTEGRITY_VERIFICATION` by `INTEGRITY_VERIFIER_COMMAND`.
      responses:
        '200':
          description: >
            The PKCS12 bundle — or, for a CSR enrollment, the issued certificate chain
            as JSON (`X-PinVault-Cert-Format: pem-chain`).
          headers:
            X-PinVault-Cert-Format:
              description: '`pem-chain` when the body is the JSON chain of a CSR enrollment.'
              schema: { type: string }
            X-P12-SHA256:
              description: Base64 SHA-256 of the response body. Clients reject the P12 if absent.
              schema: { type: string }
            X-P12-Password:
              description: The one-off password the bundle is wrapped with; only when the request announced `p12password`.
              schema: { type: string }
            Cache-Control:
              description: '`no-store`: the response carries a private key.'
              schema: { type: string }
            Content-Disposition:
              description: 'Sent by the management-port handler only: `attachment; filename="<clientId>.p12"`.'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/IssuedClientCert' }
        '202':
          description: >
            An enrollment code whose policy asks for approval, or an application without
            a code: the device waits. No certificate yet; ask again with the `requestId`
            (and a CSR from the same key) after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait before asking again (15).
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentPending' }
        '400':
          description: >
            No `token` (management port), neither `token` nor `deviceId` (Config API ports),
            an unparseable / unverifiable `csr` (`invalid_csr`), or a client id / `deviceUid`
            outside `[A-Za-z0-9._:-]{1,64}` (`invalid_client_id`, `invalid_device_uid`), or an
            enrollment code / `requestId` without a CSR (`csr_required`), a reserved client id
            (`reserved_client_id`), or in open mode a `deviceUid` other than the `deviceId`
            (`device_uid_mismatch`). The token is not spent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: The token is invalid, expired or already used — including by a request that raced this one with the same token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >
            `deviceId`-only enrollment attempted while `ENROLLMENT_MODE=token` and
            applications without a code are off (Config API ports), the client id was
            revoked or the CSR's key retired with a forgotten identity (`revoked`), an enrollment code has no device
            slot left (`enrollment_limit_reached`), an administrator turned the device away
            (`enrollment_rejected`), or a `requestId` was sent with a CSR over another key
            (`enrollment_request_mismatch`). In `ENROLLMENT_MODE=open`, a request without
            a CSR (`csr_required`): open mode issues no P12 — and on every path with
            `ENROLLMENT_P12=off` or `ENROLLMENT_ATTESTATION=enforce`. `device_uid_mismatch` —
            the token was bound to another device (`deviceUid` at minting). Under
            `ENROLLMENT_ATTESTATION=enforce`: no `attestationChain` (`attestation_required`),
            or one that fails (`attestation_invalid`, with `reason`: `challenge_mismatch`,
            `key_mismatch`, `purpose_not_sign`, `software_attestation`, `device_unlocked`,
            `boot_not_verified`, `package_not_allowed`, `signer_not_allowed`,
            `certificate_revoked`, `revocation_list_stale`, `patch_level_too_old`, …). Under
            `INTEGRITY_VERIFICATION=enforce`: no `integrityToken` (`integrity_required`), or a
            verdict that fails (`integrity_invalid`, with `reason`: `request_hash_mismatch`,
            `device_integrity`, `app_not_recognized`, `verifier_error`, …), and no server-made
            key (`csr_required`). Nothing is spent by any of these.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            `device_already_enrolled` — another active client id was enrolled from this
            `deviceUid`. One active identity per device; revoke the other id (or re-enroll
            under it) and retry: the token is not spent. `identity_already_enrolled` —
            open mode, or an approved enrollment-code request picked up: the client id is
            already enrolled over another key; an administrator revokes (and forgets) it first.
            The same key asking again for the identity it has gets the certificate it was
            given (same serial) while half its lifetime is left.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`enrollment_request_not_found` — no such `requestId`; enroll again with the code, or apply again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: >
            `enrollment_request_expired` — nobody decided on the request within
            `ENROLLMENT_REQUEST_TTL_HOURS`. The device forgets it and its key; asking
            again is a new request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >
            `too_many_pending_requests` — as many devices wait for approval with this code
            as it has slots (applications without a code: `OPEN_ENROLLMENT_MAX_PENDING`), or
            `too_many_applications` — this source address made `OPEN_ENROLLMENT_RATE_LIMIT`
            applications without a code in the last 10 minutes.
            `rate_limited` — `ISSUANCE_RATE_LIMIT` certificates for this client id, or
            `PICKUP_RATE_LIMIT` asks for this `requestId` (with `Retry-After`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '411':
          description: '`length_required` — device endpoints need a declared Content-Length.'
        '413':
          description: '`body_too_large` — device endpoints accept at most 64 KB.'

  /api/v1/client-certs/renew:
    post:
      tags: [enrollment, client-certs]
      operationId: renewClientCert
      summary: Renew a CSR-enrolled device certificate
      description: |
        The device sends a fresh PKCS#10 request over the **same** Keystore key it
        enrolled with. Two doors, one check:

        * **mTLS listener** — the presented client certificate must be valid (an
          expired one never gets this far: the handshake refuses it) and must carry
          the CSR's key; the client id comes from its CN.
        * **TLS listener** (recovery, no client certificate) — `clientId` in the body
          names the identity; the CSR's self-signature must verify and its key must
          equal the key registered at enrollment.

        Either way the identity must exist and not be revoked. Every refusal is the
        same `403 reenroll_required`, so the endpoint cannot be used to probe which
        client ids exist (a malformed CSR is `400` for any client id). Refusals are
        counted per source address — not per client id, which the caller picks —
        and an address with 10 of them in 10 minutes gets `429` before the body is
        read; a renewal that authenticated is counted per identity (10 per 10
        minutes). The identity is looked up, and the CSR's size and key type
        checked, before any signature is verified: only the registered key of an
        identity that may renew costs a verification. Refusals are audited as
        `client_cert_auth_failed`, issuances as `client_cert_renewed`
        (`via: mtls | recovery`).

        Registered on: **config-api** (every Config API listener) and the **recovery door** (`RECOVERY_PORT`, TLS without client auth, nothing else served there).
      security: []
      x-registered-on: config-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr:
                  type: string
                  description: Base64 DER PKCS#10 request over the enrolled key.
                clientId:
                  type: string
                  description: Required when no client certificate is presented (recovery).
      responses:
        '200':
          description: The new certificate chain.
          headers:
            X-PinVault-Cert-Format:
              schema: { type: string, example: pem-chain }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/IssuedClientCert'
                  - type: object
                    properties:
                      renewCount: { type: integer, example: 3 }
                      via: { type: string, enum: [mtls, recovery] }
        '400':
          description: '`invalid_csr`, or `clientId` missing on the recovery path.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`reenroll_required` — revoked, unknown, or the key does not match. The device must enroll again. Also the same CSR as the last accepted renewal (a replay).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: '`body_too_large` — more than 64 KB, declared or not.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`rate_limited` — too many refused renewals from this address, or this identity renewed too often.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/test-hooks/client-cert-ttl:
    post:
      tags: [client-certs]
      operationId: armTestClientCertTtl
      summary: Test hook — short lifetime for a client id's next certificate
      description: |
        Only when the server runs with `ALLOW_TEST_HOOKS=true` (the Espresso suite);
        absent otherwise. The next certificate issued or renewed for `clientId` lives
        `ttlSeconds` (30..86400) instead of `CLIENT_CERT_TTL_DAYS`. One-shot.
        Audited as `test_hook_used`. Never enable in production.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, ttlSeconds]
              properties:
                clientId: { type: string }
                ttlSeconds: { type: integer, minimum: 30, maximum: 86400 }
      responses:
        '200':
          description: Armed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  ttlSeconds: { type: integer }
                  armed: { type: boolean, example: true }
        '400':
          description: Missing or out-of-range fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/{hostname}/download:
    get:
      tags: [client-certs]
      operationId: downloadHostClientCert
      summary: Download a host-specific client certificate (device endpoint)
      description: |
        Called by `PinVault.syncHostClientCerts()`. Returns the P12 stored for this
        host in the listener's scope.

        **Only answers on an mTLS Config API listener.** Any listener running in
        `tls` mode — which includes the management server, whose
        `certificateConfigRoutes` mount defaults to `configApiMode = "tls"` —
        returns `403`. Enroll first to obtain a default client certificate, then
        fetch host-specific certificates over the mTLS port.

        Public in the allowlist; the mTLS handshake is the access control — and,
        where the Config API has a device host ACL (a default entry or any
        per-device grant), the host must be allowed for the certificate's device
        (its client id, or the `deviceUid` it enrolled with; `X-Device-Id` is not
        consulted): `403 host_not_allowed` otherwise, for hosts with and without a
        stored certificate alike. A Config API without any ACL serves every
        enrolled device, as the config fetch does.

        Registered on: **management + config-api** (functional on mTLS listeners only).
      security: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
      responses:
        '200':
          description: The P12 bundle.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: 'The listener is not in mTLS mode; or `host_not_allowed` — the device host ACL does not allow this host for the certificate''s device.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No client certificate stored for this host in this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/recovery-door:
    get:
      tags: [client-certs]
      operationId: getRecoveryDoor
      summary: Recovery door status and the CA pins apps need for it
      description: |
        The certificate-renewal door for devices whose client certificate has
        expired: its port, whether it runs, the two server-CA pins to put under
        `HostPin("<host>:<port>", …)` in the app, the expiry of the door's own
        certificate (reissued automatically) and of the CA, and the lifetime of
        device certificates.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Recovery door details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: 'False when `RECOVERY_PORT=0`.' }
                  running: { type: boolean }
                  port: { type: integer, example: 8093 }
                  caPins:
                    type: array
                    items: { type: string }
                    description: Active and backup server-CA pins (Base64 SHA-256 of the SPKI).
                  caNotAfter: { type: string, format: date-time, nullable: true }
                  certificateNotAfter: { type: string, format: date-time, nullable: true }
                  clientCertTtlDays: { type: integer, example: 90 }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs:
    get:
      tags: [client-certs]
      operationId: listClientCerts
      summary: List issued client certificates
      description: |
        Includes revoked rows (`revoked: true`); filter client-side.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: All certificate records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClientCertRecord' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/generate:
    post:
      tags: [client-certs]
      operationId: generateClientCert
      summary: Issue a client certificate from the dashboard
      description: |
        Admin equivalent of enrollment: issues a P12 without consuming a token. Since
        2.2.0 the certificate comes from the client CA (CA:false, client
        authentication; the bundle carries the leaf and the CA) and nothing is added
        to the truststore; an older self-signed P12 of the same id leaves it and its
        key is retired. `403 csr_required` with `ENROLLMENT_P12=off` or
        `ENROLLMENT_ATTESTATION=enforce` (no private key is made on the server then).
        `clientId` must be an identifier
        (`[A-Za-z0-9._:-]{1,64}`); a revoked id is refused and stays revoked
        (`409 revoked` — forget it first, or use another id). Audited as
        `client_cert_generated`.

        Sends `X-P12-SHA256`, but it is a dashboard download for manual provisioning:
        the bundle opens with `CLIENT_P12_PASSWORD` (default `changeit`), or with the
        one-off `X-P12-Password` when the request announced `p12password`. Devices
        enroll through `POST /api/v1/client-certs/enroll`. Running mTLS listeners are
        restarted only when an old anchor left the truststore (several requests in a
        row are folded into one restart).

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): answers `202` with
        `runAfterApproval: true`. The answer carries a secret that is shown once, so the
        approval does not run the request: once it is approved, the requester sends the
        **same request again** (same body and query) and it runs once, the answer going to
        them alone. Nothing of it is stored with the change request.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: 'Defaults to `client-<epochMillis>` when absent or unparseable.'
      responses:
        '413': { $ref: '#/components/responses/AdminBodyTooLarge' }
        '400':
          description: '`invalid_client_id`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`revoked`: the client id was revoked; nothing was generated.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: The PKCS12 bundle (no integrity header).
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="my-device.p12"' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/upload:
    post:
      tags: [client-certs]
      operationId: uploadClientCert
      summary: Import an externally issued client certificate
      description: |
        Adds ONE end-entity client certificate (PEM or DER) to the truststore so the
        device holding its key can complete an mTLS handshake. The file part is used
        regardless of its field name.

        Refused with `400 invalid_client_certificate`: a CA certificate
        (basicConstraints CA, or the `keyCertSign` usage) — in the truststore it
        would vouch for every certificate its key signs —, a v1/v2 certificate (no
        extensions: nothing says it is not a CA, and JSSE lets such an anchor sign),
        a certificate without an extended key usage that includes client
        authentication (since 2.2.0 the extension must be there), one that is
        expired or not yet valid, and anything that is not exactly one certificate.
        An accepted certificate is believed only as itself: every mTLS request must
        present the certificate on record for the client id its CN names (an
        uploaded one: exactly that certificate), otherwise `403 reenroll_required`.
        `clientId` must be an identifier (`[A-Za-z0-9._:-]{1,64}`,
        `400 invalid_client_id`); a revoked id stays revoked (`409 revoked`).
        Audited as `client_cert_uploaded`; running mTLS listeners are restarted
        against the new truststore.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `client_cert_upload`). The approver is shown the certificate's subject, validity and SHA-256 fingerprint.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                clientId:
                  type: string
                  description: 'Defaults to `uploaded-<epochMillis>`.'
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  fingerprint: { type: string }
                  uploaded: { type: boolean, example: true }
        '409':
          description: >
            `revoked`: the client id was revoked; nothing was trusted.
            `client_id_in_use`: the id is an active identity, or the truststore
            already has an entry under it (aliases ignore case).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/AdminBodyTooLarge' }
        '400':
          description: >
            File part missing or not a form (`invalid_multipart`),
            `invalid_client_id`, `reserved_client_id` (`client-ca`, `server-ca`,
            `server`, `backup` in any case), or `invalid_client_certificate` (a CA, a
            certificate signer, no client-authentication usage, expired).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/{id}:
    delete:
      tags: [client-certs]
      operationId: revokeClientCert
      summary: Revoke a client certificate
      description: |
        The server's own names (`client-ca`, `server-ca`, `server`, `backup`, any
        case) are no identity: `400 reserved_client_id`, the client CA's
        truststore entry is never removed (the same for `…/forget`).

        Marks the row revoked, removes the certificate from the truststore, then
        **restarts every running mTLS Config API and every mTLS mock server** —
        running listeners hold the truststore they started with, so without the
        restart a revoked certificate would keep working until the process restarts.

        `token_mtls` vault downloads also re-check `revoked` on each request.
        A CSR-enrolled identity is revoked in `client_identities` as well: the
        mTLS listeners refuse its certificate on every request and its renewal
        (`403 reenroll_required`). The client id stays revoked — a new
        enrollment under it is refused — until it is forgotten
        (`POST /api/v1/client-certs/{id}/forget`).

        **The device is cut off the vault in the same transaction:** every vault
        token of the device in every Config API is revoked and its E2E and
        user-auth keys are deleted. Only device ids the identity **proved** are cut
        off: the client id itself (open enrollment, where it is the device id) and
        the device ids for which it used one of the device's vault tokens over its
        own certificate (a download, or with a key registration), or re-registered
        over it the key the device had on file before the identity was enrolled — a
        new key, or its own key again, proves nothing. The `deviceUid` it sent at
        enrollment is only a claim — anyone enrolling can name a victim's device —
        so those ids come back as `unverifiedDeviceIds` and are left alone unless
        `?cascadeUnverified=true` (the administrator decides they are this
        identity's devices; recorded, so they stay blocked as proven ones). A
        device id another active identity is bound to is left alone either way.
        Every listener that trusts the client CA (mTLS Config APIs and mock mTLS
        hosts) refuses the identity from its next request (`403 reenroll_required`),
        and so does a vault download with a valid token for a device it cut off, on
        TLS listeners too. Audited as `client_cert_revoked`.

        Not behind the approval gate (`PIN_CHANGE_APPROVALS`): an emergency
        revocation takes effect at once. An unknown id still returns `200`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: id
          in: path
          required: true
          description: 'The client id (the certificate CN minus the `PinVault Client: ` prefix).'
          schema: { type: string }
        - name: cascadeUnverified
          in: query
          required: false
          description: '`true`: also cut off the device ids the identity only claimed at enrollment. Repeating the call with it on an already revoked id does just that.'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  revoked: { type: boolean, example: true }
                  deviceIds: { type: array, items: { type: string }, description: The device ids cut off (the client id and the device ids the identity proved). }
                  unverifiedDeviceIds: { type: array, items: { type: string }, description: Device ids the identity only claimed; left alone (empty with `cascadeUnverified=true`). }
                  vaultTokensRevoked: { type: integer }
                  e2eKeysDeleted: { type: integer }
                  userAuthKeysDeleted: { type: integer }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/{id}/devices:
    get:
      tags: [client-certs]
      operationId: clientCertDevices
      summary: Which device ids a revoke or forget would cut off, and which it would leave alone
      description: |
        Read only. `deviceIds`: the client id and the device ids the identity proved
        (a device's vault token used, or the key the device had on file before the
        identity was enrolled re-registered, over its certificate) — what revoke and
        forget cut off. `unverifiedDeviceIds`: the device ids it only claimed at
        enrollment — left alone unless `cascadeUnverified=true`. The dashboard asks
        this before *Forget identity*: after a forget the identity's rows are gone
        and its claimed ids can no longer be cut off through it.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: id
          in: path
          required: true
          description: 'The client id.'
          schema: { type: string }
      responses:
        '200':
          description: The device ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deviceIds: { type: array, items: { type: string } }
                  unverifiedDeviceIds: { type: array, items: { type: string } }
        '404':
          description: '`client_cert_not_found` — no client certificate or identity with this id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-certs/{id}/forget:
    post:
      tags: [client-certs]
      operationId: forgetClientIdentity
      summary: Forget a revoked identity so its client id can enroll again
      description: |
        A revoked client id stays revoked, which leaves a device enrolled in open
        mode — whose client id is its own device id — unable to enroll again.
        Forgetting frees the client id: every key it enrolled with is retired
        (`client_keys`), then its `client_identities` and `client_certs` rows are
        deleted, in one transaction. A certificate over a retired key is refused
        on every mTLS request (`403 reenroll_required`), and a retired key never
        gets a certificate again (`403 revoked` at enrollment, under any client
        id), so the next enrollment is over a new key: the device unenrolls (or
        loses its data) first. Audited as `client_identity_forgotten`.
        The device's vault tokens and keys go as on revocation (in the same
        transaction, the same proven-only rule and `cascadeUnverified` flag), for an
        identity revoked before revocation did that. The record of which devices
        it proved goes with it: a forgotten identity blocks no device.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: id
          in: path
          required: true
          description: 'The client id (the certificate CN minus the `PinVault Client: ` prefix).'
          schema: { type: string }
        - name: cascadeUnverified
          in: query
          required: false
          description: '`true`: also cut off the device ids the identity only claimed.'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Forgotten.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  forgotten: { type: boolean, example: true }
                  retiredKeys: { type: integer, description: Keys the client id enrolled with that are now refused for good. }
                  deviceIds: { type: array, items: { type: string } }
                  unverifiedDeviceIds: { type: array, items: { type: string } }
                  vaultTokensRevoked: { type: integer }
                  e2eKeysDeleted: { type: integer }
                  userAuthKeysDeleted: { type: integer }
        '404':
          description: '`client_cert_not_found` — no client certificate or identity with this id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`not_revoked` — revoke it first; only a revoked identity is forgotten.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/mtls-status:
    get:
      tags: [client-certs]
      operationId: mtlsStatus
      summary: mTLS summary counters
      description: |
        Dashboard tile: how many listeners run in each mode and how many client
        certificates exist / are still active.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      responses:
        '200':
          description: Counters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MtlsStatus' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/client-devices:
    get:
      tags: [device-acl]
      operationId: listClientDevices
      summary: Devices in a Config API scope, keyed by X-Device-Id
      description: |
        Feeds the dashboard's Device-ACL manager. Devices are keyed by the value they
        send as `X-Device-Id` (ANDROID_ID), which is the same key
        `DeviceHostAclStore` uses — unlike `GET /api/v1/hosts/{hostname}/clients`,
        whose ids are derived from manufacturer/model strings.

        The list merges two sources and `source` says which matched:
        * `enrollment` — from `client_certs` (`device_uid` / `device_alias`).
        * `connection` — from `client_devices` rows for hosts in this scope.
        * `enrollment+connection` — both.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - name: configApiId
          in: query
          required: false
          description: 'Scope to list. Defaults to `default-tls`.'
          schema: { type: string, default: default-tls }
      responses:
        '200':
          description: Devices known in this scope.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScopedClientDevice' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # device-acl
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/config-apis/{configApiId}/devices/{deviceId}/host-acl:
    get:
      tags: [device-acl]
      operationId: getDeviceHostAcl
      summary: Hosts explicitly granted to one device
      description: |
        The device's **own** grants only. It excludes the Config API's default ACL —
        use `/host-acl/effective` for the union that
        `GET /api/v1/certificate-config` actually applies.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Granted hostnames.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [device-acl]
      operationId: setDeviceHostAcl
      summary: Replace a device's host ACL
      description: |
        Idempotent set-replace: hostnames in the body but not stored are granted,
        stored hostnames absent from the body are revoked. The counters in the
        response are returned as **strings**.

        **Approval** (`PIN_CHANGE_APPROVALS>=2`): which hosts a device's config
        lists decides which it may reach, so this write waits for a second admin
        (`202`, operation `host_acl`).

        A change is audited as `host_acl_changed` (hosts added and removed).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostnames]
              properties:
                hostnames:
                  type: array
                  items: { type: string }
                  example: [api.example.com, cdn.example.com]
      responses:
        '200':
          description: ACL replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceHostAclUpdate' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '400':
          description: '`hostnames` missing or not a string array.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/devices/{deviceId}/host-acl/effective:
    get:
      tags: [device-acl]
      operationId: getEffectiveDeviceHostAcl
      summary: Effective ACL (device grants ∪ default ACL)
      description: |
        Read-only diagnostic: exactly the set `GET /api/v1/certificate-config`
        intersects the request with.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Effective hostname set (unordered, de-duplicated).
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/default-host-acl:
    get:
      tags: [device-acl]
      operationId: getDefaultHostAcl
      summary: Default host ACL for a Config API
      description: |
        Hostnames every device in this scope may see, on top of its own grants.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: Default hostnames.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    put:
      tags: [device-acl]
      operationId: setDefaultHostAcl
      summary: Replace the default host ACL
      description: |
        Set-replace, like the per-device variant. `hostnames` comes back as a
        comma-joined **string**, and the counters as strings.

        **Approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `host_acl`), like the per-device variant.

        A change is audited as `host_acl_changed` (hosts added and removed).

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostnames]
              properties:
                hostnames:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Default ACL replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultHostAclUpdate' }
        '202': { $ref: '#/components/responses/PendingApproval' }
        '400':
          description: '`hostnames` missing or not a string array.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  # ─────────────────────────────────────────────────────────────────────
  # connection-history
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/connection-history:
    get:
      tags: [connection-history]
      operationId: listConnectionHistory
      summary: All connection and config-update reports
      description: |
        Merged history from three sources, distinguished by `source`: `web` (dashboard
        probes), `client` (device connection reports) and `config_update` (device
        config-refresh outcomes). The store trims old rows on insert.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      responses:
        '200':
          description: History entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionHistoryEntry' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/connection-history/{hostname}:
    get:
      tags: [connection-history]
      operationId: getConnectionHistoryForHost
      summary: Connection history for one host
      description: |
        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      parameters:
        - $ref: '#/components/parameters/HostnamePath'
      responses:
        '200':
          description: History entries for this hostname.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionHistoryEntry' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/connection-history/web:
    post:
      tags: [connection-history]
      operationId: reportWebCheck
      summary: Record a dashboard-initiated probe
      description: |
        Written with `source: "web"`. Every field is optional; missing values fall
        back to `""` / `"unknown"` / `0`.

        Admin-only — unlike the two client report endpoints, this path is not in the
        allowlist.

        Registered on: **management + config-api**.
      security:
        - ApiKeyAuth: []
      x-registered-on: management+config-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                status: { type: string, example: success }
                responseTimeMs: { type: integer, format: int64 }
                errorMessage: { type: string, nullable: true }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saved' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/connection-history/client-report:
    post:
      tags: [connection-history]
      operationId: reportClientConnection
      summary: Device reports a pinned connection attempt
      description: |
        Written with `source: "client"`, and also upserts `client_devices` when
        `hostname`, `deviceManufacturer` and `deviceModel` are all present (device id
        derived as `"<manufacturer>_<model>"`, lowercased, spaces → `_`).

        **Input hardening (M-04):** because this endpoint is public and the dashboard
        renders these values, `hostname`, `deviceManufacturer` and `deviceModel` must
        match `^[A-Za-z0-9._:\- ]{1,128}$`. A violation is rejected with `400` rather
        than sanitised, so abuse shows up in logs.

        **Every field is a claim (O15).** `status` must be `healthy` or
        `pin_mismatch`; `pinVersion` not negative; `serverCertPin` / `storedPin`
        Base64 of at most 100 characters; `responseTimeMs` is brought into 0..10
        minutes; `errorMessage` is cut to one printable line of 300 characters; a
        `timestamp` in the body is ignored (the server's clock is used). Limited to
        `REPORT_RATE_LIMIT` reports per source address per 10 minutes (and, on an
        mTLS listener, `REPORT_DEVICE_RATE_LIMIT` per certificate). The history
        keeps, per Config API, the newest 200 healthy rows and — apart from them —
        the newest 500 failures, so healthy reports cannot push a `pin_mismatch` out.

        Registered on: **management + config-api**.
      security: []
      x-registered-on: management+config-api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientConnectionReport' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saved' }
        '400':
          description: 'A field failed its check (`field` names it): `hostname`, `deviceManufacturer`, `deviceModel`, `status`, `pinVersion`, `serverCertPin`, `storedPin`; or the body is not a JSON object (`invalid_json`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: '`body_too_large` — more than 64 KB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`rate_limited` — `REPORT_RATE_LIMIT` / `REPORT_DEVICE_RATE_LIMIT` reached.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/connection-history/config-update-report:
    post:
      tags: [connection-history]
      operationId: reportConfigUpdate
      summary: Device reports the outcome of a config refresh
      description: |
        Written with `source: "config_update"`. Same identifier hardening as
        `/client-report`, applied to `deviceManufacturer` and `deviceModel`
        (there is no hostname on this report). `status` must be `config_updated`,
        `config_unchanged` or `config_update_failed`; `pinVersion` not negative;
        `failureReason` is cut to one printable line of 300 characters; the time is
        the server's. Rate limits and trimming as for `/client-report`.

        Registered on: **management + config-api**.
      security: []
      x-registered-on: management+config-api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigUpdateReport' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saved' }
        '400':
          description: '`deviceManufacturer`, `deviceModel`, `status` or `pinVersion` failed its check (`field` names it), or the body is not a JSON object.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: '`body_too_large` — more than 64 KB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`rate_limited` — `REPORT_RATE_LIMIT` / `REPORT_DEVICE_RATE_LIMIT` reached.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─────────────────────────────────────────────────────────────────────
  # vault (client-facing, Config API ports only)
  # ─────────────────────────────────────────────────────────────────────

  /api/v1/vault/{key}:
    get:
      tags: [vault]
      operationId: downloadVaultFile
      summary: Download a vault file (client endpoint)
      description: |
        Serves the file registered under `key` in this listener's scope.

        **Scope kill switch.** Checked before anything else: while this Config
        API's `config_apis.vault_enabled` is `false` (see
        `PUT /api/v1/config-apis/{id}/vault-enabled`) every key answers `403`,
        present or not. The flag is read per request, so flipping it in the
        dashboard stops distribution immediately without a restart. Vault
        administration (management listener,
        `/api/v1/config-apis/{configApiId}/vault/…`) stays available.

        **Allowlist nuance.** `isPublicEndpoint` treats `GET /api/v1/vault/{key}` as
        public only when `{key}` matches `^[A-Za-z0-9._-]{1,64}$` **and** is not one
        of the reserved admin segments `distributions`, `stats`, `devices`, `report`,
        `tokens`. Real access control happens inside the handler, per file.

        **Access policies** (`access_policy` on the row):
        * `public` — no check.
        * `api_key` — requires `X-API-Key`, verified *in the handler* (the plugin
          allowlisted the path). Fails closed with `403` when the server has no
          `API_KEY` configured, so an admin-only file never becomes world-readable in
          `ALLOW_ANONYMOUS_ADMIN` mode.
        * `token` — requires `X-Device-Id` + `X-Vault-Token` matching the
          `(configApiId, key, deviceId)` triple. On an mTLS listener the
          `X-Device-Id` must also belong to the client certificate (see *Device id*
          above), so a token taken from one device does not work from another
          enrolled device there.
        * `token_mtls` — token **and** a verified client certificate. The certificate
          binds to the claimed `X-Device-Id` when either the CN's client id equals
          `X-Device-Id` (auto-enrollment, where the client id *is* the ANDROID_ID) or
          the `client_certs` row for that client id has `device_uid == X-Device-Id`
          (token enrollment). A revoked certificate is rejected even when the ids line
          up.

        **Conditional fetch.** When `entry.version <= version`, the response is `304`
        with `X-Vault-Version` and `X-Vault-Encryption` and no body. Note the policy
        check runs first, so an unauthorised caller gets `401`/`403`, not `304`.

        **Encryption.** `plain` and `at_rest` are served as stored (`at_rest` is
        decrypted on read). `end_to_end` wraps the bytes with the device's registered
        RSA public key, so `X-Device-Id` is mandatory and the key must already be
        registered via `POST /api/v1/vault/devices/{deviceId}/public-key` — otherwise
        `412`.
        `user_auth` wraps them the same way (same envelope) with the device's
        **user-auth key** — registered with `"purpose":"user_auth"`, a key the phone's
        hardware uses only after the user unlocked — so the file never leaves in
        plaintext; without one: `412 user_auth_key_required`. Both are stored
        encrypted at rest like `at_rest`.

        **Revoked device.** A `token` / `token_mtls` file asked for with a **valid**
        token and an `X-Device-Id` that belongs to a revoked identity (and to no
        active one) is refused with `403 reenroll_required` on every listener, so a
        token cached in a stolen app stops working at once. The check runs after the
        token check, so a caller without one cannot learn which device ids were
        revoked. Under a policy that authenticates nobody (`public`, `api_key`)
        revocation plays no part: an `end_to_end` / `user_auth` file is answered by
        whether a key is on file for the device id (`412` when not — revocation
        deleted the device's keys), as for any other id. A device id counts as
        revoked only when the revoked identity proved it (see
        `DELETE /api/v1/client-certs/{id}`).

        **Cost.** Existence, the vault switch, the policy, the token, the `304` and
        the device-key lookup are decided from the file's metadata; the file is
        opened (and decrypted) only for a request that is answered with it, and the
        at-rest key is derived once per process, not per download. Refusals count
        towards `DEVICE_REFUSAL_RATE_LIMIT` (`429 rate_limited`). A file whose
        policy or encryption an administrator changed while it was being served is
        answered `503 file_changed` with `Retry-After: 1`.

        **Integrity.** `X-Vault-Signature` is ECDSA over
        `pinvault-vault-file:v1:<key>:<version>:<sha256HexLower(plaintext)>` — signed
        over the plaintext, so one signature is valid for all four encryption modes.
        With more than one signer (`CONFIG_SIGNERS`) `X-Vault-Signatures` carries
        every signature as `keyId:signature` pairs, comma-separated;
        `X-Vault-Signature` keeps the primary one for older clients.
        **v2 (2.2.0):** every `200` also carries `X-Vault-Signature-V2` (primary
        signer) and `X-Vault-Signatures-V2` (all signers, same `keyId:signature`
        encoding) over `pinvault-vault-file:v2:<configApiId>:<key>:<version>:<sha256HexLower(plaintext)>`.
        It names this Config API: a library block with `serverScope(<configApiId>)`
        accepts only v2 signatures, so a file signed for another Config API with the
        same key does not pass. With `CONFIG_SIGNATURE_CACHE` the cache holds both
        schemes per Config API, file, version and content.

        **User-auth keys the server no longer accepts are not sealed for** (`412
        user_auth_key_required` with a `reason`): `key_not_attested` under
        `USER_AUTH_ATTESTATION=enforce` for a key registered without a passing
        attestation (before enforce was switched on); with `USER_AUTH_REQUIRE_PER_USE=true`
        `time_bound_key` for a key that works for seconds after an unlock, and
        `key_kind_unknown` for one attested before the key's kind was recorded. The
        library registers the key again (with its chain) and retries once.

        Registered on: **config-api** only. The management port serves the scoped
        admin mirror under `/api/v1/config-apis/{configApiId}/vault/…` and has no
        download route at all.
      security: []
      x-registered-on: config-api
      parameters:
        - $ref: '#/components/parameters/VaultKeyPath'
        - name: version
          in: query
          required: false
          description: >
            Version the client already holds. When the stored version is less than or
            equal to it, the server answers `304`. Omitted / unparseable means `0`.
          schema: { type: integer, default: 0 }
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/VaultTokenHeader'
        - name: X-API-Key
          in: header
          required: false
          description: 'Required only for files whose `access_policy` is `api_key`.'
          schema: { type: string }
      responses:
        '503':
          description: The file could not be signed right now (an external signer is busy or failed). Nothing about the signer is disclosed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '200':
          description: File bytes (encrypted per the file's `encryption` mode).
          headers:
            X-Vault-Version:
              schema: { type: integer }
            X-Vault-Encryption:
              schema: { type: string, enum: [plain, at_rest, end_to_end, user_auth] }
            X-Vault-Signature:
              description: Base64 ECDSA signature over the plaintext canonical string.
              schema: { type: string }
            X-Vault-Signatures:
              description: >
                Only with more than one signer: every signature, primary first, as
                `<keyId>:<Base64 signature>` pairs separated by commas (`keyId` =
                Base64 SHA-256 of the signer's SPKI).
              schema: { type: string }
              example: 'iI1vEtvPjpEvTVFNUbqYUCvQeFVItZTLmFIVnpMQm7c=:MEUCIQ…,Xy9…=:MEQCIF…'
            X-Vault-Signature-V2:
              description: >
                Base64 ECDSA signature of the primary signer over
                `pinvault-vault-file:v2:<configApiId>:<key>:<version>:<sha256HexLower(plaintext)>`.
              schema: { type: string }
            X-Vault-Signatures-V2:
              description: >
                Every v2 signature, primary first, as `<keyId>:<Base64 signature>` pairs
                separated by commas (the `X-Vault-Signatures` encoding). Always sent.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304':
          description: The client's `version` is already current. No body.
          headers:
            X-Vault-Version:
              schema: { type: integer }
            X-Vault-Encryption:
              schema: { type: string, enum: [plain, at_rest, end_to_end, user_auth] }
        '400':
          description: '`key` does not match `^[A-Za-z0-9._-]{1,64}$`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: >
            Missing/invalid `X-API-Key` (`api_key`), missing `X-Device-Id` or
            `X-Vault-Token`, invalid/revoked token — also the answer for a file that
            does not exist when the caller showed neither an admin key nor a client
            certificate (see `404`) —, missing client certificate or a
            device-identity mismatch (`token_mtls`), or missing `X-Device-Id` on an
            `end_to_end` or `user_auth` file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >
            The Config API's `vault_enabled` flag is off (every key, present or
            not), or an `api_key`-policy file on a server with no `API_KEY`
            configured, or (mTLS listener) `device_identity_mismatch`: `X-Device-Id`
            names a device the client certificate does not belong to. `reenroll_required`: the
            `X-Device-Id` belongs to a revoked identity (device-bound files only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >
            No file with this key in this scope — told only to a caller who showed
            an admin key (`X-API-Key`) or a client certificate. Anyone else is
            answered `401` exactly as for a `token` file (same status, same body
            for the same headers), so asking for names does not reveal which files
            exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: >
            `end_to_end` file but the device has no registered public key, or
            `user_auth_key_required`: `user_auth` file but the device registered no
            user-auth key (`"purpose":"user_auth"`) — or one this server does not seal
            for, named in `reason`: `key_not_attested`, `time_bound_key`, `key_kind_unknown`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Unknown `access_policy` on the row, or per-device encryption failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/vault/devices/{deviceId}/public-key:
    post:
      tags: [vault]
      operationId: registerDevicePublicKey
      summary: Register a device's RSA public key for end-to-end encryption
      description: |
        Called by the device during setup so the server can wrap `end_to_end` files
        for it.

        **Purpose.** `"purpose"` absent or `"e2e"`: the E2E key (`end_to_end` files).
        `"user_auth"`: the device's **user-auth key**, an RSA key whose private half
        the phone's hardware uses only after the user passed the screen lock or
        biometric; `user_auth` files are wrapped with it. The two are stored apart
        (`device_user_auth_keys`), neither registration touches the other, and the
        per-scope limit counts each kind separately. Any other purpose: `400
        unsupported_purpose`.

        **User-auth keys and Android Key Attestation (`USER_AUTH_ATTESTATION`).**
        Replacing a registered user-auth key needs, **in every mode, both** the
        device's credential (a client certificate bound to `{deviceId}`, or the
        device's token for an `end_to_end` / `user_auth` file of this scope via
        `X-Vault-Key` + `X-Vault-Token`) **and** a new key whose attestation passes:
        root code running as the app holds the credential, a stranger with a phone of
        their own can attest a key for any device id. Otherwise `409
        user_auth_key_exists` with `reason`: `credential_required` (checked first; the
        chain is then not verified), `attestation_off`, or the attestation's reason
        (`chain_missing`, `app_binding_not_configured`, `challenge_mismatch`, …). An
        administrator's reset (`DELETE` with `?purpose=user_auth`) makes the next
        registration a first one again. An attestation counts only when both
        `ATTESTATION_PACKAGE_NAMES` and `ATTESTATION_SIGNER_SHA256` are set
        (otherwise a passing chain is stored with reason `app_binding_not_configured`;
        `enforce` does not start without them). The
        body carries the key's chain as `attestationChain`: Base64 DER certificates,
        leaf first, as `KeyStore.getCertificateChain` returns them. The key's
        attestation challenge is SHA-256 over the UTF-8 bytes of
        `"pinvault-user-auth-key:v1:" + deviceId` (32 bytes); there is no challenge
        endpoint. The chain passes when it verifies link by link to a Google hardware
        attestation root (trusted by key; the leaf and intermediates must be within
        their validity; none of its serials in `ATTESTATION_REVOKED_SERIALS_FILE`),
        the leaf's key is `publicKeyPem`, and its KeyDescription (versions 3 and up)
        has that challenge, attestation and KeyMint security level TEE or StrongBox,
        a hardware-enforced list without `noAuthRequired` and with `userAuthType` (or
        `userSecureId`), purpose DECRYPT and origin GENERATED, a rootOfTrust with a
        locked bootloader and Verified boot (`ATTESTATION_REQUIRE_VERIFIED_BOOT`,
        default on), no `authTimeout` over 10 seconds in either authorization list,
        and an `attestationApplicationId` naming a package in `ATTESTATION_PACKAGE_NAMES` and
        a signer in `ATTESTATION_SIGNER_SHA256`. Since 2.2.0 also: `noAuthRequired`
        and `allowWhileOnBody` are refused in the software-enforced list too
        (`no_user_auth`, `allow_while_on_body`); a key whose osVersion is Android 11
        or later (≥ 110000) with any `authTimeout` above 0 is refused as
        `time_bound_key` — the library makes per-use keys there, and a time-bound key
        is what root running as the app makes after deleting the real one — and so
        is any time-bound key with `USER_AUTH_REQUIRE_PER_USE=true`; with
        `ATTESTATION_MIN_PATCH_LEVEL` (YYYYMM) an older or missing osPatchLevel is
        `patch_level_too_old`; with `ATTESTATION_STATUS_MAX_AGE_HOURS` a revocation list
        file older than that lets no chain pass (`revocation_list_stale`). A passing
        key is stored with its kind (`attestation.keyKind`: `per_use` or `time_bound`
        with `authTimeoutSeconds`, and `biometricOnly`). Under `enforce` the key on
        file sent again without a passing chain is refused too (`403
        attestation_required` / `attestation_invalid`). Cheap checks (chain length, decoding,
        the leaf's key, the last certificate against the roots by key or issuer
        name) come before any signature is verified, and a caller without a
        credential is counted against `DEVICE_KEY_RATE_LIMIT` before its chain is
        verified.
        - `off`: not checked; the first key is accepted (no credential needed),
          replacement is admin-only (`reason: attestation_off` with a credential).
        - `warn` (default): the first key is accepted with or without a passing chain
          and without a credential (trust on first use) and the outcome is stored
          with it (listed under
          `GET /api/v1/config-apis/{configApiId}/vault/devices/user-auth-keys`).
        - `enforce`: the first key needs a passing chain too — `403
          attestation_required` without one, `403 attestation_invalid` with a `reason`
          (`challenge_mismatch`, `software_attestation`, `no_user_auth`,
          `auth_timeout_too_long`, `device_unlocked`, `boot_not_verified`,
          `package_not_allowed`, `signer_not_allowed`, `app_binding_not_configured`,
          `untrusted_root`, `chain_broken`, `key_mismatch`, `certificate_expired`,
          `certificate_revoked`, `chain_malformed`, `chain_too_long`, …).
        The same key sent again is a no-op (a passing chain then marks it attested).
        Registrations, replacements and refusals are audited with the attestation
        outcome; `device_key_replaced` goes to the webhook. The E2E key ignores
        `attestationChain`.

        **Revoked device.** A device whose identity was revoked (and that has no
        active one): a request that authenticated — a bound client certificate or a
        valid token proof; an attestation is no credential — gets `403
        reenroll_required`. Any other is handled exactly as for any device id —
        the first key is kept, a different one without proof gets `409` — so no
        answer, and no sequence of answers, tells strangers which device ids were
        revoked. Revocation deleted the device's keys and tokens and refuses its
        certificate; a key registered afterwards without a credential opens only
        files whose policy authenticates nobody (`public`).

        **Who may set the E2E key (audit M-2).**
        - **mTLS listener** (a client certificate was presented): only a certificate
          bound to `{deviceId}` — its client id is the device id, or the id was
          enrolled with `deviceUid` = `{deviceId}` — and not revoked. Such a
          certificate may replace the key at any time. Otherwise `403
          device_identity_mismatch`.
        - **TLS listener** (no certificate): the first key for a device is accepted;
          the same key again is a no-op. A *different* key replaces it only when the
          request carries the device's access token for an `end_to_end` file of this
          scope (`X-Vault-Key` + `X-Vault-Token`; the library adds them when it has
          one). Otherwise `409 key_change_requires_proof` and the registered key
          stays. An administrator can free the slot with `DELETE` on this path or
          on `/api/v1/config-apis/{configApiId}/vault/devices/{deviceId}/public-key`.

        **What may be stored.** TLS asks for no credential, so the key must be RSA of
        2048–4096 bits (stored re-encoded, a few hundred bytes), `{deviceId}` must be
        letters, digits, `.`, `_`, `:` or `-` (at most 64), and `algorithm`
        `RSA-OAEP-SHA256`. Without a client certificate, a source address writes at
        most `DEVICE_KEY_RATE_LIMIT` new or changed keys per 10 minutes (default 30;
        the same key again is not counted); a Config API holds at most
        `DEVICE_KEY_LIMIT` keys (default 100 000), after which only devices it
        already knows are served.

        Registrations and replacements are audited (`device_key_registered`,
        `device_key_replaced`); refusals as `device_key_refused`, summarised per
        minute. `device_key_registered` is not pushed to the webhook under
        `NOTIFY_EVENTS=*`.

        Registered on: **config-api** only.
      security: []
      x-registered-on: config-api
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
        - name: X-Vault-Key
          in: header
          required: false
          description: Server-side key of an `end_to_end` (or, for a user-auth key, `user_auth`) file; with `X-Vault-Token`, proof for replacing a registered key over TLS.
          schema: { type: string }
        - name: X-Vault-Token
          in: header
          required: false
          description: The device's access token for the `X-Vault-Key` file.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKeyPem]
              properties:
                publicKeyPem:
                  type: string
                  description: PEM-encoded RSA public key.
                algorithm:
                  type: string
                  default: RSA-OAEP-SHA256
                purpose:
                  type: string
                  enum: [e2e, user_auth]
                  default: e2e
                  description: Which key this is; `user_auth` keys wrap `user_auth` files.
                attestationChain:
                  type: array
                  items: { type: string, format: byte }
                  description: 'User-auth keys: the key''s Android Key Attestation chain, Base64 DER, leaf first (`KeyStore.getCertificateChain`). Challenge: SHA-256("pinvault-user-auth-key:v1:" + deviceId). Absent from older clients.'
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: string, example: 'true' }
                  deviceId: { type: string }
                  purpose: { type: string, enum: [e2e, user_auth] }
        '400':
          description: '`publicKeyPem` missing; `invalid_device_id`, `invalid_public_key` (not RSA 2048–4096), `unsupported_algorithm` or `unsupported_purpose`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`device_identity_mismatch` — the presented client certificate does not belong to this device, or was revoked; `reenroll_required` — an authenticated request for a device that belongs to a revoked identity; `attestation_required` / `attestation_invalid` (with `reason`) — a first user-auth key under `USER_AUTH_ATTESTATION=enforce`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`key_change_requires_proof` — a different E2E key is already registered and the request carries no valid proof: over TLS, and over mTLS with a certificate whose device id is only claimed (proven: an attested key, a token bound to the device, or the device id as the client id — see SECURE_OPERATIONS "Proven device ids"); the device''s `end_to_end` token (`X-Vault-Key` + `X-Vault-Token`) is proof on both. Re-sending the registered key is a no-op and proves nothing. `user_auth_key_exists` — a user-auth key is registered and the request lacks the device''s credential or a passing attestation (both are needed, in any mode); `reason`: `credential_required`, `attestation_off`, or the attestation''s reason (`chain_missing`, `app_binding_not_configured`, …). An administrator resets the key with `DELETE …/public-key?purpose=user_auth`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`rate_limited` — this address wrote `DEVICE_KEY_RATE_LIMIT` keys (or, without a credential, sent that many user-auth attestation chains to verify) in the last 10 minutes. Over a certificate: `KEY_REPLACEMENT_RATE_LIMIT` (10) replacements per identity.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`device_key_limit_reached` — the Config API holds `DEVICE_KEY_LIMIT` keys; a new device is not stored.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/vault/report:
    post:
      tags: [vault]
      operationId: reportVaultDownload
      summary: Device reports a vault file download
      description: |
        Feeds the dashboard's distribution tracking. `key` is required; `status`
        defaults to `"downloaded"` and, on a TLS listener, `deviceId` to `"unknown"`.

        **Every field is a claim (audit M-3 / O15).** `key` must be a vault key
        (`[A-Za-z0-9._-]{1,64}`), `deviceId` an identifier (letters, digits, `.`,
        `_`, `:`, `-`, at most 64), `status` one of `downloaded`, `cached`, `failed`,
        `authMethod` one of the access policies, `version` not negative — `400`
        otherwise. `deviceManufacturer`, `deviceModel`, `enrollmentLabel` and
        `deviceAlias` are reduced to letters, digits and a little punctuation (64
        characters), `failureReason` to one printable line of 300; the time is the
        server's. On an **mTLS** listener `deviceId` must be the certificate's own
        device (its client id or the `deviceUid` it enrolled with) — `403
        device_identity_mismatch` otherwise; without one the report is filed under
        the certificate's device. Limited to `REPORT_RATE_LIMIT` reports per source
        address and `REPORT_DEVICE_RATE_LIMIT` per device per 10 minutes. The
        history keeps, per Config API, the newest 500 successful rows and — apart
        from them — the newest 1000 failures: reports sent to one Config API cannot
        erase another's history, nor its own failures.

        Registered on: **config-api** only.
      security: []
      x-registered-on: config-api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultReport' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded: { type: string, example: 'true' }
        '400':
          description: 'A field failed its check (`field` names it), or the body is not a JSON object (`invalid_json`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`device_identity_mismatch` — on an mTLS listener, a report about another device than the certificate''s.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: '`body_too_large` — more than 64 KB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: '`rate_limited` — `REPORT_RATE_LIMIT` / `REPORT_DEVICE_RATE_LIMIT` reached.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/config-apis/{configApiId}/vault:
    get:
      tags: [vault-admin]
      operationId: listScopedVaultFiles
      summary: List vault files in a named scope
      description: |
        Management-port mirror of `GET /api/v1/vault`, with the scope in the path so
        the dashboard can manage any Config API's vault from one place.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
      responses:
        '200':
          description: Files in that scope.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultFileEntry' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/{key}:
    put:
      tags: [vault-admin]
      operationId: putScopedVaultFile
      summary: Upload or replace a file in a named scope
      description: |
        Mirror of `PUT /api/v1/vault/{key}`. **Difference:** this handler does not
        apply the `^[A-Za-z0-9._-]{1,64}$` / reserved-segment check, so a key written
        here can be one the client-facing download route would reject or route
        elsewhere. Keep to the same key shape.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `vault_upload`). The approver is shown the size and SHA-256 of the content, the version it replaces and the access rule and encryption it will have; the stored bytes are applied as they are.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
        - $ref: '#/components/parameters/VaultPolicyQuery'
        - $ref: '#/components/parameters/VaultEncryptionQuery'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Stored.
          headers:
            X-Vault-Version:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultPutResult' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    delete:
      tags: [vault-admin]
      operationId: deleteScopedVaultFile
      summary: Delete a file from a named scope
      description: |
        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `vault_delete`). Audited as `vault_file_deleted`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultDeleteResult' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/{key}/policy:
    put:
      tags: [vault-admin]
      operationId: putScopedVaultFilePolicy
      summary: Change a file's policy / encryption in a named scope
      description: |
        Mirror of `PUT /api/v1/vault/{key}/policy` (a changed value bumps the
        version, so devices fetch the file again). Invalid enum values trip a
        `require(...)`, which `StatusPages` on the management server turns into a
        JSON `500`.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `vault_policy`). The approver is shown the change (for instance `token_mtls → public`). Audited as `vault_policy_changed`.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultPolicyUpdate' }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: string, example: 'true' }
        '400':
          description: '`access_policy` or `encryption` missing from the body.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No file with this key in that scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: '`access_policy` or `encryption` is not one of the allowed values.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/{key}/tokens:
    get:
      tags: [vault-admin]
      operationId: listScopedVaultTokens
      summary: List a file's access tokens in a named scope
      description: 'Registered on: **management** only.'
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      responses:
        '200':
          description: Tokens (hashes only).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultToken' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }
    post:
      tags: [vault-admin]
      operationId: createScopedVaultToken
      summary: Issue a per-device access token in a named scope
      description: |
        Plaintext returned once. Mirror of `POST /api/v1/vault/{key}/tokens`.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): answers `202` with
        `runAfterApproval: true`. The answer carries a secret that is shown once, so the
        approval does not run the request: once it is approved, the requester sends the
        **same request again** (same body and query) and it runs once, the answer going to
        them alone. Nothing of it is stored with the change request.

        Registered on: **management** only.
      security:
        - ApiKeyAuth: []
      x-registered-on: management
      parameters:
        - $ref: '#/components/parameters/ConfigApiIdPath'
        - $ref: '#/components/parameters/VaultKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '202': { $ref: '#/components/responses/PendingApproval' }
        '200':
          description: Token issued (plaintext shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedVaultToken' }
        '400':
          description: '`deviceId` missing.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/MissingApiKey' }
        '403': { $ref: '#/components/responses/InvalidApiKey' }

  /api/v1/config-apis/{configApiId}/vault/tokens/{tokenId}:
    delete:
      tags: [vault-admin]
      operationId: revokeScopedVaultToken
      summary: Revoke a vault access token
      description: |
        Token ids are globally unique, so `{configApiId}` is not used by the lookup.

        **Two-person approval** (`PIN_CHANGE_APPROVALS>=2`): waits for a second admin
        (`202`, operation `vault_token_revoke`). A token of another Config API is `404` here. Audited as `vault_token_revoked`. An operator who wants revocations to take effect at once exempts the operation (`APPROVAL_EXEMPT_OPERATIONS=vault_token_revoke`).

        Registered on: **management** only.
