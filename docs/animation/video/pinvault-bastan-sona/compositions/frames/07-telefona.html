    <script>
      (function () {
        var FID = "07-telefona";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var TRAVEL = "power3.inOut";
        var HIDDEN = "inset(0% 100% 0% 0%)";
        var SHOWN = "inset(0% 0% 0% 0%)";

        // ---------- Scene 1 (0.0–1.5): chain settles, kicker, title (phone frame in as hero) ----------
        tl.fromTo($("curcell"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("curline"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: SOFT }, 0.3);
        tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 0.2);
        tl.fromTo($("phone"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.3);
        tl.fromTo($("title"), { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.5);

        // ---------- Scene 2 (1.5–4.0): message bubble slides in from the left, small note ----------
        tl.fromTo($("msg"), { opacity: 0, x: -90 }, { opacity: 1, x: 0, duration: 0.8, ease: SOFT }, 1.5);
        tl.fromTo($("msgnote"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 2.9);

        // ---------- Scene 3 (4.0–7.5): "Kayıt Ol" window opens, token slides into the field, button press ----------
        tl.fromTo($("win"), { opacity: 0, scale: 0.9, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: SOFT }, 4.0);
        tl.fromTo($("fly"), { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: 0, y: 0, duration: 0.15, ease: "none" }, 4.75);
        tl.to($("fly"), { x: 664, y: -128, duration: 1.0, ease: TRAVEL }, 4.9);
        tl.fromTo(
          $("btn"),
          { scale: 1, backgroundColor: "#EFE9D9", color: "#0F0F0F" },
          { scale: 0.93, backgroundColor: "#0F0F0F", color: "#EFE9D9", duration: 0.14, ease: "power2.in", immediateRender: false },
          6.5
        );
        tl.to($("btn"), { scale: 1, duration: 0.35, ease: SOFT }, 6.64);

        // ---------- Scene 4 (7.5–11.0): code box opens, four lines type in, line 2 highlighted, note ----------
        tl.fromTo($("code"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 7.5);
        tl.fromTo($("c1"), { clipPath: HIDDEN }, { clipPath: SHOWN, duration: 0.55, ease: "steps(44)" }, 8.0);
        tl.fromTo($("c2"), { clipPath: HIDDEN }, { clipPath: SHOWN, duration: 0.85, ease: "steps(52)" }, 8.65);
        tl.fromTo($("c3"), { clipPath: HIDDEN }, { clipPath: SHOWN, duration: 0.1, ease: "steps(1)" }, 9.6);
        tl.fromTo($("c4"), { clipPath: HIDDEN }, { clipPath: SHOWN, duration: 0.45, ease: "steps(30)" }, 9.75);
        tl.fromTo($("hl"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, 10.0);
        tl.fromTo($("codenote"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 10.3);

        // ---------- Scene 5 (11.0–14.0): analogy strip, then hold ----------
        tl.fromTo($("analogy"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: SOFT }, 11.0);
        tl.to({}, { duration: 0.01 }, 13.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
