  <script>
    (function () {
      var FID = "13-sonrasi";
      var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
      var $ = function (n) {
        return host.querySelector('[id="' + FID + "-" + n + '"]');
      };
      var tl = gsap.timeline({ paused: true });
      var OUT = "power3.out";
      var IN = "power3.in";
      var INOUT = "power3.inOut";
      var WIPE_FROM = "inset(-10% 100% -10% 0%)";
      var WIPE_TO = "inset(-10% 0% -10% 0%)";

      // station i (1..5): marker, connector, card, body wipe
      function station(i, t) {
        tl.fromTo($("stop" + i), { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: OUT }, t);
        tl.fromTo($("tick" + i), { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.35, ease: OUT }, t + 0.1);
        tl.fromTo($("card" + i), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: OUT }, t + 0.15);
        tl.fromTo($("body" + i), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.9, ease: OUT }, t + 0.4);
      }
      // rider travels to station i (centers 260 + (i-1)*350; rider is 150 wide, based at left 96)
      function ride(i, t) {
        tl.to($("rider"), { x: 89 + (i - 1) * 350, duration: 0.7, ease: INOUT }, t);
        tl.to($("stop" + i), { backgroundColor: "#0F0F0F", duration: 0.25, ease: OUT }, t + 0.6);
      }

      // ---------- Scene 1 (0.0–1.5): title; strip draws left to right; pink card at the strip start ----------
      tl.fromTo($("title"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: OUT }, 0.1);
      tl.fromTo($("strip"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.0, ease: INOUT }, 0.4);
      tl.fromTo($("rider"), { autoAlpha: 0, y: -24 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: OUT }, 0.75);

      // ---------- Scene 2 (1.5–4.0): station 1; pink card settles on it ----------
      station(1, 1.5);
      ride(1, 2.0);

      // ---------- Scene 3 (4.0–6.5): station 2; ticket renews once ----------
      station(2, 4.0);
      ride(2, 4.3);
      tl.fromTo($("ticket-old"), { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: OUT }, 4.95);
      tl.to($("ticket-old"), { opacity: 0.25, x: -14, duration: 0.4, ease: OUT }, 5.6);
      tl.fromTo($("ticket-new"), { autoAlpha: 0, x: 44 }, { autoAlpha: 1, x: 0, duration: 0.55, ease: OUT }, 5.75);
      tl.to($("ticket-old"), { opacity: 0, duration: 0.3, ease: OUT }, 6.15);

      // ---------- Scene 4 (6.5–9.0): station 3; card flips, renewed card, short green check ----------
      station(3, 6.5);
      ride(3, 6.8);
      tl.to($("faceA"), { scaleX: 0, duration: 0.22, ease: IN }, 7.7);
      tl.fromTo($("faceB"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: OUT }, 7.92);
      tl.fromTo($("check"), { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: OUT }, 8.25);
      tl.to($("check"), { autoAlpha: 0, duration: 0.3, ease: OUT }, 8.95);

      // ---------- Scene 5 (9.0–11.5): station 4; card greys out, signature seal, pink again ----------
      station(4, 9.0);
      ride(4, 9.3);
      tl.to($("faceB"), { backgroundColor: "#E4DCC4", duration: 0.3, ease: OUT }, 10.05);
      tl.to($("ctxtB"), { opacity: 0.4, duration: 0.3, ease: OUT }, 10.05);
      tl.fromTo($("seal"), { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: OUT }, 10.45);
      tl.fromTo($("sig"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, 10.6);
      tl.to($("faceB"), { backgroundColor: "#F06CA8", duration: 0.3, ease: OUT }, 11.1);
      tl.to($("ctxtB"), { opacity: 1, duration: 0.3, ease: OUT }, 11.1);

      // ---------- Scene 6 (11.5–14.0): station 5; orange revoke stamp lands on the card, hold ----------
      station(5, 11.5);
      ride(5, 11.8);
      tl.fromTo(
        $("stamp"),
        { autoAlpha: 0, scale: 1.5, rotation: -6 },
        { autoAlpha: 1, scale: 1, rotation: -6, duration: 0.35, ease: OUT },
        12.6
      );
      tl.to($("ctxtB"), { opacity: 0.5, duration: 0.4, ease: OUT }, 12.8);

      // pad to the fixed 14s duration (hold)
      tl.set({}, {}, 14);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
