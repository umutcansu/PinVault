    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "04-apk";
        var TOTAL = 15;
        var SOFT = "power3.out";
        function $(n) {
          return document.getElementById(FID + "-" + n);
        }
        var tl = gsap.timeline({ paused: true });

        // ---------- Scene 1 (0.0–1.5): chain cell settles, kicker, title ----------
        tl.fromTo($("cellcur"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("cellline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 0.15);
        tl.fromTo($("title"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 0.45);

        // ---------- Scene 2 (1.5–6.0): panel opens, lines land one by one ----------
        tl.fromTo($("panel"), { opacity: 0, scaleY: 0.06 }, { opacity: 1, scaleY: 1, duration: 0.55, ease: SOFT }, 1.5);

        // discrete line states: wizard output arrives line by line (slot 9 stays empty)
        var LINE_SEQ = [
          { t: 2.1, line: 0 },
          { t: 2.4, line: 1 },
          { t: 2.7, line: 2 },
          { t: 3.0, line: 3 },
          { t: 3.3, line: 4 },
          { t: 3.6, line: 5 },
          { t: 3.9, line: 6 },
          { t: 4.2, line: 7 },
          { t: 4.5, line: 8 },
          { t: 4.8, line: 10 },
        ];

        // ---------- Scene 4 (9.0–11.0): attestation() typed by hand ----------
        var AT_FULL = "attestation()   // sihirbaz üretmez, elle eklenir";
        var AT_NAME_LEN = 11; // "attestation"
        var AT_SEQ = [{ t: 0, k: 0 }];
        var i;
        for (i = 1; i <= 13; i++) AT_SEQ.push({ t: 9.05 + (i - 1) * 0.05, k: i }); // attestation()
        for (i = 14; i <= AT_FULL.length; i++) AT_SEQ.push({ t: 10.0 + (i - 14) * 0.024, k: i }); // comment
        var AT_DONE = AT_SEQ[AT_SEQ.length - 1].t;

        var lines = [];
        var curs = [];
        for (i = 0; i <= 10; i++) {
          lines[i] = $("l" + i);
          curs[i] = lines[i].querySelector("span:last-child");
        }
        var atName = $("atname");
        var atRest = $("atrest");

        function atK(t) {
          for (var j = AT_SEQ.length - 1; j >= 0; j--) {
            if (t >= AT_SEQ[j].t) return AT_SEQ[j].k;
          }
          return 0;
        }

        function render(t) {
          // line visibility (line 9 is the hand-typed slot, always present but empty until typed)
          var lastLine = -1;
          for (var j = 0; j <= 10; j++) {
            if (j === 9) continue;
            lines[j].style.visibility = "hidden";
          }
          for (var s = 0; s < LINE_SEQ.length; s++) {
            if (t >= LINE_SEQ[s].t) {
              lines[LINE_SEQ[s].line].style.visibility = "visible";
              lastLine = LINE_SEQ[s].line;
            }
          }

          // hand typing
          var k = atK(t);
          atName.textContent = AT_FULL.slice(0, Math.min(k, AT_NAME_LEN));
          atRest.textContent = k > AT_NAME_LEN ? AT_FULL.slice(AT_NAME_LEN, k) : "";

          // cursor host + blink
          var host = -1;
          var solid = false;
          if (t >= 2.1 && t < 5.1) {
            host = lastLine;
            solid = true;
          } else if (t >= 5.1 && t < 9.05) {
            host = 9; // parks in the empty slot
          } else if (t >= 9.05 && t < AT_DONE + 0.1) {
            host = 9;
            solid = true;
          } else if (t >= AT_DONE + 0.1 && t < 11.6) {
            host = 9;
          }
          var on = solid || Math.sin((t * Math.PI * 2) / 0.7) > 0;
          for (var c = 0; c <= 10; c++) {
            curs[c].style.opacity = c === host && on ? "1" : "0";
          }
        }

        var driver = { t: 0 };
        tl.to(
          driver,
          {
            t: TOTAL,
            duration: TOTAL,
            ease: "none",
            onUpdate: function () {
              render(driver.t);
            },
          },
          0,
        );
        render(0);

        // ---------- Scene 3 (6.0–9.0): framing + notes ----------
        tl.fromTo($("frame1"), { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, 6.0);
        tl.fromTo($("note1"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 6.25);
        tl.fromTo($("frame2"), { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, 7.0);
        tl.fromTo($("note2"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 7.25);
        tl.fromTo($("frame3"), { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, 8.0);
        tl.fromTo($("note3"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 8.25);

        // hand-typed line gets a lighter band
        tl.fromTo($("band"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 9.0);

        // ---------- Scene 5 (11.0–15.0): arrow, APK box settles, ✗ line, analogy, hold ----------
        tl.fromTo($("arrow"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: SOFT }, 11.0);
        tl.fromTo($("box"), { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 11.35);
        tl.fromTo($("no"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 12.3);
        tl.fromTo($("analogy"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 13.0);
        tl.to({}, { duration: 0.01 }, TOTAL - 0.01);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
