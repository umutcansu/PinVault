    <script>
      (function () {
        var FID = "05-host";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };
        var $$ = function (n) {
          return Array.prototype.slice.call(host.querySelectorAll('[class~="' + FID + "-" + n + '"]'));
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var TRAVEL = "power3.inOut";

        // ---------- Scene 1 (0.0–1.5): chain (already standing), current cell settles, kicker, title ----------
        tl.fromTo($("cellprev"), { opacity: 0.35 }, { opacity: 0, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("cellnow"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("cellline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 0.25);
        tl.fromTo($("title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.5);

        // ---------- Scene 2 (1.5–5.0): panel opens, tabs, URL'den Al selected, address typed, Oluştur pressed ----------
        tl.fromTo($("panel"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 1.5);
        $$("tab").forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: SOFT }, 1.85 + i * 0.12);
        });
        tl.fromTo($("tabsel"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: SOFT }, 2.45);
        tl.fromTo($("fieldlabel"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: SOFT }, 2.6);
        tl.fromTo([$("input"), $("button")], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: SOFT }, 2.7);
        tl.fromTo($("buttonfill"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        // letter-by-letter typing; caret steps one mono advance (0.6em of 26px) per char
