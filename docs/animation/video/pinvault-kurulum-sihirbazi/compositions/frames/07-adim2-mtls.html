    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      (function () {
        var FID = "07-adim2-mtls";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var INOUT = "power3.inOut";

        // ---------- Scene 1 (0.0–1.2): strip standing; current cell settles; title ----------
        tl.fromTo($("cur"), { opacity: 0.35, borderWidth: 2 }, { opacity: 1, borderWidth: 4, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("title"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.4);

        // ---------- Scene 2 (1.2–3.0): panel settles; card title; two info lines ----------
        tl.fromTo($("panel"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 1.2);
        tl.fromTo($("cardtitle"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 1.7);
        tl.fromTo($("info1"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 2.1);
        tl.fromTo($("info2"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 2.5);

        // ---------- Scene 3 (3.0–9.0): table head, seven rows ~0.8 s apart, badge 0.2 s after its row ----------
        ["th1", "th2", "th3"].forEach(function (n, i) {
          tl.fromTo($(n), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 3.0 + i * 0.08);
        });
        tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 3.0);
        for (var r = 1; r <= 7; r++) {
          var at = 3.4 + (r - 1) * 0.8;
          tl.fromTo($("row" + r), { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, at);
          tl.fromTo($("b" + r), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, at + 0.2);
        }

        // ---------- Scene 4 (9.0–11.5): server and phone settle; card slides server → phone; label; chip + line ----------
        tl.fromTo($("server"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 9.0);
        ["p1", "p2", "p3", "p4"].forEach(function (p, i) {
          tl.fromTo($(p), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 9.3 + i * 0.08);
        });
        tl.fromTo($("phone"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 9.2);
        tl.fromTo($("key"), { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: SOFT }, 9.6);
        // card is printed at the server's lower edge, then travels down to its place beside the phone (1.2 s)
        tl.fromTo(
          $("card"),
          { opacity: 0, x: 50, y: -180, scale: 0.6 },
          { opacity: 1, x: 50, y: -180, scale: 1, duration: 0.5, ease: SOFT },
          9.6
        );
        tl.fromTo($("cardpath"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 9.9);
        tl.to($("card"), { x: 0, y: 0, duration: 1.2, ease: INOUT }, 9.9);
        tl.to($("key"), { opacity: 1, duration: 0.3, ease: SOFT }, 10.9);
        tl.fromTo($("phok"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, 11.0);
        tl.fromTo($("phtick"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 11.15);
        tl.fromTo($("cardlabel"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 11.1);
        tl.fromTo($("chip"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 11.3);
        tl.fromTo($("chipline"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 11.5);
        tl.fromTo($("pinline"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: SOFT }, 12.1);

        // ---------- Scene 5 (11.5–15.0): NEDEN strip, hold ----------
        tl.fromTo($("why"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 12.3);
        tl.to({}, { duration: 0.01 }, 15.49);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
