    <script>
      (function () {
        var FID = "02-neden";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var WIPE_FROM = "inset(-20% 100% -20% 0%)";
        var WIPE_TO = "inset(-20% 0% -20% 0%)";

        // ---------- Scene 1 (0.0–1.5): title ----------
        tl.fromTo($("title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 0.1);

        // ---------- Scene 2 (1.5–5.0): wrong lines, read, orange strike, green correction ----------
        tl.fromTo($("card"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 1.5);
        tl.fromTo($("w1"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.8, ease: SOFT }, 1.7);
        tl.fromTo($("w2"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.5, ease: SOFT }, 2.4);
        // strike after reading (≈3.2 s)
        tl.fromTo($("s1"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 3.2);
        tl.fromTo($("s2"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, 3.55);
        tl.fromTo($("x"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 3.5);
        tl.fromTo($("w1"), { opacity: 1 }, { opacity: 0.5, duration: 0.4, ease: SOFT }, 3.6);
        tl.fromTo($("w2"), { opacity: 1 }, { opacity: 0.5, duration: 0.4, ease: SOFT }, 3.7);
        // correction
        tl.fromTo($("sep"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: SOFT }, 3.9);
        tl.fromTo($("c"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 4.0);
        tl.fromTo($("right"), { opacity: 0, clipPath: WIPE_FROM }, { opacity: 1, clipPath: WIPE_TO, duration: 0.9, ease: SOFT }, 4.05);

        // ---------- Scene 3 (5.0–11.0): the box, five lines ≈0.9 s apart ----------
        tl.fromTo($("box"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 5.0);
        [1, 2, 3, 4, 5].forEach(function (i) {
          var t = 5.8 + (i - 1) * 0.9;
          var line = $("l" + i);
          tl.fromTo(line, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, t);
          tl.fromTo(line.querySelector('[class~="' + FID + '-mark"]'), { scale: 0.6 }, { scale: 1, duration: 0.4, ease: SOFT }, t + 0.1);
        });

        // ---------- Scene 4 (11.0–13.0): hold ----------
        tl.to({}, { duration: 0.01 }, 13.49);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
