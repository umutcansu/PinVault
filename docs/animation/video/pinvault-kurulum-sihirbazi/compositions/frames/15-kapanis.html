    <script>
      (function () {
        var FID = "15-kapanis";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // ---------- Scene 1 (0.0–2.5): green ground; the cream-outlined strip waits out the 0.5 s crossfade,
        // then its cells fill with cream left to right, 0.4 s apart, their labels turning green ----------
        tl.fromTo($("topbar"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 0.5);
        tl.fromTo($("footer"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 0.5);
        tl.fromTo($("strip"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 0.5);
        var i;
        for (i = 1; i <= 4; i++) {
          tl.fromTo($("fill" + i), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: SOFT }, 0.7 + (i - 1) * 0.4);
          tl.fromTo($("label" + i), { color: "#EFE9D9" }, { color: "#1F8A4C", duration: 0.3, ease: SOFT }, 0.82 + (i - 1) * 0.4);
        }

        // ---------- Scene 2 (2.5–5.5): the headline slides up into place; one second later, headline 2 ----------
        tl.fromTo($("head"), { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 1.2, ease: SOFT }, 2.6);
        tl.fromTo($("head2"), { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.1, ease: SOFT }, 3.6);

        // ---------- Scene 3 (5.5–10.0): the bottom line arrives, a still hold, then the film's only real exit ----------
        tl.fromTo($("pathrow"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: SOFT }, 5.8);
        tl.fromTo($("fade"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9.2);
        tl.to({}, { duration: 0.01 }, 10.49);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
