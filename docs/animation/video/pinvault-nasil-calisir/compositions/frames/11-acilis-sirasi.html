  <script>
    (function () {
      var P = "11-acilis-sirasi-";
      var all = function (name) {
        return Array.prototype.slice.call(document.querySelectorAll('[class~="' + P + name + '"]'));
      };
      var cards = all("card");
      var lines = all("arrow-line");
      var heads = all("arrow-head");
      var notes = all("note");
      var foot = all("foot");
      var title = all("title");

      var E = "power3.out";
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.5s): title
      tl.fromTo(title, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 0.1);

      // one card arrival: fade + short slide into its slot, inner pieces staggered
      function cardIn(card, t) {
        var num = card.querySelector('[class~="' + P + 'num"]');
        var st = card.querySelector('[class~="' + P + 'step-title"]');
        var body = card.querySelector('[class~="' + P + 'body"]');
        tl.fromTo(card, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, t);
        tl.fromTo(num, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: E }, t + 0.12);
        tl.fromTo(st, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, t + 0.18);
        tl.fromTo(body, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, t + 0.4);
      }
      // short down arrow between card k-1 and k (path draw, then head)
      function arrowIn(i, t) {
        tl.fromTo(lines[i], { strokeDashoffset: 22 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo(heads[i], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: E }, t + 0.28);
      }
      // "neden" note: thin ink tether draws out of the card, then the mono note
      function noteIn(note, t) {
        var tether = note.querySelector('[class~="' + P + 'tether"]');
        var dot = note.querySelector('[class~="' + P + 'tether-dot"]');
        var txt = note.querySelector('[class~="' + P + 'note-text"]');
        tl.fromTo(tether, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: E }, t);
        tl.fromTo(dot, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, t + 0.35);
        tl.fromTo(txt, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, t + 0.42);
      }

      // Scene 2 (1.5–4.0s): step 1 + its reason note
      cardIn(cards[0], 1.5);
      noteIn(notes[0], 2.5);

      // Scene 3 (4.0–6.5s): arrow, step 2
      arrowIn(0, 4.0);
      cardIn(cards[1], 4.15);

      // Scene 4 (6.5–9.0s): arrow, step 3
      arrowIn(1, 6.5);
      cardIn(cards[2], 6.65);

      // Scene 5 (9.0–11.5s): arrow, step 4 (yellow: ticket) + its reason note
      arrowIn(2, 9.0);
      cardIn(cards[3], 9.15);
      noteIn(notes[1], 10.15);

      // Scene 6 (11.5–15.0s): arrow, step 5 (green: list ends green), footnote, hold
      arrowIn(3, 11.5);
      cardIn(cards[4], 11.65);
      tl.fromTo(foot, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 12.9);

      // pin the timeline length to the frame duration (static hold to the end)
      tl.set({}, {}, 15);

      window.__timelines = window.__timelines || {};
      window.__timelines["11-acilis-sirasi"] = tl;
    })();
