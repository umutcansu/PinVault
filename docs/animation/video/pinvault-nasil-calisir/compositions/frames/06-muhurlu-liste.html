      <div data-hf-id="hf-w5rq" class="mh-abs mh-apk" id="06-muhurlu-liste-apk">APK</div>

      <!-- note -->
      <div data-hf-id="hf-4ppt" class="mh-abs mh-note" id="06-muhurlu-liste-note">Sunucuya ulaşılamazsa telefon son listeyle, süresi dolana kadar çalışır.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    (function () {
      var FID = "06-muhurlu-liste";
      var $ = function (id) {
        return document.getElementById(FID + "-" + id);
      };
      var DUR = 15;
      var tl = gsap.timeline({ paused: true });

      // ---------- discrete-text-sequence states ----------
      var CHUNKS = [3, 2, 4, 2, 3];
      function typeSeq(text, t0, base, from) {
        var states = [];
        var i = from || 0;
        var k = 0;
        var t = t0;
        while (i < text.length) {
          i = Math.min(text.length, i + CHUNKS[k % CHUNKS.length]);
          states.push({ t: t, text: text.slice(0, i) });
          var last = text.charAt(i - 1);
          t += last === " " || last === "·" ? base + 0.06 : base;
          k++;
        }
        return { states: states, end: t };
      }
      function textAt(states, time) {
        for (var i = states.length - 1; i >= 0; i--) {
          if (time >= states[i].t) return states[i].text;
        }
        return "";
      }

      var ROW1 = "api.ornek.com · ziA0hyMD…";
      var PRE_LEN = 16; // "api.ornek.com · "
      var OLD_HASH = "ziA0hyMD…";
      var NEW_HASH = "vXC1UZ8O…";
      var ROW2 = "cdn.ornek.com · kök CA";
      var ROW3 = "son kullanma: 24 saat";

      // Scene 2 typing
      var r1 = typeSeq(ROW1, 2.8, 0.06);
      var r2 = typeSeq(ROW2, r1.end + 0.1, 0.06);
      var r3 = typeSeq(ROW3, r2.end + 0.1, 0.06);
      var T_SEAL = r3.end + 0.08;

      // Scene 4 edit: strike, backspace to empty, retype
      var T_STRIKE = 8.0;
      var T_BS = 8.6;
      var hashEdit = [];
      for (var b = 0; b <= OLD_HASH.length; b++) {
        hashEdit.push({ t: T_BS + b * 0.06, text: OLD_HASH.slice(0, OLD_HASH.length - b) });
      }
      var T_RETYPE = T_BS + OLD_HASH.length * 0.06 + 0.25;
      var retype = typeSeq(NEW_HASH, T_RETYPE, 0.07);
      hashEdit = hashEdit.concat(retype.states);
      var T_EDIT_DONE = retype.end;

      var preEl = $("r1-pre");
      var hashEl = $("r1-hash");
      var r2El = $("r2");
      var r3El = $("r3");
      var cursors = [$("c1"), $("c2"), $("c3")];
      var cursorWindows = [
        [2.75, r1.end + 0.05, 0],
        [r1.end + 0.05, r2.end + 0.05, 1],
        [r2.end + 0.05, r3.end + 0.3, 2],
        [T_BS - 0.15, T_EDIT_DONE + 0.35, 0],
      ];

      function renderText(t) {
        if (t < T_BS) {
          var s1 = textAt(r1.states, t);
          preEl.textContent = s1.slice(0, PRE_LEN);
          hashEl.textContent = s1.slice(PRE_LEN);
        } else {
          preEl.textContent = ROW1.slice(0, PRE_LEN);
          hashEl.textContent = textAt(hashEdit, t);
        }
        r2El.textContent = textAt(r2.states, t);
        r3El.textContent = textAt(r3.states, t);

        var active = -1;
        for (var w = 0; w < cursorWindows.length; w++) {
          if (t >= cursorWindows[w][0] && t < cursorWindows[w][1]) active = cursorWindows[w][2];
        }
        var on = Math.sin((t * Math.PI * 2) / 0.55) > -0.2;
        for (var c = 0; c < cursors.length; c++) {
          cursors[c].style.opacity = c === active && on ? "1" : "0";
        }
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            renderText(driver.t);
          },
        },
        0,
      );

      // ---------- path motion helper (orthogonal polylines, in canvas px) ----------
      function polyAt(pts, p) {
        var lens = [];
        var total = 0;
        for (var i = 1; i < pts.length; i++) {
          var l = Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
          lens.push(l);
          total += l;
        }
        var d = p * total;
        for (var j = 0; j < lens.length; j++) {
          if (d <= lens[j] || j === lens.length - 1) {
            var f = lens[j] === 0 ? 0 : Math.min(1, d / lens[j]);
            return [
              pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f,
              pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f,
            ];
          }
          d -= lens[j];
        }
        return pts[pts.length - 1];
      }
      var PHONE_CX = [1405, 1577, 1749];
      function wirePts(i) {
        return [
          [1080, 428],
          [1250, 428],
          [1250, 630],
          [PHONE_CX[i], 630],
          [PHONE_CX[i], 420],
        ];
      }
      function placeCopy(el, xy) {
        var x = (xy[0] - 28) / 19.2;
        var y = (xy[1] - 35) / 19.2;
        el.style.transform = "translate(" + x + "cqw," + y + "cqw)";
      }
      function sendCopy(el, i, start, dur) {
        var pts = wirePts(i);
        var prog = { p: 0 };
        tl.set(el, { opacity: 1 }, start);
        tl.to(
          prog,
          {
            p: 1,
            duration: dur,
            ease: "power3.inOut",
            onUpdate: function () {
              placeCopy(el, polyAt(pts, prog.p));
            },
          },
          start,
        );
        return start + dur;
      }
      // park every copy at its start point (hidden) so the first rendered frame is defined
      ["a0", "a1", "a2", "b0", "b1", "b2"].forEach(function (k) {
        placeCopy($("copy-" + k), [1080, 428]);
      });

      // ================= Scene 1 (0.0–2.0): headline + PANEL =================
      tl.fromTo($("title"), { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.1);
      tl.fromTo($("panel"), { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.75);
      tl.fromTo(
        $("panel").querySelectorAll(".mh-panel-bar"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out", stagger: 0.12 },
        1.2,
      );

      // ================= Scene 2 (2.0–5.0): list leaves the panel, rows typed, seal =================
      tl.fromTo($("arrow"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 2.0);
      tl.fromTo($("arrowhead"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 2.3);
      tl.fromTo(
        $("doc"),
        { xPercent: -93.2, scale: 0.3, opacity: 0 },
        { xPercent: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        2.0,
      );
      tl.fromTo(
        $("seal"),
        { opacity: 0, scale: 1.7, rotation: -4 },
        { opacity: 1, scale: 1, rotation: -4, duration: 0.32, ease: "power3.out" },
        T_SEAL,
      );

      // ================= Scene 3 (5.0–8.0): copies ride the wires to three phones =================
      for (var p = 0; p < 3; p++) {
        tl.fromTo($("phone-" + p), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 4.95 + p * 0.12);
        tl.fromTo($("wire-" + p), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.65, ease: "power2.inOut" }, 5.25 + p * 0.06);
        var arriveA = sendCopy($("copy-a" + p), p, 5.65 + p * 0.15, 1.0);
        tl.fromTo($("check-" + p), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, arriveA);
      }
      tl.fromTo($("step-1"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 7.05);

      // ================= Scene 4 (8.0–11.5): certificate changes, list rewritten, re-sent; APK untouched =================
      tl.fromTo($("strike"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" }, T_STRIKE);
      tl.to($("strike"), { opacity: 0, duration: 0.1, ease: "none" }, T_BS - 0.02);

      var T_SEND_B = Math.max(T_EDIT_DONE + 0.25, 9.85);
      for (var q = 0; q < 3; q++) {
        var arriveB = sendCopy($("copy-b" + q), q, T_SEND_B + q * 0.12, 0.9);
        tl.set($("copy-a" + q), { opacity: 0 }, arriveB);
        tl.fromTo($("check-" + q), { scale: 0.55 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, arriveB);
      }
      tl.fromTo($("step-2"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 10.15);
      tl.fromTo($("apk"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 10.15);
      tl.fromTo($("apk-label"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 10.55);

      // ================= Scene 5 (11.5–15.0): fallback note, hold =================
      tl.fromTo($("note"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 11.6);

      // pad to full duration (hold)
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
