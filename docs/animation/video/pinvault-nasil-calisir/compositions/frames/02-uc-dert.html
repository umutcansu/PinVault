      var hw = qa('[class~="' + FID + '-hw"]');

          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", immediateRender: true },
          0.1 + i * 0.12

      // ---- One card beat: shell -> title cascade -> lower line (+0.6s) -> ✗ stamp ----
      function cardBeat(slotId, t, stampAt) {
        var slot = byId(slotId);
        // heavy anchor: the card shell whips up from below
        arrive(slot, t, 110, 0.42);
        // title words cascade right behind it (overlapping wave, gaps shrink)

        words.forEach(function (w, i) {
