    <div id="d1-dosya-yukle-note1" class="d1-dosya-yukle-note"><span class="d1-dosya-yukle-mono">plain</span> dışındaki her seçenekte dosya sunucunun diskinde şifreli durur (<span class="d1-dosya-yukle-mono">VAULT_AT_REST_PASSWORD</span>).</div>
    <div id="d1-dosya-yukle-note2" class="d1-dosya-yukle-note">Her yükleme sürümü bir artırır; telefonlar yenisini indirir.</div>

    <!-- analogy strip -->
    <div id="d1-dosya-yukle-analogy">
      <div class="d1-dosya-yukle-alabel">BENZETME</div>
      <div class="d1-dosya-yukle-atext">Arşive bir belge konur: kimin alacağı ve hangi zarfla gönderileceği yazılır.</div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "d1-dosya-yukle";
      var $ = function (n) { return document.getElementById(ID + "-" + n); };
      var tl = gsap.timeline({ paused: true });
      var OUT = "power3.out";
      var INOUT = "power3.inOut";
      var WIPE_FROM = "inset(-20% 100% -20% 0%)";
      var WIPE_TO = "inset(-20% 0% -20% 0%)";
      var INK = "#0F0F0F";
      var CREAM = "#EFE9D9";
      var CREAM2 = "#E4DCC4";

      // split a value into per-letter spans (deterministic, built synchronously)
      function split(el) {
        var txt = el.getAttribute("data-type");
        el.textContent = "";
        var out = [];
        for (var i = 0; i < txt.length; i++) {
          var s = document.createElement("span");
          s.textContent = txt.charAt(i);
          s.style.whiteSpace = "pre";
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }
      function type(chars, at, step) {
        for (var i = 0; i < chars.length; i++) {
          tl.fromTo(chars[i], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.02, ease: "none" }, at + i * step);
        }
      }
      var v1 = split($("v1"));
      var v2 = split($("v2"));
      var v3 = split($("v3"));

      // Scene 1 (0.0–1.8s): kicker, title
      tl.fromTo($("kicker"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.7, ease: OUT }, 0.1);
      tl.fromTo($("title"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: OUT }, 0.35);

      // Scene 2 (1.8–6.0s): panel opens, card title, Anahtar + Dosya fill letter by letter
      tl.fromTo($("panel"), { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: OUT }, 1.8);
      tl.fromTo($("ctitle"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: OUT }, 2.2);
      tl.fromTo([$("tog1"), $("tog2")], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: OUT, stagger: 0.08 }, 2.4);
      tl.fromTo($("crule"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: OUT }, 2.45);
      tl.fromTo(
        [$("l1"), $("b1"), $("l2"), $("b2"), $("l3"), $("b3"), $("l4"), $("b4"), $("btn")],
        { autoAlpha: 0, y: 12 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: OUT, stagger: 0.06 },
        2.6
      );
      type(v1, 3.3, 0.07);   // "saha-ayarlari"  -> ends ~4.2
      type(v2, 4.55, 0.06);  // "saha-ayarlari.json" -> ends ~5.6

      // Scene 3 (6.0–9.5s): Policy fills; Encryption dropdown opens, at_rest is chosen, list closes
      type(v3, 6.0, 0.05);   // "token (önerilen)" -> ends ~6.8
      tl.fromTo($("v4"), { autoAlpha: 0 }, { autoAlpha: 0, duration: 0.01 }, 0);
      tl.fromTo($("dd"), { autoAlpha: 0, clipPath: "inset(0% 0% 100% 0%)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: OUT }, 7.05);
      tl.fromTo($("optsel"), { backgroundColor: CREAM, color: INK }, { backgroundColor: INK, color: CREAM, duration: 0.15, ease: OUT }, 8.35);
      tl.to($("v4"), { autoAlpha: 1, duration: 0.2, ease: OUT }, 8.75);
      tl.to($("dd"), { clipPath: "inset(0% 0% 100% 0%)", duration: 0.4, ease: INOUT }, 8.85);
      tl.set($("dd"), { autoAlpha: 0 }, 9.26);

      // Scene 4 (9.5–12.5s): Yükle pressed, toast, file slides to the depot, lock seal, depot row
      tl.to($("btn"), { scale: 0.92, backgroundColor: INK, color: CREAM, duration: 0.12, ease: OUT }, 9.55);
      tl.to($("btn"), { scale: 1, duration: 0.35, ease: OUT }, 9.67);
      tl.fromTo($("toast"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.5, ease: OUT }, 9.85);
      tl.fromTo($("depot"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: OUT }, 9.8);
      tl.fromTo($("path"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 10.2);
      tl.fromTo($("file"), { autoAlpha: 0, x: -233, y: 122, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: OUT }, 10.35);
      tl.to($("file"), { x: -108, duration: 0.38, ease: INOUT }, 10.6);
      tl.to($("file"), { y: 0, duration: 0.38, ease: INOUT }, 10.98);
      tl.to($("file"), { x: 0, duration: 0.32, ease: INOUT }, 11.36);
      tl.set($("slot"), { borderStyle: "solid", backgroundColor: CREAM2 }, 11.62);
      tl.fromTo(
        $("seal"),
        { autoAlpha: 0, scale: 1.7, rotation: -6, transformOrigin: "50% 50%" },
        { autoAlpha: 1, scale: 1, rotation: -6, duration: 0.35, ease: OUT },
        11.7
      );
      tl.fromTo($("rowtxt"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.6, ease: OUT }, 11.95);

      // Scene 5 (12.5–16.0s): depot note, note 2, analogy, hold
      tl.fromTo($("note1"), { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: OUT }, 12.45);
      tl.fromTo($("note2"), { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: OUT }, 13.55);
      tl.fromTo($("analogy"), { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: OUT }, 14.45);

      // pad to the fixed 16s duration (hold)
      tl.set({}, {}, 16);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
