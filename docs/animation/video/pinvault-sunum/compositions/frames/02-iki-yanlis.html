  <script>
    (function () {
      var ID = "02-iki-yanlis";
      var P = ID + "-";
      function $(s) {
        return document.getElementById(P + s);
      }
      var tl = gsap.timeline({ paused: true });
      var OUT = "power3.out";
      var WIPE_FROM = "inset(-20% 100% -20% 0%)";
      var WIPE_TO = "inset(-20% 0% -20% 0%)";

      function card(n, t) {
        tl.fromTo($("card" + n), { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: OUT }, t);
        tl.fromTo($("w" + n + "t"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.8, ease: OUT }, t + 0.2);
      }
      function strike(n, t) {
        tl.fromTo($("s" + n), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, t);
        tl.fromTo($("x" + n), { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: OUT }, t + 0.3);
        tl.fromTo($("w" + n + "t"), { opacity: 1 }, { opacity: 0.5, duration: 0.4, ease: OUT }, t + 0.4);
      }
      function correct(n, t) {
        tl.fromTo($("sep" + n), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: OUT }, t);
        tl.fromTo($("c" + n), { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: OUT }, t + 0.1);
        tl.fromTo($("r" + n), { autoAlpha: 0, clipPath: WIPE_FROM }, { autoAlpha: 1, clipPath: WIPE_TO, duration: 0.9, ease: OUT }, t + 0.15);
      }

      // Scene 1 (0.0–1.5s): title
      tl.fromTo($("title"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: OUT }, 0.1);

      // Scene 2 (1.5–4.5s): card 1 — wrong line, orange strike, green correct line
      card(1, 1.5);
      strike(1, 2.8);
      correct(1, 3.3);

      // Scene 3 (4.5–8.0s): card 2 — same pattern
      card(2, 4.6);
      strike(2, 5.9);
      correct(2, 6.4);

      // Scene 4 (8.0–13.0s): APK box, four rows ~0.7s apart, then hold
      tl.fromTo($("apk"), { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: OUT }, 8.0);
      [1, 2, 3, 4].forEach(function (i) {
        var t = 8.7 + (i - 1) * 0.7;
        var row = $("row" + i);
        tl.fromTo(row, { autoAlpha: 0, x: 30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: OUT }, t);
        tl.fromTo(row.querySelector("svg"), { scale: 0.6 }, { scale: 1, duration: 0.4, ease: OUT }, t + 0.1);
      });

      // hold to the fixed 13s duration
      tl.set({}, {}, 13);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
