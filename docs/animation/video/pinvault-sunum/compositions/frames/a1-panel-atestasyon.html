      var tl = gsap.timeline({ paused: true });
      var OUT = "power3.out";
      var INOUT = "power3.inOut";
      var WIPE_FROM = "inset(-20% 100% -20% 0%)";
      var WIPE_TO = "inset(-20% 0% -20% 0%)";
      var INK = "#0F0F0F";
      var CREAM = "#EFE9D9";
      var ORANGE = "#E85A1F";
      var YELLOW = "#F5C518";
      var GREY = "rgba(15, 15, 15, 0.35)";

      // Scene 1 (0.0–1.8s): kicker, title
      tl.fromTo($("kicker"), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.7, ease: OUT }, 0.1);
      tl.fromTo($("title"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: OUT }, 0.4);

      // Scene 2 (1.8–4.0s): panel opens, tabs appear, "Attestation" is selected (ink fill)
      tl.fromTo($("panel"), { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: OUT }, 1.8);
      $$("tab").forEach(function (el, i) {
        tl.fromTo(el, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: OUT }, 2.2 + i * 0.12);
      });
      tl.fromTo($("tabsel"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, ease: OUT }, 3.1);
      tl.to($("tab5"), { scale: 0.94, duration: 0.1, ease: "power2.in" }, 3.0);
      tl.to($("tab5"), { scale: 1, duration: 0.35, ease: OUT }, 3.1);
      // the ink overlay covers the base label; match the base text to the overlay (cream) so it never reads ink-on-ink
      tl.fromTo($("tab5"), { color: "#0f0f0f" }, { color: "#efe9d9", duration: 0.01, immediateRender: false }, 3.36);

      // Scene 3 (4.0–9.0s): policy card, badge, preset row, six rows ~0.6s apart, token lifetime field
      tl.fromTo($("card"), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: OUT }, 4.0);
      tl.fromTo($("chead"), { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: OUT }, 4.15);
      tl.fromTo($("preset"), { autoAlpha: 0, x: 16 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: OUT }, 4.5);
      tl.fromTo($("thead"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: OUT }, 4.85);
      var colors = [ORANGE, ORANGE, ORANGE, ORANGE, YELLOW, GREY];
      for (var i = 0; i < 6; i++) {
        var at = 5.2 + i * 0.6;
        tl.fromTo($("r" + i), { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: OUT }, at);
        tl.fromTo($("d" + i), { borderColor: INK }, { borderColor: colors[i], duration: 0.3, ease: OUT }, at + 0.25);
      }
      tl.fromTo($("more"), { autoAlpha: 0 }, { autoAlpha: 0.7, duration: 0.4, ease: OUT }, 8.3);
      tl.fromTo($("field"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: OUT }, 8.45);
      tl.fromTo($("save"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: OUT }, 8.6);

      // Scene 4 (9.0–11.0s): "Politikayı Kaydet" pressed, toast, badge v3 -> v4
      tl.to($("save"), { scale: 0.92, backgroundColor: INK, color: CREAM, duration: 0.12, ease: OUT }, 9.25);
      tl.to($("save"), { scale: 1, duration: 0.35, ease: OUT }, 9.37);
      tl.fromTo($("toast"), { autoAlpha: 0, clipPath: "inset(0% 0% 0% 100%)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: OUT }, 9.55);
      tl.fromTo($("bv3"), { yPercent: 0 }, { yPercent: -100, duration: 0.45, ease: INOUT }, 9.95);
      tl.fromTo($("bv4"), { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: INOUT }, 9.95);

      // Scene 5 (11.0–14.0s): devices card, two rows, ARC underline, drop-down, side note
      tl.fromTo($("dev"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: OUT }, 11.0);
      tl.fromTo($("dr1"), { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: OUT }, 11.3);
      tl.fromTo($("dr2"), { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: OUT }, 11.75);
      tl.fromTo($("uline"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: OUT }, 12.2);
      tl.fromTo($("conn"), { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.25, ease: OUT }, 12.45);
      tl.fromTo($("drop"), { autoAlpha: 0, y: -12 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: OUT }, 12.6);
      tl.fromTo($("rs1"), { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: OUT }, 12.85);
      tl.fromTo($("rs2"), { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: OUT }, 13.05);
      tl.fromTo($("note"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: OUT }, 13.4);

      // Scene 6 (14.0–16.0s): analogy strip, hold
      tl.fromTo($("analogy"), { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: OUT }, 14.0);

      // pad to the fixed 16s duration (hold)
      tl.set({}, {}, 16);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
