    <script>
      (function () {
        var FID = "h2-hsm-kazanc";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };
        var $$ = function (sel) {
          return Array.prototype.slice.call(host.querySelectorAll(sel));
        };

        // code line, split into per-character spans for typing (deterministic, built synchronously)
        var CODE = [
          "sunucu: CONFIG_SIGNERS=hsm,ekip-b ·",
          "uygulama: requiredSignatures(2)"
        ];
        var codeChars = [];
        CODE.forEach(function (line, li) {
          var holder = $("codeline" + (li + 1));
          for (var i = 0; i < line.length; i++) {
            var s = document.createElement("span");
            s.textContent = line.charAt(i);
            holder.appendChild(s);
            codeChars.push(s);
          }
        });

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // ---------- Scene 1 (0.0–1.8): kicker, title ----------
        tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 0.15);
        tl.fromTo($("title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.35);

        // ---------- Scene 2 (1.8–9.0): four benefits, ~1.7 s apart, each with a green check ----------
        var gains = [$("gain1"), $("gain2"), $("gain3"), $("gain4")];
        gains.forEach(function (g, i) {
          var at = 1.8 + i * 1.7;
          var box = g.querySelector(".h2-hsm-kazanc-check");
          var tick = g.querySelector(".h2-hsm-kazanc-tick");
          var txt = g.querySelector(".h2-hsm-kazanc-gaintext");
          tl.fromTo(box, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, at);
          tl.fromTo(tick, { strokeDashoffset: 40 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at + 0.2);
          tl.fromTo(txt, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, at + 0.1);
        });

        // ---------- Scene 3 (9.0–12.0): panel card opens; table head, row 1, "birincil" badge ----------
        tl.fromTo($("panel"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 9.0);
        tl.fromTo($("cardtitle"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: SOFT }, 9.45);
        tl.fromTo($("table"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 9.8);
        tl.fromTo($("thead"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: SOFT }, 9.85);
        tl.fromTo($("row1"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 10.3);
        tl.fromTo($("badge"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 10.9);

        // ---------- Scene 4 (12.0–16.5): limit box (hard shadow), head, body; row 2 joins; code typed ----------
        tl.fromTo($("limit"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 12.0);
        tl.fromTo($("limithead"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: SOFT }, 12.35);
        tl.fromTo($("limitbody"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: SOFT }, 12.7);
        tl.fromTo($("row2"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 13.9);
        tl.fromTo($("code"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 14.3);
        codeChars.forEach(function (ch, i) {
          tl.fromTo(ch, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 14.5 + i * 0.022);
        });

        // ---------- Scene 5 (16.5–19.0): note, hold ----------
        tl.fromTo($("note"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 16.5);
        tl.to({}, { duration: 0.01 }, 18.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
