    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "01-yeni-tablet";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };
        var $$ = function (n) {
          return Array.prototype.slice.call(host.querySelectorAll('[class~="' + FID + "-" + n + '"]'));
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // ---------- Scene 1 (0.0–2.5): line 1 word by word, tablet settles left ----------
        tl.fromTo([$("topbar"), $("footer")], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 0);
        $$("w1").forEach(function (w, i) {
          tl.fromTo(w, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 0.1 + i * 0.14);
        });
        tl.fromTo($("tablet"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 1.0);
        tl.fromTo($("tlabel"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 1.4);

        // ---------- Scene 2 (2.5–4.5): line 2, API box settles right, empty dashed line ----------
        $$("w2").forEach(function (w, i) {
          tl.fromTo(w, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: SOFT }, 2.5 + i * 0.1);
        });
        tl.fromTo($("api"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 3.3);
        tl.fromTo($("wirecover"), { scaleX: 1 }, { scaleX: 0, duration: 0.8, ease: "power2.inOut" }, 3.7);

        // ---------- Scene 3 (4.5–8.0): ten cells settle left to right, 0.3 s apart, each linked to the previous ----------
        var cells = $$("cell");
        var links = $$("link");
        cells.forEach(function (c, i) {
          var at = 4.6 + i * 0.3;
          tl.fromTo(c, { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, at);
          if (i > 0) {
            tl.fromTo(links[i - 1], { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: SOFT }, at + 0.2);
          }
        });

        // ---------- Scene 4 (8.0–10.0): bottom line, hold ----------
        tl.fromTo($("note"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 8.1);
        tl.to({}, { duration: 0.01 }, 9.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
