    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "d5-telefonda";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector("#" + FID + "-" + n);
        };
        var $$ = function (n) {
          return Array.prototype.slice.call(host.querySelectorAll("." + FID + "-" + n));
        };

        // build the typed code line as per-character spans (deterministic, synchronous)
        var call = $("call");
        var code = call.getAttribute("data-code");
        var chars = [];
        for (var c = 0; c < code.length; c++) {
          var s = document.createElement("span");
          s.textContent = code.charAt(c);
          call.appendChild(s);
          chars.push(s);
        }

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // ---------- Scene 1 (0.0–1.8): kicker, title; phone body settles ----------
        tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 0.15);
        tl.fromTo($("phone"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.3);
        tl.fromTo($("title"), { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.45);

        // ---------- Scene 2 (1.8–4.0): file name + "kilitli" on the screen; code line types ----------
        tl.fromTo($("file"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 1.8);
        tl.fromTo($("locked"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: SOFT }, 2.25);
        tl.fromTo($("open"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        $$("bar").forEach(function (b) {
          tl.fromTo(b, { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
        });
        tl.fromTo(call, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: SOFT }, 2.6);
        chars.forEach(function (s, i) {
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2.7 + i * 0.021);
        });

        // ---------- Scene 3 (4.0–7.5): system lock window, fingerprint draws, window closes, unlocked ----------
        var dialog = $("dialog");
        tl.fromTo(dialog, { opacity: 0, scale: 0.9, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: SOFT }, 4.0);
        tl.fromTo($("dtitle"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: SOFT }, 4.15);
        tl.fromTo($("dsub"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: SOFT }, 4.35);
        var ridges = $$("ridge");
        ridges.forEach(function (p, i) {
          tl.fromTo(
            p,
            { attr: { "stroke-dashoffset": 1 } },
            { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" },
            4.75 + i * 0.18
          );
        });
        // recognized: ridges turn green
        tl.fromTo(ridges, { stroke: "#0F0F0F" }, { stroke: "#1F8A4C", duration: 0.25, ease: SOFT }, 5.95);
        // window closes (mid-shot state change, not a frame exit)
        tl.to(dialog, { opacity: 0, scale: 0.94, duration: 0.35, ease: "power2.in" }, 6.4);
        tl.to($("locked"), { opacity: 0, x: -8, duration: 0.25, ease: "power2.in" }, 6.7);
        tl.fromTo($("open"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: SOFT, immediateRender: false }, 6.9);
        $$("bar").forEach(function (b, i) {
          tl.fromTo(b, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: SOFT, immediateRender: false }, 7.0 + i * 0.08);
        });

        // ---------- Scene 4 (7.5–11.0): rule 1 card: title, line, code ----------
        tl.fromTo($("card1"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 7.5);
        tl.fromTo($("c1title"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 7.65);
        tl.fromTo($("c1icon"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 7.8);
        tl.fromTo($("c1line"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 8.2);
        tl.fromTo($("c1code"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 9.8);

        // ---------- Scene 5 (11.0–15.0): rule 2 card; note; hold ----------
        tl.fromTo($("card2"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 11.0);
        tl.fromTo($("c2title"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 11.15);
        tl.fromTo($("c2icon"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 11.3);
        tl.fromTo($("c2line"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 11.6);
        tl.fromTo($("c2code"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 12.5);
        tl.fromTo($("note"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 13.4);
        tl.to({}, { duration: 0.01 }, 14.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
