    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "f1-fabrika";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var TRAVEL = "power2.inOut";
        var INK = "#0F0F0F";
        var GREEN = "#1F8A4C";
        var YELLOW = "#F5C518";
        var PINK = "#F06CA8";

        // ---------- helpers ----------
        function appear(el, p, t, fi) {
          tl.fromTo(
            el,
            { xPercent: -50, yPercent: -50, x: p[0], y: p[1], opacity: 0, scale: 0.8 },
            { xPercent: -50, yPercent: -50, x: p[0], y: p[1], opacity: 1, scale: 1, duration: fi, ease: SOFT },
            t
          );
        }
        // constant-speed ride along a belt polyline, one power2.inOut ease over the whole ride
        function move(el, pts, t, dur) {
          var acc = [0];
          var total = 0;
          for (var i = 1; i < pts.length; i++) {
            total += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
            acc.push(total);
          }
          var kf = { easeEach: "none" };
          for (var j = 0; j < pts.length; j++) {
            kf[((acc[j] / total) * 100).toFixed(2) + "%"] = { x: pts[j][0], y: pts[j][1] };
          }
          tl.to(el, { keyframes: kf, duration: dur, ease: TRAVEL }, t);
        }
        function fade(el, t, fo) {
          tl.to(el, { opacity: 0, scale: 0.7, duration: fo, ease: "power2.in" }, t);
        }
        function trip(n, pts, t, dur, fi, fo) {
          var el = $(n);
          fi = fi || 0.3;
          appear(el, pts[0], t, fi);
          move(el, pts, t + fi, dur);
          fade(el, t + fi + dur, fo || 0.25);
          return t + fi + dur;
        }
        function hl(names, color, t) {
          names.forEach(function (n) {
            tl.to($(n), { borderColor: color, duration: 0.3, ease: SOFT }, t);
          });
        }
        function rise(n, t, toOpacity) {
          tl.fromTo($(n), { opacity: 0, y: 16 }, { opacity: toOpacity || 1, y: 0, duration: 0.6, ease: SOFT }, t);
        }
        function lineIn(i, t) {
          tl.fromTo($("line" + i), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, t);
        }

        // belt routes (packet centres)
        var TOP = [[216, 228], [216, 186], [1672, 186], [1672, 276]];
        var TOP_BACK = [[1672, 276], [1672, 186], [216, 186], [216, 228]];
        var DEPO_TO_PHONE = [[712, 555], [690, 555], [690, 422], [400, 422]];
        var ADMIN_TO_DEPO = [[930, 716], [930, 596]];

        // ---------- Scene 0 (0.0–4.0): the map builds left to right ----------
        rise("phone", 0.2);
        tl.fromTo($("belts"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 3.0, ease: "power1.inOut" }, 0.5);
        rise("p91", 0.8);
        rise("p92", 0.9);
        rise("p93", 1.0, 0.45);
        rise("server", 1.1);
        rise("ca", 1.4);
        rise("hsm", 1.7);
        rise("depo", 2.0);
        rise("p90", 2.3);
        rise("admin", 2.6);
        rise("msglabel", 2.9);
        rise("api", 3.2);
        rise("capbar", 3.4);

        // ---------- chain strip + caption swaps ----------
        var STEPS = [4.0, 9.0, 13.5, 19.0, 23.0, 27.0, 32.0, 37.0, 42.0, 47.0, 53.0];
        for (var k = 0; k < 10; k++) {
          tl.fromTo($("cur" + k), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: SOFT }, STEPS[k] + 0.1);
          tl.to($("cur" + k), { opacity: 0, duration: 0.4, ease: SOFT }, STEPS[k + 1]);
          tl.fromTo($("done" + k), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: SOFT }, STEPS[k + 1]);
          if (k > 0) {
            tl.fromTo($("link" + (k - 1)), { opacity: 0.35 }, { opacity: 1, duration: 0.4, ease: SOFT }, STEPS[k] + 0.1);
            tl.to($("underline"), { x: k * 174, duration: 0.5, ease: "power3.inOut" }, STEPS[k] + 0.1);
          }
        }
        tl.fromTo($("underline"), { scaleX: 0, x: 0, opacity: 1 }, { scaleX: 1, x: 0, opacity: 1, duration: 0.6, ease: SOFT }, 4.1);
        tl.to($("underline"), { opacity: 0, duration: 0.4, ease: SOFT }, 53.0);

        var CAPS = [4.0, 9.0, 13.5, 19.0, 23.0, 27.0, 32.0, 37.0, 42.0, 47.0, 53.0, 59.0, 65.0, 72.0];
        for (var c = 0; c < CAPS.length; c++) {
          tl.fromTo($("cap" + c), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, CAPS[c] + 0.1);
          if (c > 0) {
            tl.to($("cap" + (c - 1)), { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, CAPS[c] - 0.15);
          }
        }

        // ---------- Scene 1 (4.0–9.0): server starts; three machines come alive ----------
        hl(["ca"], GREEN, 4.4);
        hl(["hsm"], GREEN, 5.0);
        tl.fromTo($("lock"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 5.3);
        hl(["depo"], GREEN, 5.6);
        hl(["ca", "hsm", "depo"], INK, 8.4);

        // ---------- Scene 2 (9.0–13.5): APK drops into the phone ----------
        hl(["phone"], GREEN, 9.4);
        trip("apk", [[216, 196], [216, 349]], 9.5, 1.1);
        lineIn(0, 11.0);
        hl(["phone"], INK, 13.0);

        // ---------- Scene 3 (13.5–19.0): host enters the store; the list gets sealed ----------
        hl(["admin"], YELLOW, 13.8);
        trip("host3", ADMIN_TO_DEPO, 14.1, 1.2);
        hl(["p90"], YELLOW, 14.7);
        hl(["depo"], YELLOW, 15.4);
        hl(["hsm"], YELLOW, 15.9);
        appear($("stamp"), [1050, 445], 16.1, 0.3);
        move($("stamp"), [[1050, 445], [1108, 538]], 16.4, 0.8);
        tl.to($("stamp"), { rotation: -6, duration: 0.3, ease: SOFT }, 17.2);
        hl(["admin", "p90", "depo", "hsm"], INK, 18.6);

        // ---------- Scene 4 (19.0–23.0): token appears beside the admin ----------
        hl(["admin"], YELLOW, 19.3);
        appear($("token"), [760, 742], 19.6, 0.4);
        hl(["admin"], INK, 22.6);

        // ---------- Scene 5 (23.0–27.0): token rides the message belt to the phone ----------
        hl(["admin"], YELLOW, 23.2);
        move($("token"), [[760, 742], [216, 742], [216, 704]], 23.5, 1.5);
        hl(["phone"], YELLOW, 24.8);
        fade($("token"), 25.0, 0.25);
        hl(["admin", "phone"], INK, 26.6);

        // ---------- Scene 6 (27.0–32.0): enrolment request to 8091 ----------
        hl(["phone"], GREEN, 27.3);
        appear($("kayit"), [392, 312], 27.5, 0.3);
        move($("kayit"), [[392, 312], [494, 312]], 27.8, 1.0);
        hl(["p91"], GREEN, 28.6);
        hl(["phone"], INK, 31.0);

        // ---------- Scene 7 (32.0–37.0): CA signs; token spent; card returns ----------
        move($("kayit"), [[494, 312], [690, 312], [690, 335], [712, 335]], 32.3, 1.1);
        hl(["ca"], PINK, 33.2);
        tl.to($("kayittok"), { backgroundColor: "#2A2A2A", opacity: 0.35, duration: 0.4, ease: SOFT }, 33.6);
        fade($("kayit"), 34.2, 0.25);
        trip("card7", [[712, 335], [690, 335], [690, 312], [392, 312]], 34.4, 1.3);
        hl(["phone"], PINK, 35.7);
        lineIn(1, 36.1);
        appear($("cardpark"), [420, 640], 36.1, 0.5);
        hl(["ca", "p91", "phone"], INK, 36.6);

        // ---------- Scene 8 (37.0–42.0): card to 8092; signed list returns ----------
        hl(["phone"], PINK, 37.2);
        trip("card8", [[392, 422], [560, 422]], 37.4, 1.0);
        hl(["p92"], GREEN, 38.5);
        hl(["depo"], GREEN, 38.9);
        trip("list8", DEPO_TO_PHONE, 39.1, 1.4);
        hl(["phone"], GREEN, 40.6);
