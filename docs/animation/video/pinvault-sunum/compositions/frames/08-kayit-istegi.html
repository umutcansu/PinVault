        var FID = "08-kayit-istegi";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };
        var $$ = function (n) {
          return Array.prototype.slice.call(host.querySelectorAll('[class~="' + FID + "-" + n + '"]'));
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var TRAVEL = "power3.inOut";
        var INK = "#0F0F0F";
        var CREAM = "#EFE9D9";
        var GREEN = "#1F8A4C";

        // ---------- Scene 1 (0.0–1.5): chain cell settles, kicker, title; phone on stage ----------
        tl.fromTo($("cur"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("curline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("phone"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.05);
        tl.fromTo($("kicker"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 0.25);
        tl.fromTo($("title"), { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.5);

        // ---------- Scene 2 (1.5–4.0): vault under the phone, key drawn, labels ----------
        tl.fromTo($("vault"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: SOFT }, 1.5);
        tl.fromTo($("keybow"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 1.85);
        tl.fromTo($("keyshaft"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, 2.2);
        tl.fromTo($("vlabel"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 2.05);
        tl.fromTo($("vbody"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 2.85);

        // ---------- Scene 3 (4.0–6.0): server + 8091, wire, cert card rides to the pin, green check ----------
        tl.fromTo($("server"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 4.0);
        tl.fromTo([$("p90"), $("p92"), $("p93")], { opacity: 0 }, { opacity: 0.45, duration: 0.5, ease: SOFT, stagger: 0.05 }, 4.15);
        tl.fromTo($("p91"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 4.2);
        tl.fromTo($("wirepath"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, 4.35);
        tl.fromTo($("arrow"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: SOFT }, 4.85);
        // cert card: emerges at the port (center 1330,629), rides left, rises to the pin box (center 245,440)
        tl.fromTo($("cert"), { opacity: 0, x: 60, y: 0, scale: 1 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.3, ease: SOFT }, 4.85);
        tl.to(
          $("cert"),
          {
            keyframes: {
              "0%": { x: 0, y: 0, scale: 1 },
              "72%": { x: -880, y: 0, scale: 1 },
              "100%": { x: -1085, y: -189, scale: 0.75 },
              easeEach: "none",
            },
            duration: 0.75,
            ease: "power2.inOut",
          },
          5.05
        );
        tl.to($("cert"), { opacity: 0, scale: 0.5, duration: 0.2, ease: SOFT }, 5.8);
        tl.fromTo($("pin"), { borderColor: INK }, { borderColor: GREEN, duration: 0.2, ease: SOFT }, 5.8);
        tl.fromTo($("pinok"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: SOFT }, 5.85);
        tl.fromTo($("linklabel"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 5.95);

        // ---------- Scene 4 (6.0–11.0): packet card opens on the wire, rows every 0.8s, slides to 8091 ----------
        tl.fromTo($("pkt"), { opacity: 0, scaleY: 0.04, x: 0 }, { opacity: 1, scaleY: 1, x: 0, duration: 0.5, ease: SOFT }, 6.2);
        tl.fromTo($("pkthead"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 6.45);
        $$("row").forEach(function (row, i) {
          tl.fromTo(row, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 7.0 + i * 0.8);
        });
        tl.to($("pkt"), { x: 219, duration: 0.6, ease: TRAVEL }, 10.55);
        // 8091 "takes" the packet: brief press, ink fill
        tl.fromTo($("p91"), { scale: 1, backgroundColor: CREAM, color: INK }, { scale: 0.88, backgroundColor: INK, color: CREAM, duration: 0.12, ease: "power2.out" }, 11.1);
        tl.to($("p91"), { scale: 1, duration: 0.22, ease: SOFT }, 11.22);

        // ---------- Scene 5 (11.0–15.0): what never leaves, vault door shuts, analogy, hold ----------
        tl.fromTo($("nogo"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 11.15);
        tl.fromTo($("door"), { scaleX: 0.08 }, { scaleX: 1, duration: 0.55, ease: TRAVEL }, 11.85);
        tl.fromTo($("vshadow"), { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: 16, y: 16, duration: 0.35, ease: SOFT }, 12.3);
        tl.fromTo($("benz"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 12.3);
        tl.to({}, { duration: 0.01 }, 14.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
