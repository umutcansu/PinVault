    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "03-kurulum";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // type a value letter by letter (one span per character, revealed in order)
        function typeIn(el, start, per) {
          var chars = Array.from(el.textContent);
          el.textContent = "";
          chars.forEach(function (c, i) {
            var s = document.createElement("span");
            s.textContent = c;
            el.appendChild(s);
            tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, start + i * per);
          });
          return start + chars.length * per;
        }

        // ---------- Scene 1 (0.0–1.5): strip already standing; current link settles; kicker, title ----------
        tl.fromTo($("current"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 0.3);
        tl.fromTo($("title"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.6);

        // ---------- Scene 2 (1.5–4.0): server box settles, ports, line 1 ----------
        tl.fromTo($("server"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 1.5);
        ["p1", "p2", "p3", "p4"].forEach(function (p, i) {
          tl.fromTo($(p), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 1.9 + i * 0.1);
        });
        tl.fromTo($("line1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 2.5);

        // ---------- Scene 3 (4.0–8.0): files come out of the server box, ~0.8 s apart ----------
        tl.fromTo($("fileshead"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 4.0);
        var BODY_Y = 440; // square starts here, hidden behind the opaque server body
        var sqTops = [643, 685, 727, 769];
        [1, 2, 3, 4].forEach(function (n, i) {
          var at = 4.6 + i * 0.8;
          tl.fromTo(
            $("sq" + n),
            { y: BODY_Y - sqTops[i], opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: SOFT },
            at
          );
          tl.fromTo($("f" + n), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, at + 0.35);
        });

        // ---------- Scene 4 (8.0–12.0): panel opens, fields typed, Kaydet pressed, note ----------
        tl.fromTo($("panel"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 8.0);
        tl.fromTo($("l1"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 8.4);
        typeIn($("v1"), 8.75, 0.04);
        tl.fromTo($("l2"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 9.4);
        typeIn($("v2"), 9.7, 0.024);
        tl.fromTo($("btn"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 8.4);
        tl.fromTo($("btn"), { scale: 1 }, { scale: 0.92, duration: 0.1, ease: "power2.in" }, 11.0);
        tl.fromTo($("btnfill"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 11.05);
        tl.to($("btn"), { scale: 1, duration: 0.4, ease: SOFT }, 11.1);
        tl.fromTo($("note"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 11.4);

        // ---------- Scene 5 (12.0–15.0): analogy strip, footnote, hold ----------
        tl.fromTo($("analogy"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: SOFT }, 12.0);
        tl.fromTo($("footnote"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: SOFT }, 12.8);
        tl.to({}, { duration: 0.01 }, 14.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
