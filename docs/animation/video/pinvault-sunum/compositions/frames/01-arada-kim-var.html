      var tl = gsap.timeline({ paused: true });

      // Content-aware word pacing (dynamic-content-sequencing): each word's window is

      function sequence(els, t0, base, perChar) {
        var cumulative = t0;
        return els.map(function (el) {
          var start = cumulative;
          cumulative += base + el.textContent.trim().length * perChar;
          return { el: el, start: start };
        });

      function revealWords(plan) {
        plan.forEach(function (p) {
          tl.fromTo(
            p.el,
            { opacity: 0, y: 34 },
            { opacity: 1, y: 0, duration: 0.55, ease: EASE },
            p.start

      // ---------- Scene 1 (0.0-2.2): line 1 word by word, strip below, wire draws ----------
