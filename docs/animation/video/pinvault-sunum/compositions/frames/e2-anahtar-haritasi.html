    <script>
      (function () {
        var FID = "e2-anahtar-haritasi";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };
        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // ---------- Scene 1 (0.0–1.8): title ----------
        tl.fromTo($("title"), { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.15);

        // ---------- Scene 2 (1.8–3.0): empty ledger + ink head row ----------
        tl.fromTo($("table"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 1.8);
        tl.fromTo($("head"), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 2.15);

        // ---------- Scene 3 (3.0–12.5): seven rows, ~1.3 s apart, top to bottom ----------
        for (var i = 1; i <= 7; i++) {
          tl.fromTo(
            $("r" + i),
            { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.6, ease: SOFT },
            3.0 + (i - 1) * 1.3
          );
        }

        // ---------- Scene 4 (12.5–15.0): EC P-256 cells take a pink edge in turn ----------
        for (var k = 1; k <= 4; k++) {
          var at = 12.5 + (k - 1) * 0.5;
          var edge = $("e" + k);
          tl.fromTo(edge, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.45, ease: SOFT }, at);
          // short emphasis, then settle to a quieter edge that stays
          tl.to(edge, { opacity: 0.55, duration: 0.6, ease: "power2.out" }, at + 0.6);
        }

        // ---------- Scene 5 (15.0–18.0): bottom note, hold ----------
        tl.fromTo($("note"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: SOFT }, 15.0);
        tl.to({}, { duration: 0.01 }, 17.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
