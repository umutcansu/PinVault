    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "10-pin-listesi";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };
        var $$ = function (n) {
          return Array.prototype.slice.call(host.querySelectorAll('[class~="' + FID + "-" + n + '"]'));
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var TRAVEL = "power3.inOut";

        var stepIn = function (n, at) {
          tl.fromTo($("s" + n), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.55, ease: SOFT }, at);
        };
        var okIn = function (el, at) {
          tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: SOFT }, at);
        };

        // ---------- Scene 1 (0.0–1.5): chain (already standing), current cell settles, kicker, title ----------
        tl.fromTo($("current"), { opacity: 0.35 }, { opacity: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: SOFT }, 0.2);
        tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 0.2);
        tl.fromTo($("title"), { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 0.4);
        // the actors take their places quietly
        tl.fromTo($("phone"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 1.0);
        tl.fromTo($("card"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 1.2);
        tl.fromTo($("server"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: SOFT }, 1.2);

        // ---------- Scene 2 (1.5–4.0): rail head, step 1 + check ("vakti gelmedi") ----------
        tl.fromTo($("rail"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 1.6);
        stepIn(1, 2.3);
        okIn($("s1ok"), 3.2);
        tl.fromTo($("s1note"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 3.3);

        // ---------- Scene 3 (4.0–7.0): step 2, line to 8092, card goes and returns, server cert comes, label ----------
        stepIn(2, 4.0);
        tl.fromTo(
          $("wirepath"),
          { attr: { "stroke-dashoffset": 546 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" },
          4.4
        );
        tl.to($("card"), { x: 312, duration: 0.55, ease: TRAVEL }, 5.0);
        tl.fromTo($("p8092"), { scale: 1 }, { scale: 0.9, duration: 0.12, ease: "power2.out" }, 5.5);
        tl.to($("p8092"), { scale: 1, duration: 0.25, ease: SOFT }, 5.62);
        tl.to($("card"), { x: 0, duration: 0.55, ease: TRAVEL }, 5.65);
        tl.fromTo($("cert"), { x: 530 }, { x: 0, duration: 0.65, ease: TRAVEL }, 5.95);
        tl.fromTo($("conn"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: SOFT }, 6.45);
        okIn($("s2ok"), 6.75);

        // ---------- Scene 4 (7.0–11.0): signed list slides from 8092 to the phone, step 3, green edges ----------
        tl.fromTo($("list"), { x: 300 }, { x: 0, duration: 1.1, ease: TRAVEL }, 7.0);
        tl.fromTo($("list"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 7.0);
        stepIn(3, 8.3);
        tl.fromTo($("expedge"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: SOFT }, 9.3);
        tl.fromTo($("seal"), { borderColor: "#0F0F0F" }, { borderColor: "#1F8A4C", duration: 0.4, ease: SOFT }, 9.45);
        okIn($("s3ok"), 9.8);

        // ---------- Scene 5 (11.0–15.0): step 4 -> pinned in the phone, step 5 health ping, analogy, hold ----------
        stepIn(4, 11.0);
        tl.fromTo($("pinned"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: SOFT }, 11.35);
        okIn($("s4ok"), 11.75);
        stepIn(5, 12.0);
        tl.fromTo($("ping"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 12.25);
        tl.to(
          $("ping"),
          {
            keyframes: { "0%": { x: 0 }, "50%": { x: 544 }, "100%": { x: 0 }, easeEach: "power2.inOut" },
            duration: 0.75,
            ease: "none",
          },
          12.3
        );
        okIn($("s5ok"), 13.05);
        tl.fromTo($("analogy"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 13.2);
        tl.to({}, { duration: 0.01 }, 14.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
