        tl.fromTo($("o1"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: SOFT }, 2.0);

        tl.fromTo($("code"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: SOFT }, 6.5);

        tl.fromTo($("note"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 9.9);
