    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      (function () {
        var FID = "01-giris";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";

        // reveal a display line word by word (one inline-block span per word)
        function words(el, start, per) {
          var parts = el.textContent.split(" ");
          el.textContent = "";
          parts.forEach(function (w, i) {
            var s = document.createElement("span");
            s.className = FID + "-word";
            s.textContent = w;
            el.appendChild(s);
            tl.fromTo(s, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: SOFT }, start + i * per);
          });
          return start + parts.length * per;
        }

        // ---------- Scene 1 (0.0–2.5): line 1 word by word; panel settles, menu rows top to bottom ----------
        words($("t1"), 0.3, 0.35);
        tl.fromTo($("panel"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 0.8);
        ["m1", "m2", "m3", "m4", "m5"].forEach(function (m, i) {
          tl.fromTo($(m), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: SOFT }, 1.3 + i * 0.18);
        });
        tl.fromTo($("ph1"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: SOFT }, 1.5);
        tl.fromTo($("ph2"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: SOFT }, 1.7);

        // ---------- Scene 2 (2.5–4.5): line 2; "Setup Wizard" row is pressed and turns ink ----------
        words($("t2"), 2.6, 0.35);
        tl.fromTo($("m2"), { scale: 1 }, { scale: 0.92, duration: 0.1, ease: "power2.in" }, 3.7);
        tl.fromTo($("m2fill"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 3.75);
        tl.to($("m2"), { scale: 1, duration: 0.4, ease: SOFT }, 3.8);

        // ---------- Scene 3 (4.5–7.5): four large cells left to right, each linked to the previous one ----------
        var cellAt = [4.5, 5.1, 5.7, 6.3];
        ["c1", "c2", "c3", "c4"].forEach(function (c, i) {
          tl.fromTo($(c), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, cellAt[i]);
        });
        ["k1", "k2", "k3"].forEach(function (k, i) {
          tl.fromTo($(k), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, cellAt[i + 1] - 0.3);
        });

        // ---------- Scene 4 (7.5–10.0): bottom line, two sentences, hold ----------
        tl.fromTo($("b1"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 7.5);
        tl.fromTo($("b2"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SOFT }, 8.9);
        tl.to({}, { duration: 0.01 }, 10.49);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>

</template>
