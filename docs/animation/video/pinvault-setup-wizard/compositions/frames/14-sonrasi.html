      [id="14-sonrasi-btnlabel"] {

      /* station 4: two admins */

        position: absolute;
        left: 18px;

      }
      [class~="14-sonrasi-admin"] {

      /* ---------- NEDEN strip ---------- */

        position: absolute;
        left: 96px;

        display: flex;

        font-size: 20px;

        align-items: center;
        padding: 0 16px;
      }
      [id="14-sonrasi-ntext"] {
        font-family: "Space Grotesk", sans-serif;
        font-size: 22px;
        line-height: 1.2;
        display: flex;
        align-items: center;
        padding: 0 22px;
        white-space: nowrap;
      }
    </style>

      <div class="14-sonrasi-link" style="left: 928px"></div>

      <div id="14-sonrasi-stop1" class="14-sonrasi-stop" style="left: 241px"></div>
      <div id="14-sonrasi-stop2" class="14-sonrasi-stop" style="left: 593px"></div>
      <div id="14-sonrasi-stop3" class="14-sonrasi-stop" style="left: 945px"></div>
      <div id="14-sonrasi-stop4" class="14-sonrasi-stop" style="left: 1297px"></div>
      <div id="14-sonrasi-stop5" class="14-sonrasi-stop" style="left: 1649px"></div>
      <div id="14-sonrasi-tick1" class="14-sonrasi-tick" style="left: 254px"></div>
      <div id="14-sonrasi-tick2" class="14-sonrasi-tick" style="left: 606px"></div>
      <div id="14-sonrasi-tick3" class="14-sonrasi-tick" style="left: 958px"></div>
      <div id="14-sonrasi-tick4" class="14-sonrasi-tick" style="left: 1310px"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      (function () {
        var FID = "14-sonrasi";
        var host = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        var $ = function (n) {
          return host.querySelector('[id="' + FID + "-" + n + '"]');
        };

        var tl = gsap.timeline({ paused: true });
        var SOFT = "power3.out";
        var INOUT = "power3.inOut";
        var WIPE_FROM = "inset(-10% 100% -10% 0%)";
        var WIPE_TO = "inset(-10% 0% -10% 0%)";

        // station i (1..5): marker settles, connector grows, card comes, title, then the text 0.4 s later
        var station = function (i, t) {
          tl.fromTo($("stop" + i), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: SOFT }, t);
          tl.fromTo($("tick" + i), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: SOFT }, t + 0.1);
          tl.fromTo($("card" + i), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, t + 0.15);
          tl.fromTo($("ctitle" + i), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: SOFT }, t + 0.3);
          tl.fromTo($("body" + i), { clipPath: WIPE_FROM }, { clipPath: WIPE_TO, duration: 0.9, ease: SOFT }, t + 0.7);
        };

        // ---------- Scene 1 (0.0–1.5): strip already standing (all done); title; the time rail draws left to right ----------
        tl.fromTo($("title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 0.2);
        tl.fromTo($("rail"), { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: INOUT }, 0.4);

        // ---------- Scene 2 (1.5–11.5): five stations, 2.0 s apart ----------
        // station 1 (1.5): the yellow WARNING badge blinks once
        station(1, 1.5);
        tl.fromTo($("badge"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: SOFT }, 2.7);
        tl.to($("badge"), { opacity: 0.2, duration: 0.18, ease: "power2.inOut" }, 3.05);
        tl.to($("badge"), { opacity: 1, duration: 0.25, ease: SOFT }, 3.23);

        // station 2 (3.5): the small ink button "Restore" is pressed
        station(2, 3.5);
        tl.fromTo($("btn"), { scale: 1 }, { scale: 0.92, duration: 0.1, ease: "power2.out" }, 4.9);
        tl.fromTo($("btnfill"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 4.95);
        tl.to($("btnlabel"), { color: "#EFE9D9", duration: 0.12, ease: "power2.out" }, 4.95);
        tl.to($("btn"), { scale: 1, duration: 0.3, ease: SOFT }, 5.0);

        // station 3 (5.5)
        station(3, 5.5);

        // station 4 (7.5): two ink circles come side by side
        station(4, 7.5);
        tl.fromTo($("adminA"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 8.6);
        tl.fromTo($("adminB"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: SOFT }, 8.85);

        // station 5 (9.5)
        station(5, 9.5);

        // ---------- Scene 3 (11.5–15.0): NEDEN strip, hold ----------
        tl.fromTo($("neden"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 11.8);
        tl.to({}, { duration: 0.01 }, 14.99);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
