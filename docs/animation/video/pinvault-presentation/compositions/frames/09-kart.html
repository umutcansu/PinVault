      <div id="09-kart-antxt">The front desk burns the invitation code and prints a photo ID card.</div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "09-kart";
      function $(s) {
        return document.getElementById(ID + "-" + s);
      }
      var tl = gsap.timeline({ paused: true });
      var OUT = "power3.out";
      var INOUT = "power3.inOut";
      var GREEN = "#1F8A4C";

      // ---------- Scene 1 (0.0–1.5s): chain cell settles, kicker, title ----------
      tl.fromTo($("cur"), { opacity: 0.35, borderWidth: 2 }, { opacity: 1, borderWidth: 4, duration: 0.6, ease: OUT }, 0.2);
      tl.fromTo($("cur-line"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: OUT }, 0.2);
      tl.fromTo($("kicker"), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: OUT }, 0.15);
      tl.fromTo($("title"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: OUT }, 0.35);

      // ---------- Scene 2 (1.5–6.0s): checklist, five checks ~0.8s apart ----------
      tl.fromTo($("chkhead"), { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: OUT }, 1.5);
      tl.fromTo($("server"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: OUT }, 1.6);
      tl.fromTo($("phone"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: OUT }, 1.75);
      tl.fromTo($("seal"), { autoAlpha: 0 }, { autoAlpha: 0.35, duration: 0.5, ease: OUT }, 1.9);
      for (var i = 1; i <= 5; i++) {
        var t = 2.0 + (i - 1) * 0.8;
        tl.fromTo($("row" + i), { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: OUT }, t);
        tl.fromTo($("box" + i), { backgroundColor: "#EFE9D9" }, { backgroundColor: GREEN, duration: 0.25, ease: OUT }, t + 0.35);
        tl.fromTo($("tick" + i), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.42);
      }

      // ---------- Scene 3 (6.0–8.5s): spend line; panel token row flips to "Used" ----------
      tl.fromTo($("spend"), { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: OUT }, 6.0);
      tl.fromTo($("panel"), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: OUT }, 6.5);
      tl.fromTo($("caret"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.1 }, 7.2);
      var olds = $("status").querySelectorAll('[class~="09-kart-old"]');
      var news = $("status").querySelectorAll('[class~="09-kart-new"]');
      for (var o = olds.length - 1, k = 0; o >= 0; o--, k++) {
        tl.set(olds[o], { display: "none" }, 7.35 + k * 0.045);
      }
      for (var n = 0; n < news.length; n++) {
        tl.set(news[n], { display: "inline" }, 7.85 + n * 0.05);
      }
      tl.to($("caret"), { autoAlpha: 0, duration: 0.1 }, 8.45);
      tl.fromTo($("strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: OUT }, 7.35);
      tl.to($("tok"), { opacity: 0.45, duration: 0.4, ease: OUT }, 7.6);

      // ---------- Scene 4 (8.5–12.0s): pink card is printed at the server, slides to the phone ----------
      tl.to($("seal"), { opacity: 1, duration: 0.2, ease: OUT }, 8.5);
      tl.fromTo($("seal"), { scale: 1.25 }, { scale: 1, duration: 0.35, ease: OUT, immediateRender: false }, 8.5);
      tl.fromTo(
        $("card"),
        { autoAlpha: 0, x: -206, y: 30, scale: 0.6 },
        { autoAlpha: 1, x: -206, y: 0, scale: 1, duration: 0.6, ease: OUT },
        8.75
      );
      tl.fromTo($("path"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 9.35);
      tl.to($("card"), { x: 0, duration: 0.85, ease: INOUT }, 9.7);
      tl.fromTo($("key"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: OUT }, 10.3);
      tl.fromTo($("phok"), { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: OUT }, 10.6);
      tl.fromTo($("phtick"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 10.75);
      tl.fromTo($("note"), { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: OUT }, 10.7);

      // ---------- Scene 5 (12.0–15.0s): closing line, analogy strip, hold ----------
      tl.fromTo(
        $("final"),
        { clipPath: "inset(-20% 100% -20% 0%)" },
        { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.8, ease: OUT },
        12.0
      );
      tl.fromTo($("analogy"), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: OUT }, 12.8);

      tl.set({}, {}, 15);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
