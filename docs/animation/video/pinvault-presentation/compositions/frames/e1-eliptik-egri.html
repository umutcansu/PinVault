        // ---------- Scene 2 (1.8–4.5): phone, vault below it, pink key label inside ----------
        tl.fromTo($("phone"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: SOFT }, 1.8);
        tl.fromTo($("conn"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: SOFT }, 2.25);
        tl.fromTo($("vault"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 2.4);
        tl.fromTo($("key"), { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.55, ease: SOFT }, 3.35);
        tl.fromTo($("keybow"), DRAW_FROM, draw(0.35), 3.5);
        tl.fromTo($("keyshaft"), DRAW_FROM, draw(0.4), 3.8);

        // ---------- Scene 3 (4.5–9.0): heading; RSA bar grows long, EC bar settles short ----------
        tl.fromTo($("cmphead"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: SOFT }, 4.5);

        tl.fromTo($("cmpbody"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: SOFT }, 7.2);

        var wires = $$("wire");
        var oks = $$("ok");
        for (var i = 0; i < 4; i++) {

          tl.fromTo(wires[i], DRAW_FROM, draw(0.5), t);
