# PinVault iOS örnek uygulaması (XcodeGen). sample-client'ın (Android) karşılığı.
#
#   xcodegen generate
#   SAMPLE_HOST_PROPS=<dosya> xcodebuild -project SampleClient.xcodeproj -scheme SampleClient \
#     -configuration Debug|E2E|Release -sdk iphonesimulator \
#     -destination 'platform=iOS Simulator,id=<udid>' build
#
# Üç yapılandırma (Android'in derleme türleri):
#   Debug   : geliştirme. Test kontrolleri açık (TEST_CONTROLS), teşhis log'ları.
#   E2E     : Release'in aynısı (-O, whole module) + test kontrolleri ve teşhis log'ları.
#             Uçtan uca testler (sample-e2e, E2E_PLATFORM=ios) bunu kurar.
#   Release : telefona giden derleme. Test kontrolü yok; demo host değerleriyle
#             derlenmez (scripts/gen-host-config.sh → Release kapısı).
#
# Test kontrolleri (Ayarlar ve Depolama ekranları, mod seçimi, otomatik kayıt, elle
# P12, E2E denetim kanalı) Sources/TestControls altında `#if TEST_CONTROLS` içinde
# durur; Release'te derlenmezler. PinVaultE2E ürünü yalnızca Debug ve E2E'de bağlanır
# (aşağıda OTHER_LDFLAGS): Release ikilisinde E2E kodu yoktur.
#
# İmza: ad-hoc ("-"). Simülatör imzasız uygulamada Keychain'i -34018 ile reddeder.
name: SampleClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: tr
configs:
  Debug: debug
  E2E: release
  Release: release
packages:
  PinVault:
    path: ..
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
targets:
  SampleClient:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/TestControls
      - path: Sources/Release
      # gen-host-config.sh üretir (git'e girmez); ilk derlemeden önce yoksa da projede durur.
      - path: Sources/Generated/SampleHostConfig.swift
        optional: true
        group: Sources/Generated
    dependencies:
      - package: PinVault
        product: PinVault
      # Yalnızca derlenir; bağlama Debug/E2E'de OTHER_LDFLAGS ile (Release'te hiç).
      - package: PinVault
        product: PinVaultE2E
        link: false
    preBuildScripts:
      - name: "Host değerleri (gen-host-config.sh)"
        script: |
          "${SRCROOT}/scripts/gen-host-config.sh" "${SAMPLE_HOST_PROPS:-${SRCROOT}/sample-host.properties}" "${SRCROOT}/Sources/Generated/SampleHostConfig.swift"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(SRCROOT)/Sources/Generated/SampleHostConfig.swift
    settings:
      base:
        PRODUCT_NAME: SampleClient
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sampleclient
        INFOPLIST_FILE: Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        # Betik props dosyasını herhangi bir yoldan okur (SAMPLE_HOST_PROPS).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TEST_CONTROLS DIAGNOSTIC_LOGS
          OTHER_LDFLAGS: $(inherited) $(BUILT_PRODUCTS_DIR)/PinVaultE2E.o
        E2E:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: TEST_CONTROLS DIAGNOSTIC_LOGS
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          OTHER_LDFLAGS: $(inherited) $(BUILT_PRODUCTS_DIR)/PinVaultE2E.o
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
schemes:
  SampleClient:
    build:
      targets:
        SampleClient: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
